[project]
name = "resolveflow-agent"
version = "0.1.0"
description = "ResolveFlow Agent service: Harness-driven investigation over business evidence"
requires-python = ">=3.12,<3.13"

# Versions verified in T00 (see infra/versions.lock.yaml). The LangGraph +
# checkpointer + psycopg triple was resolved and exercised against a real
# PostgreSQL 16, so these ranges are not guesses.
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.5",
    "mcp==2.2.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Retrieval stack lands with T19 (policy index) and the evaluation runner with
# T23/T24. They are intentionally NOT declared yet: pulling sentence-transformers
# now would add roughly 2 GB of transitive torch to every sync for no T01 benefit.
# uv sync --all-extras stays correct because it simply has nothing extra to add.
retrieval = []
eval = []

[dependency-groups]
# T02 contract fixtures import jsonschema (validate the fixtures), PyYAML (read
# contracts/openapi-*.yaml) and cryptography (Ed25519 envelope signatures). All
# three were already in the resolved graph as transitive dependencies; declaring
# them here makes the test suite's imports explicit instead of accidental.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.26",
    "pyyaml>=6.0",
    "cryptography>=50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolveflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    # Structured logging and explicit timeouts are the project's concern, not
    # ruff's blanket rule; docs/engineering.md governs those instead.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
# langgraph ships partial typing; loosen only where the dependency is at fault.
module = ["langgraph.*"]
ignore_missing_imports = true