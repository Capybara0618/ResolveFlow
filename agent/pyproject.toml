[project]
name = "resolveflow-agent"
version = "0.1.0"
description = "ResolveFlow Agent service: Harness-driven investigation over business evidence"
requires-python = ">=3.12,<3.13"

# The agent framework is AgentScope 2.x (docs/agentscope-migration.md, user-approved 2026-09-25). The version is
# the one AS01 actually locked and tested in `spikes/agentscope/uv.lock`, not a range and not a dev build.
#
# LangGraph and its PostgreSQL checkpointer are **gone from production**: nothing in `src/` or `tests/` ever
# imported them (they were T00's compatibility trial and a plan for the graph layer that the domain Harness
# replaced), and `docs/agentscope-migration.md:55` requires production to stop depending on them directly. The T00
# experiment itself is historical evidence and stays where it is.
dependencies = [
    "agentscope==2.0.8",
    "psycopg[binary,pool]==3.3.5",
    "mcp==2.2.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
]

[tool.uv]
# AS02.1: `agentscope==2.0.8` declares `mcp<2.0.0`; this project serves its five whitelisted tools from a real
# mcp 2.2.0 stdio server (C06.2b) and `harness/mcp_client.py` is written against that version's API. Without this
# override resolution simply fails, so the conflict is a declared fact rather than a guess.
#
# The user decided (2026-09-25) that **MCP stays on this project's own mcp 2.2.0 client** rather than AgentScope's
# MCP path, because AgentScope 2.0.8's adapter reads four mcp-1.x camelCase attributes (`inputSchema`,
# `readOnlyHint`, `isError`, `McpError`) that mcp 2.x does not expose — measured, with the exact sites, in
# `reports/agentscope-migration/compatibility.md` §3. So AgentScope receives tools that are already ordinary Python
# objects and never touches its own MCP client; the override makes the resolver agree with that decision instead of
# forcing a downgrade of a major version no part of this project uses.
#
# It is the same mechanism AS01 validated in `spikes/agentscope/pyproject.toml`, and the spike keeps its own
# independent lock.
override-dependencies = ["mcp==2.2.0"]

[project.optional-dependencies]
# C07.1: the retrieval stack. It was an empty placeholder ("lands with T19") until the policy index needed
# it, and the three entries are the three pieces of the measured design rather than a wish list:
#
#   * `jieba`                 — Chinese tokenisation for the BM25 baseline. Pure Python.
#   * `rank_bm25`             — the BM25 implementation the baseline is measured with. Pure Python.
#   * `sentence-transformers` — the dense path, and the only heavy one: it brings torch (measured on this
#     machine: 811 MB of site-packages, 474 MB of which is torch) plus a 192 MB pinned model snapshot. The
#     model is `BAAI/bge-small-zh-v1.5` at revision `7999e1d3…`, 512 dimensions, MIT — measured before it
#     was written here, with the numbers and the one query it gets wrong in `reports/c071-policy-index/`.
#     The library's English default model is not a candidate: the corpus is Chinese.
#
# `uv sync --all-extras` therefore installs torch. The pure-Python pieces are declared separately and first
# so a reader can see which dependency costs what. `eval` stays empty: the experiment runner lands with C12.
retrieval = [
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
    "sentence-transformers==5.1.2",
]
eval = []

[dependency-groups]
# T02 contract fixtures import jsonschema (validate the fixtures), PyYAML (read
# contracts/openapi-*.yaml) and cryptography (Ed25519 envelope signatures). All
# three were already in the resolved graph as transitive dependencies; declaring
# them here makes the test suite's imports explicit instead of accidental.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.26",
    "pyyaml>=6.0",
    "cryptography>=50.0",
    # mypy --strict needs the stubs for the two libraries the contract fixtures read
    # with; without them the whole contracts package is untyped at its edges.
    "types-jsonschema>=4.26",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolveflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    # Structured logging and explicit timeouts are the project's concern, not
    # ruff's blanket rule; docs/engineering.md governs those instead.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
# AgentScope 2.0.8 ships partial typing; loosen only where the dependency is at fault, so a mistake in this
# project's own code is still an error.
module = ["agentscope.*"]
ignore_missing_imports = true

# **No override for C07.1's retrieval stack**, and that is a decision rather than an omission. The first version
# of this file had one for `sentence_transformers.*`/`jieba.*`/`rank_bm25.*`, and it made the project's own gate
# wrong in two directions at once:
#
#   * `scripts/verify.ps1` runs `mypy agent/src` from the **repository root**, where this file is not loaded. So
#     installing the extra flipped that step from "module not installed" (silently fine) to "installed, no stubs
#     published" (`import-untyped`, a hard error) — the gate failed on a dependency it had just acquired, for a
#     reason this override could not reach.
#   * With the override in place, the inline `# type: ignore[import-untyped]` the modules need instead became
#     *unused*, which strict mode reports as `unused-ignore`. So the two checks could not both be green.
#
# Naming the ignore at the import site is the form that holds wherever the checker runs and whether or not the
# optional extra is installed, and it keeps `sentence_transformers` itself analysed strictly on a machine that
# has it — which is the direction that can catch a mistake in this project's own use of it.