[project]
name = "resolveflow-agent"
version = "0.1.0"
description = "ResolveFlow Agent service: Harness-driven investigation over business evidence"
requires-python = ">=3.12,<3.13"

# The agent framework is AgentScope 2.x (docs/agentscope-migration.md, user-approved 2026-09-25). The version is
# the one AS01 actually locked and tested in `spikes/agentscope/uv.lock`, not a range and not a dev build.
#
# LangGraph and its PostgreSQL checkpointer are **gone from production**: nothing in `src/` or `tests/` ever
# imported them (they were T00's compatibility trial and a plan for the graph layer that the domain Harness
# replaced), and `docs/agentscope-migration.md:55` requires production to stop depending on them directly. The T00
# experiment itself is historical evidence and stays where it is.
dependencies = [
    "agentscope==2.0.8",
    "psycopg[binary,pool]==3.3.5",
    "mcp==2.2.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
]

[tool.uv]
# AS02.1: `agentscope==2.0.8` declares `mcp<2.0.0`; this project serves its five whitelisted tools from a real
# mcp 2.2.0 stdio server (C06.2b) and `harness/mcp_client.py` is written against that version's API. Without this
# override resolution simply fails, so the conflict is a declared fact rather than a guess.
#
# The user decided (2026-09-25) that **MCP stays on this project's own mcp 2.2.0 client** rather than AgentScope's
# MCP path, because AgentScope 2.0.8's adapter reads four mcp-1.x camelCase attributes (`inputSchema`,
# `readOnlyHint`, `isError`, `McpError`) that mcp 2.x does not expose — measured, with the exact sites, in
# `reports/agentscope-migration/compatibility.md` §3. So AgentScope receives tools that are already ordinary Python
# objects and never touches its own MCP client; the override makes the resolver agree with that decision instead of
# forcing a downgrade of a major version no part of this project uses.
#
# It is the same mechanism AS01 validated in `spikes/agentscope/pyproject.toml`, and the spike keeps its own
# independent lock.
override-dependencies = ["mcp==2.2.0"]

[project.optional-dependencies]
# Retrieval stack lands with T19 (policy index) and the evaluation runner with
# T23/T24. They are intentionally NOT declared yet: pulling sentence-transformers
# now would add roughly 2 GB of transitive torch to every sync for no T01 benefit.
# uv sync --all-extras stays correct because it simply has nothing extra to add.
retrieval = []
eval = []

[dependency-groups]
# T02 contract fixtures import jsonschema (validate the fixtures), PyYAML (read
# contracts/openapi-*.yaml) and cryptography (Ed25519 envelope signatures). All
# three were already in the resolved graph as transitive dependencies; declaring
# them here makes the test suite's imports explicit instead of accidental.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.26",
    "pyyaml>=6.0",
    "cryptography>=50.0",
    # mypy --strict needs the stubs for the two libraries the contract fixtures read
    # with; without them the whole contracts package is untyped at its edges.
    "types-jsonschema>=4.26",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolveflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    # Structured logging and explicit timeouts are the project's concern, not
    # ruff's blanket rule; docs/engineering.md governs those instead.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
# AgentScope 2.0.8 ships partial typing; loosen only where the dependency is at fault, so a mistake in this
# project's own code is still an error.
module = ["agentscope.*"]
ignore_missing_imports = true