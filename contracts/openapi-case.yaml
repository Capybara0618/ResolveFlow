openapi: 3.1.0
info:
  title: ResolveFlow case-service API
  version: 0.1.0
  description: |
    External API for the after-sales case aggregate, plus the internal endpoints the
    Agent and policy administration use.

    Authority: docs/contracts.md. This document is *generated from* that file, not
    the other way round; where the two disagree the Markdown wins and both are
    revised together (docs/contracts.md:131).

    Conventions enforced here:
    - JSON is snake_case (docs/contracts.md:3).
    - Writes require `Idempotency-Key`; updates of an existing resource require
      `If-Match: <version>` (docs/contracts.md:9).
    - The identity and `merchant_id` come from the verified token. `customer_id`
      in a body never decides ownership (docs/contracts.md:11).
    - The error body is the one shape in `components.schemas.ApiError`
      (docs/contracts.md:14).
servers:
  - url: https://api.resolveflow.local
    description: Local compose deployment; no public instance is published.
tags:
  - name: auth
    description: Demonstration login. Synthetic seeded accounts only.
  - name: orders
    description: Read-only order views scoped to the authenticated principal.
  - name: cases
    description: Case lifecycle, evidence and cancellation.
  - name: review
    description: Reviewer queue and human authorisation decisions.
  - name: operations
    description: Operator-only reconciliation of an uncertain operation.
  - name: policies
    description: Policy bundle import, publish and revoke.
  - name: internal
    description: Service-to-service endpoints. Never exposed through the gateway.
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange a demo credential for a JWT
      description: |
        Fixed seed accounts with hashed passwords (docs/domain-model.md:24). The role
        and merchant scope come from the stored account, never from the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: customer-1001
              password: demo-password
      responses:
        '200':
          description: Bearer token for the seeded principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List the current customer's order lines
      description: Cursor paging on created_at+id; deep offset is not offered (docs/contracts.md:15).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of order lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLinePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/orders/{order_id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Read one order
      description: A customer sees only their own order; staff need the merchant scope.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order with its lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLinePage'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases:
    post:
      tags: [cases]
      operationId: createCase
      summary: Submit an after-sales request for one order line
      description: |
        Returns 202 with the created case. One active case per (merchant, line) is
        enforced by `active_case_slot` (docs/domain-model.md:26).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreateRequest'
            example:
              line_id: '7001'
              description: 包裹丢了，希望退款
              requested_actions: [REFUND, EITHER]
      responses:
        '202':
          description: Case accepted; the run is queued after this is durable
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
  /api/v1/cases/{case_id}:
    get:
      tags: [cases]
      operationId: getCase
      summary: Read the authoritative case snapshot
      description: |
        SSE events are notifications only; this snapshot is what the UI and any
        decision must be based on (docs/contracts.md:42).
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case, latest proposal, authorisation and operation summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{case_id}/evidence:
    post:
      tags: [cases]
      operationId: appendEvidence
      summary: Append customer material
      description: |
        Evidence is appended, never overwritten; the revision increments and a new
        run is scheduled (docs/domain-model.md:27). Only states that can receive
        material accept this call.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceAppendRequest'
            example:
              question_id: q-damage-1
              text: 开箱后屏幕已碎裂，外箱有凹痕
              evidence_kind: CUSTOMER_STATEMENT
      responses:
        '202':
          description: Evidence stored; input_revision incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceSubmissionResponse'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
  /api/v1/cases/{case_id}/cancel:
    post:
      tags: [cases]
      operationId: cancelCase
      summary: Cancel a case before execution starts
      description: |
        AUTHORIZED and later states cannot be cancelled directly; the operation must
        be reconciled first (docs/domain-model.md:104).
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
            example: {"reason": "customer withdrew the request before authorization"}
      responses:
        '200':
          description: Case cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCancelResponse'
        '409':
          $ref: '#/components/responses/StateConflict'
  /api/v1/cases/{case_id}/events:
    get:
      tags: [cases]
      operationId: streamCaseEvents
      summary: Server-sent event stream for one case
      description: |
        Read with `fetch` so the Authorization header travels; the token never goes
        in the URL. A heartbeat is sent every 15 seconds and `Last-Event-ID`
        resumes from the persisted timeline sequence (docs/contracts.md:42).
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
          description: Timeline sequence to resume after.
      responses:
        '200':
          description: text/event-stream of case timeline events
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                progress:
                  summary: One progress notification and one heartbeat
                  value: |
                    id: 7
                    event: PROPOSAL_READY
                    data: {"case_id":"9c858901-8a57-4791-81fe-4c455b099bc9","sequence":7}

                    : heartbeat
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/review/cases:
    get:
      tags: [review]
      operationId: listReviewQueue
      summary: Reviewer queue within the caller's merchant
      description: 'Returns the reviewer merchant-scoped queue of cases awaiting a decision, ordered by created_at and id so a client resumes with a cursor instead of a deep offset (docs/contracts.md:15).'
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CaseStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cases awaiting review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueuePage'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
  /api/v1/cases/{case_id}/reviews:
    post:
      tags: [review]
      operationId: decideReview
      summary: Approve, reject or request more information
      description: |
        The decision is bound to `authorization_id` + `authorization_version`, so a
        decision computed against a superseded version cannot be applied
        (docs/domain-model.md:110).
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
            example:
              authorization_id: 7d444840-9dc0-11d1-b245-5ffdce74fad2
              authorization_version: 2
              decision: APPROVE
              reason: 金额超过自动阈值，证据与政策版本已复核
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
  /api/v1/cases/{case_id}/manual-proposals:
    post:
      tags: [review]
      operationId: createManualProposal
      summary: Reviewer authors a replacement proposal
      description: |
        Creates a new proposal and revision. An existing payload is never edited in
        place (docs/contracts.md:35, docs/domain-model.md:110).
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualProposalRequest'
            example: {"action": "REFUND", "evidence_refs": [{"observation_id": "3f2504e0-4f89-41d3-9a0c-0305e82c3301", "source_ref": "PAYMENT_LEDGER:order-7001:line-1", "source_version": "ledger-2026-09-18T05:00:00Z", "content_hash": "9f2c1b7d4e5a6081c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0"}], "policy_refs": [{"bundle_id": "policy-2026.09-refund-v3", "version": "v3", "rule_id": "R-104", "chunk_id": "R-104#duplicate-charge", "content_hash": "1c4d8f2b0a9e7c6d5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4"}], "reason": "the payment ledger shows two settled charges for one line"}
      responses:
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '201':
          description: New proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualProposalResponse'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
  /api/v1/cases/{case_id}/reviewed-evidence:
    post:
      tags: [review]
      operationId: recordReviewedEvidence
      summary: Record a human verification of customer material
      description: |
        Appends a REVIEWER_VERIFICATION evidence record, increments the revision and
        revokes any unconsumed authorisation built on the old revision
        (docs/contracts.md:36).
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewedEvidenceRequest'
            example: {"source_evidence_id": "3f2504e0-4f89-41d3-9a0c-0305e82c3301", "verification_result": "CONFIRMED", "reason": "the carrier screenshot matches the tracking id in the shipment record"}
      responses:
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '202':
          description: Verification appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewedEvidenceResponse'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
  /api/v1/operations/{operation_id}/reconcile:
    post:
      tags: [operations]
      operationId: reconcileOperation
      summary: Ask the target service for the authoritative operation state
      description: |
        Operator-only, idempotent, and explicitly not a second payment: it triggers a
        status query along the same operation id (docs/contracts.md:37).
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
            example: {"reason": "commerce was queried after an UNKNOWN result and reports no refund for this operation"}
      responses:
        '200':
          description: Current state after the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResponse'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '409':
          $ref: '#/components/responses/StateConflict'
  /api/v1/policies/import:
    post:
      tags: [policies]
      operationId: importPolicyBundle
      summary: Import a policy bundle as a draft
      description: 'Stores an imported policy bundle as a DRAFT owned by the importing admin. Import and publish are separate steps: publishing is the hash-checked, immutable one (docs/contracts.md:39).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyImportRequest'
            example: {"bundle_json": {"bundle_id": "policy-2026.09-refund-v3", "rules": [{"rule_id": "R-104"}]}, "source_markdown": "# Refund policy v3\n\nDuplicate settled charges on one line are refundable."}
      responses:
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyImportResponse'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
  /api/v1/policies/{bundle_id}/publish:
    post:
      tags: [policies]
      operationId: publishPolicyBundle
      summary: Publish an immutable policy version
      description: |
        `expected_hash` guards against publishing bytes other than the reviewed ones;
        effective-range overlap is rejected inside the publish transaction.
      parameters:
        - $ref: '#/components/parameters/BundleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyPublishRequest'
            example: {"expected_hash": "9f2c1b7d4e5a6081c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0"}
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPublishResponse'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
  /api/v1/policies/{bundle_id}/revoke:
    post:
      tags: [policies]
      operationId: revokePolicyBundle
      summary: Revoke a published bundle
      description: Revocation increments safety_epoch so authorisations built on it are stale.
      parameters:
        - $ref: '#/components/parameters/BundleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
            example: {"reason": "superseded by policy-2026.10-refund-v4"}
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRevokeResponse'
        '409':
          $ref: '#/components/responses/StateConflict'
  /internal/v1/cases/{case_id}/agent-callbacks:
    post:
      tags: [internal]
      operationId: receiveAgentCallback
      summary: Receive a STARTED/QUESTION/PROPOSAL/FAILED callback from the Agent
      description: |
        Idempotent on `callback_id`. A duplicate returns 200 with disposition
        DUPLICATE; a stale revision returns 200 with disposition STALE and is not
        retried; only the current revision is ACCEPTED (docs/contracts.md:77).
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCallbackRequest'
            example: {"callback_id": "cb-7f3a1c4d", "run_id": "018f0a3c-4b1e-7a2d-9f30-1c2b3a4d5e6f", "input_revision": 4, "kind": "PROPOSAL", "payload": {"proposal_id": "pr-2b8e6d10", "recommended_action": "REFUND"}}
      responses:
        '200':
          description: Callback classified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCallbackResponse'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
  /internal/v1/cases/{case_id}/evidence:
    get:
      tags: [internal]
      operationId: readCaseEvidenceInternal
      summary: Read current evidence references for the Agent
      description: The Agent gets references and hashes, not a writable surface.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Evidence references at the current revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceListResponse'
  /internal/v1/cases/{case_id}/policy-manifest:
    get:
      tags: [internal]
      operationId: readPolicyManifest
      summary: Read the bundle/version/hash set a run must use
      description: 'Returns the bundle/version/hash and effective interval a run must cite, so the Agent reads one manifest instead of re-deriving which rules applied to the case.'
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Effective policy manifest for this case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyManifestResponse'
  /internal/v1/policies/{bundle_id}:
    get:
      tags: [internal]
      operationId: readPublishedPolicy
      summary: Read a published bundle with its rules and hash
      description: 'Returns the published policy source, rules and content hash. The caller verifies the hash, so Java never has to trust a Python summary of what the policy said.'
      parameters:
        - $ref: '#/components/parameters/BundleId'
      responses:
        '200':
          description: Published policy content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedPolicyBundle'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/runs/{run_id}/tool-credential:
    post:
      tags: [internal]
      operationId: issueToolCredential
      summary: Re-sign a 5-minute tool credential for a live run
      description: |
        The worker renews through case-service, which confirms the run is still valid
        and not taken over. A stale worker must not be able to renew
        (docs/contracts.md:93).
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Fresh scoped credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCredentialResponse'
        '409':
          $ref: '#/components/responses/StateConflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Issuer, audience and key location are configured per environment
        (docs/engineering.md:98). A UUID is never an authentication credential.
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Opaque created_at+id cursor from the previous page.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
      description: |
        Same key with the same payload returns the original resource; the same key
        with a different payload is 409 IDEMPOTENCY_CONFLICT (docs/contracts.md:13).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
      description: Expected current `version` of the resource being modified.
  headers:
    Location:
      description: Canonical URL of the created resource.
      schema:
        type: string
        format: uri-reference
  responses:
    ValidationFailed:
      description: Malformed request (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_FAILED
            message: requested_actions must contain at least one action
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    Unauthenticated:
      description: Missing or invalid credentials (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHENTICATED
            message: bearer token is missing or expired
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    ForbiddenScope:
      description: Authenticated but outside the required scope (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN_SCOPE
            message: the caller scope does not include the required action
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    NotFound:
      description: Not visible to this principal (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: the resource does not exist under this principal
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    IdempotencyConflict:
      description: Idempotency key reused with a different payload (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: IDEMPOTENCY_CONFLICT
            message: this Idempotency-Key was used with a different request body
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    StateConflict:
      description: The resource is not in a state that permits this transition (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: STATE_CONFLICT
            message: the resource is not in a state that accepts this request
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    SemanticInvalid:
      description: Well-formed but semantically invalid for the business rules (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SEMANTIC_INVALID
            message: the request is well formed but cannot be satisfied
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    RateLimited:
      description: Rate limit exceeded (429); safe to retry after the given delay
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RATE_LIMITED
            message: too many login attempts
            retryable: true
            trace_id: 0af7651916cd43dd8448eb211c80319c
    ServiceUnavailable:
      description: Temporarily unavailable (503); retryable, and never a failed refund
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SERVICE_UNAVAILABLE
            message: case database is temporarily unavailable
            retryable: true
            trace_id: 0af7651916cd43dd8448eb211c80319c
  schemas:
    # ---------------------------------------------------------------- scalars
    Uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Sha256Hex:
      type: string
      pattern: '^[a-f0-9]{64}$'
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    InputRevision:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    AmountMinor:
      type: integer
      minimum: 0
      maximum: 1000000000
      description: CNY minor units. Never a float (docs/contracts.md:19).
    ReasonCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{1,63}$'
    Traceparent:
      type: string
      pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    Action:
      type: string
      enum: [REFUND, RESHIP]
    RequestedAction:
      type: string
      enum: [REFUND, RESHIP, EITHER]
      description: What the customer asked for; the executable action is a subset.
    CaseType:
      type: string
      enum: [LOGISTICS, DAMAGED, WRONG_MISSING, OUT_OF_SCOPE]
    RecommendedAction:
      type: string
      enum: [REFUND, RESHIP, REQUEST_INFO, MANUAL_REVIEW, REJECT]
    CaseStatus:
      type: string
      enum:
        [QUEUED, ANALYZING, WAITING_CUSTOMER, PENDING_REVIEW, AUTHORIZED,
         EXECUTING, RECONCILING, CLOSED_SUCCESS, CLOSED_REJECTED, CANCELLED]
    ProposalStatus:
      type: string
      enum: [PROPOSED, VALIDATED, STALE, REJECTED]
    AuthorizationStatus:
      type: string
      enum: [PENDING_REVIEW, APPROVED, REJECTED, EXPIRED, REVOKED, CONSUMED]
    RiskRoute:
      type: string
      enum: [AUTO, REVIEW, NEED_INFO, BLOCK]
      description: Computed by Java, never by the model.
    EvidenceSourceType:
      type: string
      enum:
        [ORDER_LINE, PAYMENT_LEDGER, LINE_ENTITLEMENT, SHIPMENT, SHIPMENT_TRACK,
         PACKING_MANIFEST, CUSTOMER_STATEMENT, REVIEWER_VERIFICATION, POLICY_RULE]
    OperationState:
      type: string
      enum:
        [CREATED, RESERVING, RESERVED, RECEIVED, STARTING, DISPATCHED, IN_PROGRESS,
         TARGET_SUCCEEDED, COMMITTING, SUCCEEDED, UNKNOWN, RELEASING, FAILED, CANCELLED]
    CallbackKind:
      type: string
      enum: [STARTED, QUESTION, PROPOSAL, FAILED]
    CallbackDisposition:
      type: string
      enum: [ACCEPTED, DUPLICATE, STALE]
    TimelineEventType:
      type: string
      enum:
        [CASE_CREATED, AGENT_STARTED, QUESTION_REQUIRED, PROPOSAL_READY,
         APPROVAL_REQUIRED, EXECUTION_UPDATED, CASE_CLOSED]
    PageMeta:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        next_cursor:
          type: [string, 'null']
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    # ----------------------------------------------------------------- errors
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 2000
        retryable:
          type: boolean
          description: |
            Carried explicitly so a caller never infers retryability from the status
            code. A network timeout is not a failed refund (docs/contracts.md:14).
        trace_id:
          type: [string, 'null']
          maxLength: 64
        details:
          type: [object, 'null']
          additionalProperties: true
    # The HTTP error body is the flat object docs/contracts.md:14 fixes and
    # com.resolveflow.shared.error.ApiError serialises. This alias keeps the
    # response-body name the responses below reference without restating the shape.
    ErrorResponse:
      $ref: '#/components/schemas/ApiError'
    # ------------------------------------------------------------------- auth
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 1
          maxLength: 200
    LoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, role, merchant_id]
      properties:
        access_token:
          type: string
          minLength: 1
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 86400
        role:
          type: string
          minLength: 1
        merchant_id:
          type: string
          minLength: 1
        customer_id:
          type: [string, 'null']
    # ----------------------------------------------------------------- orders
    OrderLineSummary:
      type: object
      additionalProperties: false
      required: [order_id, line_id, sku, category, quantity, line_paid_amount, currency, paid_at, status, version]
      properties:
        order_id:
          $ref: '#/components/schemas/Uuid'
        line_id:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        line_paid_amount:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          type: string
          const: CNY
        paid_at:
          type: string
          format: date-time
        status:
          type: string
          minLength: 1
        version:
          $ref: '#/components/schemas/Version'
    OrderLinePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
    # ------------------------------------------------------------------ cases
    CaseCreateRequest:
      type: object
      additionalProperties: false
      required: [line_id, description, requested_actions]
      properties:
        line_id:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
          maxLength: 4000
        requested_actions:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RequestedAction'
    CaseCreatedResponse:
      type: object
      additionalProperties: false
      required: [case_id, status, input_revision, version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CaseStatus'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        version:
          $ref: '#/components/schemas/Version'
    EvidenceRef:
      type: object
      additionalProperties: false
      required: [observation_id, source_ref, source_version, content_hash]
      properties:
        observation_id:
          type: string
          minLength: 1
          maxLength: 64
        source_ref:
          type: string
          minLength: 1
          maxLength: 200
          description: A controlled reference. A URL is rejected (docs/contracts.md:62).
        source_version:
          type: string
          minLength: 1
          maxLength: 64
        content_hash:
          $ref: '#/components/schemas/Sha256Hex'
    PolicyRef:
      type: object
      additionalProperties: false
      required: [bundle_id, version, rule_id, chunk_id, content_hash]
      properties:
        bundle_id:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: string
          minLength: 1
          maxLength: 64
        rule_id:
          type: string
          minLength: 1
          maxLength: 64
        chunk_id:
          type: string
          minLength: 1
          maxLength: 64
        content_hash:
          $ref: '#/components/schemas/Sha256Hex'
    EvidenceAppendRequest:
      type: object
      additionalProperties: false
      required: [text, evidence_kind]
      properties:
        question_id:
          type: [string, 'null']
        text:
          type: string
          minLength: 1
          maxLength: 8000
        evidence_kind:
          $ref: '#/components/schemas/EvidenceSourceType'
    EvidenceSubmissionResponse:
      type: object
      additionalProperties: false
      required: [case_id, input_revision, version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        version:
          $ref: '#/components/schemas/Version'
    CaseCancelResponse:
      type: object
      additionalProperties: false
      required: [case_id, status, version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CaseStatus'
        version:
          $ref: '#/components/schemas/Version'
    ProposalView:
      type: object
      additionalProperties: false
      required: [proposal_id, run_id, input_revision, case_type, recommended_action, summary, reason_codes, status]
      properties:
        proposal_id:
          $ref: '#/components/schemas/Uuid'
        run_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        case_type:
          $ref: '#/components/schemas/CaseType'
        recommended_action:
          $ref: '#/components/schemas/RecommendedAction'
        suggested_amount_minor:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000000
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        reason_codes:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ReasonCode'
        evidence_refs:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/EvidenceRef'
        policy_refs:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PolicyRef'
        missing_evidence:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 200
        status:
          $ref: '#/components/schemas/ProposalStatus'
        route:
          oneOf:
            - $ref: '#/components/schemas/RiskRoute'
            - type: 'null'
    AuthorizationState:
      type: object
      additionalProperties: false
      required: [authorization_id, authorization_version, status, action, planned_operation_id, payload_hash]
      properties:
        authorization_id:
          $ref: '#/components/schemas/Uuid'
        authorization_version:
          $ref: '#/components/schemas/Version'
        status:
          $ref: '#/components/schemas/AuthorizationStatus'
        expires_at:
          # anyOf rather than type: [string, 'null'] because a nullable field that
          # also carries a format must apply that format to the string branch only.
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        action:
          $ref: '#/components/schemas/Action'
        planned_operation_id:
          $ref: '#/components/schemas/Uuid'
          description: Pre-allocated at authorisation time so the hash is fixed before approval.
        payload_hash:
          $ref: '#/components/schemas/Sha256Hex'
    OperationView:
      type: object
      additionalProperties: false
      required: [operation_id, action, state, target_service, version]
      properties:
        operation_id:
          $ref: '#/components/schemas/Uuid'
        action:
          $ref: '#/components/schemas/Action'
        state:
          $ref: '#/components/schemas/OperationState'
        target_service:
          type: string
          minLength: 1
        amount_minor:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000000
        quantity:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
        version:
          $ref: '#/components/schemas/Version'
    CaseSummary:
      type: object
      additionalProperties: false
      required: [case_id, status, input_revision, version, created_at, updated_at, requested_actions, line_id]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CaseStatus'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        requested_actions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RequestedAction'
        line_id:
          type: string
          minLength: 1
    CaseSnapshot:
      type: object
      additionalProperties: false
      required: [case]
      properties:
        case:
          $ref: '#/components/schemas/CaseSummary'
        proposal:
          oneOf:
            - $ref: '#/components/schemas/ProposalView'
            - type: 'null'
        authorization:
          oneOf:
            - $ref: '#/components/schemas/AuthorizationState'
            - type: 'null'
        operation:
          oneOf:
            - $ref: '#/components/schemas/OperationView'
            - type: 'null'
        evidence:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/EvidenceRef'
    # ----------------------------------------------------------------- review
    ReviewQueueItem:
      type: object
      additionalProperties: false
      required: [case_id, status, input_revision, version, updated_at, line_id, requested_actions]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CaseStatus'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        version:
          $ref: '#/components/schemas/Version'
        updated_at:
          type: string
          format: date-time
        line_id:
          type: string
          minLength: 1
        requested_actions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RequestedAction'
    ReviewQueuePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        page:
          $ref: '#/components/schemas/PageMeta'
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [authorization_id, authorization_version, decision, reason]
      properties:
        authorization_id:
          $ref: '#/components/schemas/Uuid'
        authorization_version:
          $ref: '#/components/schemas/Version'
          description: The version the reviewer saw. A stale version cannot be applied.
        decision:
          type: string
          enum: [APPROVE, REJECT, REQUEST_INFO]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ReviewResponse:
      type: object
      additionalProperties: false
      required: [case_id, authorization_id, authorization_version, status, case_version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        authorization_id:
          $ref: '#/components/schemas/Uuid'
        authorization_version:
          $ref: '#/components/schemas/Version'
        status:
          $ref: '#/components/schemas/AuthorizationStatus'
        case_version:
          $ref: '#/components/schemas/Version'
    ManualProposalRequest:
      type: object
      additionalProperties: false
      required: [action, evidence_refs, policy_refs, reason]
      properties:
        action:
          $ref: '#/components/schemas/Action'
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/EvidenceRef'
        policy_refs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PolicyRef'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ManualProposalResponse:
      type: object
      additionalProperties: false
      required: [case_id, proposal_id, input_revision, case_version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        proposal_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        case_version:
          $ref: '#/components/schemas/Version'
    ReviewedEvidenceRequest:
      type: object
      additionalProperties: false
      required: [source_evidence_id, verification_result, reason]
      properties:
        source_evidence_id:
          type: string
          minLength: 1
          maxLength: 64
        verification_result:
          type: string
          enum: [CONFIRMED, REFUTED, INCONCLUSIVE]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ReviewedEvidenceResponse:
      type: object
      additionalProperties: false
      required: [case_id, evidence_id, input_revision, case_version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        evidence_id:
          type: string
          minLength: 1
          maxLength: 64
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        case_version:
          $ref: '#/components/schemas/Version'
        revoked_authorization_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    # ------------------------------------------------------------- operations
    ReconcileResponse:
      type: object
      additionalProperties: false
      required: [operation_id, state, reconciled, version]
      properties:
        operation_id:
          $ref: '#/components/schemas/Uuid'
        state:
          $ref: '#/components/schemas/OperationState'
        reconciled:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'
    # --------------------------------------------------------------- policies
    PolicyImportRequest:
      type: object
      additionalProperties: false
      required: [bundle_json, source_markdown]
      properties:
        bundle_json:
          type: object
          additionalProperties: true
        source_markdown:
          type: string
          minLength: 1
    PolicyImportResponse:
      type: object
      additionalProperties: false
      required: [bundle_id, status, content_hash]
      properties:
        bundle_id:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          const: DRAFT
        content_hash:
          $ref: '#/components/schemas/Sha256Hex'
    PolicyPublishRequest:
      type: object
      additionalProperties: false
      required: [expected_hash]
      properties:
        expected_hash:
          $ref: '#/components/schemas/Sha256Hex'
    PolicyPublishResponse:
      type: object
      additionalProperties: false
      required: [bundle_id, version, status, safety_epoch]
      properties:
        bundle_id:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          const: PUBLISHED
        safety_epoch:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    PolicyRevokeResponse:
      type: object
      additionalProperties: false
      required: [bundle_id, status, safety_epoch]
      properties:
        bundle_id:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          const: REVOKED
        safety_epoch:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    PublishedPolicyRule:
      type: object
      additionalProperties: false
      required: [rule_id, action, requires_human, text]
      properties:
        rule_id:
          type: string
          minLength: 1
          maxLength: 64
        action:
          $ref: '#/components/schemas/Action'
        amount_cap_minor:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000000
        requires_human:
          type: boolean
        text:
          type: string
          minLength: 1
    PublishedPolicyBundle:
      type: object
      additionalProperties: false
      required: [bundle_id, merchant_id, version, category, effective_from, safety_epoch, rules, source_hash]
      properties:
        bundle_id:
          type: string
          minLength: 1
          maxLength: 64
        merchant_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
          maxLength: 64
        category:
          $ref: '#/components/schemas/CaseType'
        effective_from:
          type: string
          format: date-time
        effective_to:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        safety_epoch:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        rules:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/PublishedPolicyRule'
        source_hash:
          $ref: '#/components/schemas/Sha256Hex'
    # --------------------------------------------------------------- internal
    AgentQuestion:
      type: object
      additionalProperties: false
      required: [field, prompt]
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 64
        prompt:
          type: string
          minLength: 1
          maxLength: 500
    AgentCallbackRequest:
      type: object
      additionalProperties: false
      required: [callback_id, run_id, input_revision, kind, payload]
      properties:
        callback_id:
          type: string
          minLength: 1
          maxLength: 64
        run_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        kind:
          $ref: '#/components/schemas/CallbackKind'
        payload:
          type: object
          additionalProperties: true
          description: |
            STARTED={started_at}; QUESTION={question_id,questions,reason_codes};
            PROPOSAL=the agent-proposal document; FAILED={reason_codes,retryable,
            last_observation_refs} (docs/contracts.md:75).
        traceparent:
          oneOf:
            - $ref: '#/components/schemas/Traceparent'
            - type: 'null'
      examples:
        - callback_id: cb-9c858901-1-question
          run_id: e2e2e2e2-3333-4444-8555-aaaaaaaaaaaa
          input_revision: 1
          kind: QUESTION
          payload:
            question_id: q-damage-1
            questions:
              - field: damage_description
                prompt: 请描述损坏部位和程度
              - field: signing_date
                prompt: 请提供签收日期
            reason_codes: [DAMAGE_NOT_DESCRIBED]
    AgentCallbackResponse:
      type: object
      additionalProperties: false
      required: [disposition]
      properties:
        disposition:
          $ref: '#/components/schemas/CallbackDisposition'
        case_version:
          oneOf:
            - $ref: '#/components/schemas/Version'
            - type: 'null'
    EvidenceListResponse:
      type: object
      additionalProperties: false
      required: [case_id, input_revision, evidence]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        evidence:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/EvidenceRef'
    PolicyManifestResponse:
      type: object
      additionalProperties: false
      required: [bundles, effective_from]
      properties:
        bundles:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [bundle_ids, manifest_hash, safety_epoch]
            properties:
              bundle_ids:
                type: array
                minItems: 1
                maxItems: 16
                items:
                  type: string
                  minLength: 1
              manifest_hash:
                $ref: '#/components/schemas/Sha256Hex'
              safety_epoch:
                type: integer
                minimum: 0
                maximum: 9007199254740991
        effective_from:
          type: string
          format: date-time
        effective_to:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    ToolCredentialResponse:
      type: object
      additionalProperties: false
