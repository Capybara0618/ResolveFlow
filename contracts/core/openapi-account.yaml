openapi: 3.1.0
info:
  title: ResolveFlow 购物基础功能
  version: '2026-10-29'
security:
- bearerAuth: []
paths:
  /api/v1/account/login-name:
    post:
      operationId: changeBuyerLoginName
      summary: 验证当前密码并修改买家登录账号，原身份和订单关联保持不变
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeLoginName'
      responses:
        '200':
          description: 修改成功，旧会话失效，使用新账号重新登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginNameChanged'
        '400':
          description: 账号格式或当前密码错误
        '401':
          description: 会话失效
        '403':
          description: 非买家账号
        '409':
          description: 版本冲突或账号名已占用
        '429':
          description: 请求过于频繁
  /api/v1/account/profile:
    get:
      summary: 读取本人资料
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
    post:
      summary: 修改本人昵称
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProfile'
  /api/v1/account/avatar:
    get:
      summary: 读取本人当前头像，未设置时404
      responses:
        '200':
          description: 成功
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
    post:
      summary: 上传PNG或JPEG头像，最大2MB及4096像素边长
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - expected_version
              properties:
                file:
                  type: string
                  format: binary
                expected_version: &id001
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
  /api/v1/account/avatar/reset:
    post:
      summary: 使用默认头像
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Version'
  /api/v1/account/addresses:
    get:
      summary: 读取本人地址簿
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
                    maxItems: 20
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
    post:
      summary: 新增本人地址
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAddress'
  /api/v1/account/addresses/{id}:
    post:
      summary: 更新本人地址，需expected_version
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAddress'
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  /api/v1/account/addresses/{id}/delete:
    post:
      summary: 删除本人地址
      responses:
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
        '204':
          description: 已删除
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Version'
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  /api/v1/support/conversations/{conversation}/messages/{message}/identity:
    get:
      summary: 读取本人可见消息的作者昵称和头像标识
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageIdentity'
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
    parameters:
    - in: path
      name: conversation
      required: true
      schema:
        type: string
    - in: path
      name: message
      required: true
      schema:
        type: string
  /api/v1/support/conversations/{conversation}/messages/{message}/identity/avatar:
    get:
      summary: 读取本人可见消息的作者当前头像
      responses:
        '200':
          description: 成功
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
    parameters:
    - in: path
      name: conversation
      required: true
      schema:
        type: string
    - in: path
      name: message
      required: true
      schema:
        type: string
  /api/v1/shop/purchases/{purchase_id}/shipping:
    get:
      summary: 读取本人订单或草稿的固定收货信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingView'
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
    parameters:
    - in: path
      name: purchase_id
      required: true
      schema:
        type: string
  /api/v1/merchant/orders/{order_id}/shipping:
    get:
      summary: 读取本店订单的固定收货信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingView'
        '401':
          description: 登录失效
        '404':
          description: 记录不可见或不存在
        '409':
          description: 版本已变化
    parameters:
    - in: path
      name: order_id
      required: true
      schema:
        type: string
  /api/v1/account/notifications:
    get:
      summary: 读取本人的站内提醒，按时间倒序分页
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          maxLength: 512
      responses:
        '200':
          description: 消息和全部未读数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notifications'
        '401':
          description: 登录失效
        '403':
          description: 无此角色消息
  /api/v1/account/notifications/{id}/read:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        maxLength: 80
    post:
      summary: 本人可见消息标为已读，重复操作幂等
      responses:
        '204':
          description: 已读
        '401':
          description: 登录失效
        '404':
          description: 消息不可见或不存在
  /api/v1/auth/register:
    post:
      summary: 注册买家并生成恢复密钥
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryReceipt'
        '400':
          description: 输入无效或验证不通过
        '409':
          description: 账号不可用
        '429':
          description: 操作过于频繁
      security: []
  /api/v1/auth/recover:
    post:
      summary: 凭恢复密钥重设密码，同时轮换密钥并使原登录失效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryReceipt'
        '400':
          description: 输入无效或验证不通过
        '409':
          description: 账号不可用
        '429':
          description: 操作过于频繁
      security: []
  /api/v1/account/recovery-key:
    post:
      summary: 本人验证当前密码并重新生成恢复密钥
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRotate'
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryReceipt'
        '400':
          description: 输入无效或验证不通过
        '409':
          description: 账号不可用
        '429':
          description: 操作过于频繁
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChangeLoginName:
      type: object
      additionalProperties: false
      required: [login_name, current_password, expected_version]
      properties:
        login_name:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{2,59}$'
        current_password:
          type: string
          maxLength: 200
        expected_version:
          type: integer
          minimum: 1
    LoginNameChanged:
      type: object
      additionalProperties: false
      required: [login_name]
      properties:
        login_name:
          type: string
    Profile:
      type: object
      required:
      - username
      - display_name
      - avatar_id
      - version
      properties:
        username:
          type: string
          maxLength: 120
        display_name:
          type: string
          maxLength: 120
        avatar_id:
          type:
          - string
          - 'null'
        login_name:
          type: string
          maxLength: 120
        phone: &profilePhone
          type: [string, 'null']
          maxLength: 32
        gender: &profileGender
          type: [string, 'null']
          enum: [UNDISCLOSED, FEMALE, MALE, OTHER, null]
        birth_date: &profileBirthday
          type: [string, 'null']
          format: date
        version: *id001
    EditProfile:
      type: object
      additionalProperties: false
      required:
      - display_name
      - expected_version
      properties:
        display_name:
          type: string
          maxLength: 120
        phone: *profilePhone
        gender: *profileGender
        birth_date: *profileBirthday
        expected_version: *id001
    Address:
      type: object
      required:
      - address_id
      - recipient
      - phone
      - province
      - city
      - district
      - detail
      - is_default
      - version
      properties:
        address_id:
          type: string
          format: uuid
        recipient: &id002
          type: string
          maxLength: 80
        phone: &id003
          type: string
          maxLength: 32
        province: &id004
          type: string
          maxLength: 80
        city: &id005
          type: string
          maxLength: 80
        district: &id006
          type: string
          maxLength: 80
        detail: &id007
          type: string
          maxLength: 300
        is_default: &id008
          type: boolean
        version: *id001
    EditAddress:
      type: object
      additionalProperties: false
      required:
      - recipient
      - phone
      - province
      - city
      - district
      - detail
      properties:
        recipient: *id002
        phone: *id003
        province: *id004
        city: *id005
        district: *id006
        detail: *id007
        is_default: *id008
        expected_version: *id001
    Version:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version: *id001
    MessageIdentity:
      type: object
      required:
      - display_name
      - avatar_id
      - author
      properties:
        display_name:
          type: string
          maxLength: 120
        avatar_id:
          type:
          - string
          - 'null'
        author:
          type: string
          enum:
          - CUSTOMER
          - MERCHANT
          - ASSISTANT
    ShippingView:
      type: object
      required:
      - shipping
      properties:
        shipping:
          oneOf:
          - $ref: ./openapi-case.yaml#/components/schemas/ShippingSnapshot
          - type: 'null'
    Notification:
      type: object
      additionalProperties: false
      required:
      - notification_id
      - title
      - target
      - target_id
      - conversation_id
      - created_at
      - read
      properties:
        store_id:
          type: [string, 'null']
        sender_name:
          type: string
        sender_kind:
          type: string
          enum: [MERCHANT, CUSTOMER, ASSISTANT]
        notification_id:
          type: string
          maxLength: 80
        title:
          type: string
        target:
          type: string
          enum:
          - SUPPORT
          - TICKET
          - APPLICATION
          - CASE
        target_id:
          type: string
        conversation_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        read:
          type: boolean
    Notifications:
      type: object
      additionalProperties: false
      required:
      - items
      - unread_count
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/Notification'
        unread_count:
          type: integer
          minimum: 0
        next_cursor:
          type:
          - string
          - 'null'
    RegistrationRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - display_name
      - password
      properties:
        username: &id009
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{2,59}$
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        password: &id010
          type: string
          minLength: 8
          maxLength: 200
          writeOnly: true
    RecoveryRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - recovery_key
      - new_password
      properties:
        username: *id009
        recovery_key:
          type: string
          pattern: ^[a-f0-9]{64}$
          writeOnly: true
        new_password: *id010
    RecoveryReceipt:
      type: object
      additionalProperties: false
      required:
      - username
      - recovery_key
      properties:
        username: *id009
        recovery_key:
          type: string
          pattern: ^[a-f0-9]{64}$
          readOnly: true
      description: 一次性展示的新恢复密钥，请妥善保存；服务端仅持久化哈希。
    RecoveryRotate:
      type: object
      additionalProperties: false
      required:
      - current_password
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 200
          writeOnly: true
