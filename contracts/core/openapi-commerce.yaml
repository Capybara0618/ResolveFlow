          minimum: 1
          maximum: 100
    ShopDraftRequest:
      type: object
      additionalProperties: false
      required:
      - sku_id
      - quantity
      - expected_sku_version
      properties:
        sku_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        expected_sku_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    ShopQuote:
      type: object
      additionalProperties: false
      required:
      - product
      - sku
      - quantity
      - total_amount
      - currency
      properties:
        product:
          $ref: '#/components/schemas/ShopProduct'
        sku:
          $ref: '#/components/schemas/ShopSku'
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        total_amount:
          type: integer
          minimum: 1
          maximum: 10000000000
        currency:
          type: string
          const: CNY
    ShopDraft:
      type: object
      additionalProperties: false
      required:
      - draft_id
      - store_id
      - store_name
      - product_id
      - product_name
      - asset_key
      - sku_id
      - variant
      - quantity
      - unit_amount
      - total_amount
      - currency
      - status
      - created_at
      - expires_at
      properties:
        draft_id:
          type: string
          format: uuid
        store_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        store_name:
          type: string
          minLength: 1
          maxLength: 120
        product_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        product_name:
          type: string
          minLength: 1
          maxLength: 120
        asset_key:
          type: string
          minLength: 1
          maxLength: 32
        sku_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        variant:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        unit_amount:
          type: integer
          minimum: 1
          maximum: 100000000
        total_amount:
          type: integer
          minimum: 1
          maximum: 10000000000
        currency:
          type: string
          const: CNY
        status:
          enum:
          - WAITING_PAYMENT
          - PAYMENT_PENDING
          - PAID
          - CANCELLED
          - EXPIRED
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    ShopDraftCommand:
      type: object
      additionalProperties: false
      required:
      - merchant_id
      - customer_id
      - idempotency_key
      - request
      properties:
        merchant_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        customer_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        request:
          $ref: '#/components/schemas/ShopDraftRequest'
    PageMeta:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        next_cursor:
          type: [string, 'null']
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    OrderLineSummary:
      type: object
      additionalProperties: false
      required:
        [order_id, line_id, sku, category, quantity, line_paid_amount, currency, paid_at, status, version]
      properties:
        order_id:
          $ref: '#/components/schemas/Uuid'
        line_id:
          type: string
          minLength: 1
          maxLength: 64
        sku:
          type: string
          minLength: 1
          maxLength: 64
        # Two optional presentation members (tasks/dsh-reviewer/05-fields-visual.md section 2).
        # They are absent or null for every row that predates them, which is why they are not
        # required: a historical response must not become "missing a required field". They are
        # display data only - not part of the line context a refund is recomputed from - and a
        # reader that has none falls back to the sku.
        product_name:
          type: [string, 'null']
          maxLength: 200
        variant_text:
          type: [string, 'null']
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        line_paid_amount:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          type: string
          const: CNY
        paid_at:
          type: string
          format: date-time
        status:
          type: string
          minLength: 1
          maxLength: 64
        version:
          $ref: '#/components/schemas/Version'
    OrderLinePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
    Uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Sha256Hex:
      type: string
      pattern: '^[a-f0-9]{64}$'
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    AmountMinor:
      type: integer
      minimum: 0
      maximum: 1000000000
      description: CNY minor units. Never a float (docs/core-contracts.md:17).
    OperationState:
      type: string
      enum: [RECEIVED, IN_PROGRESS, UNKNOWN, SUCCEEDED, FAILED]
      description: |
        The core refund_operation vocabulary, exactly the five states
        docs/domain-model.md:57 assigns to core: RECEIVED/IN_PROGRESS/UNKNOWN/SUCCEEDED/
        FAILED, and explicitly not the compat two-phase target protocol
        (STARTING/CANCELLED and the reserve/commit states), which core does not run.
        Only SUCCEEDED/FAILED/UNKNOWN ever reach the result event
        (docs/core-contracts.md:67).
    LineRefundState:
      type: string
      enum: [FREE, RESERVED, CONSUMED]
      description: |
        line_refund states in core (docs/domain-model.md:42). The compat entitlement
        enum also had IN_USE; that state belonged to the cross-service
        reserve/start/commit/release protocol, which core does not implement.
    CarrierConclusion:
      type: string
      enum: [LOST, DELIVERED, IN_TRANSIT, UNKNOWN]
      description: Only LOST or DELIVERED are terminal carrier conclusions.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 2000
        retryable:
          type: boolean
          description: |
            Carried explicitly so a caller never infers retryability from the status
            code. A network timeout is not a failed refund (docs/contracts.md:14).
        trace_id:
          type: [string, 'null']
          maxLength: 64
        details:
          type: [object, 'null']
          additionalProperties: true
    ErrorResponse:
      $ref: '#/components/schemas/ApiError'
    ShipmentEvent:
      type: object
      additionalProperties: false
      required: [code, occurred_at, source_version]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        occurred_at:
          type: string
          format: date-time
        source_version:
          $ref: '#/components/schemas/Version'
          description: Used to detect a late event that must not overwrite newer state.
    ShipmentSnapshot:
      type: object
      additionalProperties: false
      required: [line_id, synthetic, status, carrier_conclusion, events, source_version, updated_at]
      properties:
        line_id:
          type: string
          minLength: 1
          maxLength: 64
        synthetic:
          type: boolean
          const: true
          description: |
            Required and constant: core ships a simulator, so a response must not read
            like a real carrier integration (docs/core-scope.md:30).
        status:
          type: string
          minLength: 1
          maxLength: 64
        carrier_conclusion:
          $ref: '#/components/schemas/CarrierConclusion'
        events:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ShipmentEvent'
        source_version:
          $ref: '#/components/schemas/Version'
        updated_at:
          type: string
          format: date-time
    LineContext:
      type: object
      additionalProperties: false
      dependentRequired:
        line_refund_state: [order_paid_amount]
      required:
        [order_id, line_id, merchant_id, customer_id, sku, category, quantity,
         line_paid_amount, refunded_amount, reserved_refund_amount, currency, paid_at,
         order_status, version]
      description: |
        Existing refund/reservation members are order ledger aggregates. Current Commerce
        adds order_paid_amount and this line's slot; Case caps a FREE line by the order
        balance. Missing current facts remain conservative and never imply FREE.
      properties:
        order_id:
          $ref: '#/components/schemas/Uuid'
        line_id:
          type: string
          minLength: 1
          maxLength: 64
        merchant_id:
          type: string
          minLength: 1
          maxLength: 64
        customer_id:
          type: string
          minLength: 1
          maxLength: 64
        sku:
          type: string
          minLength: 1
          maxLength: 64
        category:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        line_paid_amount:
          $ref: '#/components/schemas/AmountMinor'
        refunded_amount:
          $ref: '#/components/schemas/AmountMinor'
          description: Order aggregate; refunded + reserved must not exceed order_paid_amount when supplied.
        reserved_refund_amount:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          type: string
          const: CNY
        paid_at:
          type: string
          format: date-time
        order_status:
          type: string
          minLength: 1
          maxLength: 64
        order_paid_amount:
          $ref: '#/components/schemas/AmountMinor'
          description: Actual order ledger paid total, zero if the ledger is absent.
        line_refund_state:
          $ref: '#/components/schemas/LineRefundState'
          description: This line's actual slot; omitted if absent, never default FREE.
        version:
          $ref: '#/components/schemas/Version'
    LineRefundStatus:
      type: object
      additionalProperties: false
      dependentRequired:
        line_refunded_amount: [order_paid_amount, line_reserved_refund_amount]
        line_reserved_refund_amount: [order_paid_amount, line_refunded_amount]
      required:
        [line_id, merchant_id, line_paid_amount, refunded_amount, reserved_refund_amount,
         currency, state, version]
      properties:
        line_id:
          type: string
          minLength: 1
          maxLength: 64
        merchant_id:
          type: string
          minLength: 1
          maxLength: 64
        line_paid_amount:
          $ref: '#/components/schemas/AmountMinor'
        refunded_amount:
          $ref: '#/components/schemas/AmountMinor'
        reserved_refund_amount:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          type: string
          const: CNY
        state:
          $ref: '#/components/schemas/LineRefundState'
        operation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        order_paid_amount:
          $ref: '#/components/schemas/AmountMinor'
          description: Actual order ledger paid total; old monetary fields remain order aggregates.
        line_refunded_amount:
          $ref: '#/components/schemas/AmountMinor'
          description: This whole line's consumed amount, zero unless its slot is CONSUMED.
        line_reserved_refund_amount:
          $ref: '#/components/schemas/AmountMinor'
          description: This whole line's held amount, zero unless its slot is RESERVED.
        version:
          $ref: '#/components/schemas/Version'
    RefundOperationView:
      type: object
      additionalProperties: false
      required: [operation_id, line_id, state, amount_minor, version]
      properties:
        operation_id:
          $ref: '#/components/schemas/Uuid'
        line_id:
          type: string
          minLength: 1
          maxLength: 64
        state:
          $ref: '#/components/schemas/OperationState'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        provider_ref:
          type: [string, 'null']
          maxLength: 200
          description: Masked in any public response (docs/contracts.md:128).
        reason_code:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        next_check_at:
          # anyOf, not type: [string, 'null']: a nullable field that also carries a
          # format must apply that format to the string branch only.
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        version:
          $ref: '#/components/schemas/Version'
          description: |
            Same row version the result event reports as aggregate_version
            (docs/core-contracts.md:67); this REST view keeps the domain-model column
            name from docs/domain-model.md:43.
security:
  - serviceToken: []
