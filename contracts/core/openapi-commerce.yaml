openapi: 3.1.0
info:
  title: ResolveFlow commerce-service core API
  version: core-v1.2
  x-core-profile: core-v1.2
  x-core-schema-version: 2
  description: |
    Core-v1.2 commerce surface: authoritative order/payment/line facts, the synthetic
    shipment adapter, the line refund status and the authoritative refund operation
    state. Target protocol of C00 (docs/core-contracts.md section 3); it does not claim
    that these operations are implemented yet.

    Narrower than the T02 compat document (contracts/openapi-commerce.yaml) on purpose:
    the entitlement reserve/start/commit/release protocol is deferred
    (docs/core-scope.md:16), so the four /internal/v1/entitlements/* routes and the
    cancel-before-start tombstone are absent here. They stay in the compat document and
    are not deployed in core.

    Logistics are a read-only synthetic adapter inside Commerce
    (docs/core-scope.md:30): the shipment view must say `synthetic: true` rather than
    impersonate a carrier integration, and there is no fulfillment database.

    Everything under /internal/ accepts only a service token with the matching audience
    and scope, and is never exposed through the gateway.
servers:
  - url: http://commerce-service:8081
    description: In-cluster address. Reached only through the gateway or a service token.
tags:
  - name: internal-read
    description: Read-only business facts. The Agent reaches these through its scoped tools.
  - name: refund
    description: Refund operation state and the reconciliation answer.
paths:
  /internal/v1/shop/cart/{store_id}:
    get:
      operationId: commerceCartGet
      summary: CartGroup
      description: 'Authority: docs/cart-multiline-checkout.md. Cart ownership from
        trusted Case buyer bindings. Read and write require private commerce:checkout
        scope; Agent has no access. Absolute quantities, immutable request receipts
        and cart revision CAS.'
      parameters:
      - name: store_id
        in: path
        required: true
        schema: &id001
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: customer_id
        in: query
        required: true
        schema: *id001
      responses:
        '200':
          description: Scoped persistent cart projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartGroup'
              example:
                store_id: M-1001
                store_name: 松间数码
                revision: 1
                currency: CNY
                items:
                - sku_id: SKU-1001-BLACK
                  product_id: P-1001
                  product_name: 无线降噪耳机
                  variant: 黑色
                  asset_key: headphones
                  quantity: 1
                  unit_amount: 32900
                  total_amount: 32900
                  max_quantity: 10
                  sku_version: 1
                  price_changed: false
                  availability: AVAILABLE
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Only buyer / case-service checkout identity
        '404':
          description: Not visible
        '409':
          description: Cart, price or idempotency conflict
        '503':
          description: Unavailable; retry original request
  /internal/v1/shop/cart/{store_id}/items:
    post:
      operationId: commerceCartPost
      summary: CartReceipt
      description: 'Authority: docs/cart-multiline-checkout.md. Cart ownership from
        trusted Case buyer bindings. Read and write require private commerce:checkout
        scope; Agent has no access. Absolute quantities, immutable request receipts
        and cart revision CAS.'
      parameters:
      - name: store_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Scoped persistent cart projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartReceipt'
              example:
                store_id: M-1001
                revision: 1
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Only buyer / case-service checkout identity
        '404':
          description: Not visible
        '409':
          description: Cart, price or idempotency conflict
        '503':
          description: Unavailable; retry original request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartCommand'
            example:
              merchant_id: M-1001
              customer_id: C-B3001-M1001
              idempotency_key: cart-demo
              request:
                sku_id: SKU-1001-BLACK
                quantity: 1
                expected_revision: 0
                expected_sku_version: 1
