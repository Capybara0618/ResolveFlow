  /internal/v1/order-lines:
    get:
      tags: [internal-read]
      operationId: listOrderLines
      summary: Order lines visible to one principal scope, for Case's public order view
      description: |
        Case owns the public Order API and builds its view from here
        (docs/core-contracts.md:26: "当前主体订单视图；内部请求Commerce"), because
        commerce_db owns orders and payments (docs/architecture.md:11). The scope is
        passed by Case from the verified user token: no request-supplied identity can
        widen it (docs/core-contracts.md:15), and a caller cannot name a scope it was
        not given. Lines outside the scope are absent from the result rather than
        reported as forbidden, so the list does not disclose what the principal may not
        see; a service token without the read scope is 403 (403).

        order_id and line_id narrow the same scoped result; both are what Case needs when it
        owns a public route but not the data. Case reads one order by order_id
        (GET /api/v1/orders/{order_id}) and, before opening a case, asks whether one line is
        inside the caller's scope (POST /api/v1/cases answers 404 for a line the principal
        cannot see, docs/core-contracts.md:28). Filtering inside the scope is a narrowing,
        never a way around it: a line that is not the caller's yields no lines, so Case can
        answer 404 without disclosing that it exists (docs/core-contracts.md:27).
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/LineId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lines within the requested scope, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLinePage'
              example:
                items:
                  - order_id: 00000000-0000-4000-8000-0000000000aa
                    line_id: '7001'
                    sku: SKU-RED-M
                    category: apparel
                    quantity: 2
                    line_paid_amount: 2599
                    currency: CNY
                    paid_at: '2026-09-10T08:15:00Z'
                    status: PAID
                    version: 3
                page:
                  limit: 20
                  next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
  /internal/v1/order-lines/{line_id}/context:
    get:
      tags: [internal-read]
      operationId: readOrderLineContext
      summary: Authoritative order, payment and line facts for one line
      description: |
        Java recomputes every amount from here; an Agent-suggested amount is never
        trusted (docs/product-spec.md:25).
      parameters:
        - $ref: '#/components/parameters/LineId'
      responses:
        '200':
          description: Line context at its current version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineContext'
              example:
                order_id: 00000000-0000-4000-8000-0000000000aa
                line_id: '7001'
                merchant_id: M-1001
                customer_id: C-2002
                sku: SKU-RED-M
                category: apparel
                quantity: 2
                line_paid_amount: 2599
                refunded_amount: 0
                reserved_refund_amount: 0
                currency: CNY
                paid_at: '2026-09-10T08:15:00Z'
                order_status: PAID
                version: 3
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/order-lines/{line_id}/shipment:
    get:
      tags: [internal-read]
      operationId: readOrderLineShipment
      summary: Versioned synthetic shipment evidence for one line
      description: |
        Labels itself synthetic instead of imitating a carrier API, and carries the
        source version so a late event cannot overwrite newer state
        (docs/domain-model.md:44).
      parameters:
        - $ref: '#/components/parameters/LineId'
      responses:
        '200':
          description: Shipment snapshot at its current source version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentSnapshot'
              example:
                line_id: '7001'
                synthetic: true
                status: LOST
                carrier_conclusion: LOST
                events:
                  - code: PICKED_UP
                    occurred_at: '2026-09-11T03:00:00Z'
                    source_version: 1
                  - code: NO_SCAN_7D
                    occurred_at: '2026-09-18T03:00:00Z'
                    source_version: 2
                source_version: 2
                updated_at: '2026-09-18T03:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/order-lines/{line_id}/refund-status:
    get:
      tags: [refund]
      operationId: readLineRefundStatus
      summary: Refunded, reserved and current refund state for one line
      description: |
        A view over payment_ledger and line_refund (docs/domain-model.md:41-42). The
        refundable amount is deliberately not returned: it is paid minus refunded minus
        reserved, and a stored copy of a derived number is how two services start
        disagreeing about the same money.
      parameters:
        - $ref: '#/components/parameters/LineId'
      responses:
        '200':
          description: Line refund state at its current version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineRefundStatus'
              example:
                line_id: '7001'
                merchant_id: M-1001
                line_paid_amount: 2599
                refunded_amount: 0
                reserved_refund_amount: 2599
                currency: CNY
                state: RESERVED
                operation_id: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
                version: 4
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/operations/{operation_id}:
    get:
      tags: [refund]
      operationId: readRefundOperation
      summary: Authoritative refund operation state
      description: |
        This answer ends a reconciliation (docs/core-contracts.md:67): a broker retry or
        a timer never does. UNKNOWN is not a failure and does not release the money or
        the line occupation (docs/domain-model.md:15).
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Operation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundOperationView'
              example:
                operation_id: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
                line_id: '7001'
                state: UNKNOWN
                amount_minor: 2599
                provider_ref: null
                reason_code: PROVIDER_TIMEOUT
                next_check_at: '2026-09-18T10:05:00Z'
                version: 5
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/v1/shop/drafts/{draft_id}/payment:
