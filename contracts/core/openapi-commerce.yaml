              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 明确拒绝或暂不可用；UNKNOWN不换尝试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 明确拒绝或暂不可用；UNKNOWN不换尝试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutPayCommand'
    get:
      operationId: commerceCheckoutOperation2
      summary: CheckoutPaymentLookup
      description: 模拟付款/本人交易，见docs/simulated-checkout-payment.md；独立commerce:checkout且部署主体case-service；Agent禁止读取或写入。
      parameters:
