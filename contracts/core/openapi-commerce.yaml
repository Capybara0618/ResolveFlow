        '401':
          description: 明确拒绝或暂不可用；UNKNOWN不换尝试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 明确拒绝或暂不可用；UNKNOWN不换尝试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
