components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Internal aud/scope token. X-User, X-Role and X-Merchant headers are stripped at
        the gateway and never trusted here (docs/core-contracts.md:15).
  parameters:
    LineId:
      name: line_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MerchantId:
      name: merchant_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    CustomerId:
      name: customer_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
    OrderId:
      name: order_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    LineId:
      name: line_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthenticated:
      description: Missing or invalid user token (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHENTICATED
            message: the access token is missing or expired
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c

    ForbiddenScope:
      description: Service token lacks the required scope (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN_SCOPE
            message: the caller scope does not include the required action
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    NotFound:
      description: Not visible under this token's scope (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: the resource does not exist under this principal
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    ServiceUnavailable:
      description: Temporarily unavailable (503). A timeout here is never a failed refund.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SERVICE_UNAVAILABLE
            message: commerce database is temporarily unavailable
            retryable: true
            trace_id: 0af7651916cd43dd8448eb211c80319c
  schemas:
    CartRequest:
      type: object
      additionalProperties: false
      required:
      - sku_id
      - quantity
      - expected_revision
      - expected_sku_version
      properties:
        sku_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        quantity:
          type: integer
          minimum: 0
          maximum: 100
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740990
        expected_sku_version:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 9007199254740991
      allOf:
      - if:
          properties:
            quantity:
              const: 0
        then:
          properties:
            expected_sku_version:
              type: 'null'
        else:
          properties:
            expected_sku_version:
              type: integer
              minimum: 1
              maximum: 9007199254740991
    CartCommand:
