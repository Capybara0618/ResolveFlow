openapi: 3.1.0
info:
  title: ResolveFlow agent-service core API
  version: core-v1.2
  x-core-profile: core-v1.2
  x-core-schema-version: 2
  description: |
    Core-v1.2 agent surface: durable run intake, run status, cancellation, one tool
    observation record and liveness. Target protocol of C00 (docs/core-contracts.md
    sections 3 and 4); it does not claim these operations are implemented yet.

    Narrower than the T02 compat document (contracts/openapi-agent.yaml) where the
    compat vocabulary described capabilities core defers:
    - requested_actions is REFUND only; a reship request is not representable
      (docs/core-scope.md:9).
    - evidence_source_type drops LINE_ENTITLEMENT and PACKING_MANIFEST, because core
      exposes no entitlement or packing endpoint for Java to re-read
      (docs/core-contracts.md:53).
    - RunAccepted.status is QUEUED, not the compat [QUEUED, ANALYZING]: ANALYZING is a
      case state, and a run document that borrows case vocabulary is how two machines
      end up disagreeing about which one owns the state (docs/agent-spec.md).

    Still one agent: no multi-agent routing, skills marketplace or model-routing
    platform (docs/core-scope.md:17). The run is dispatched by case-service, so the
    only accepted caller is its service token.
servers:
  - url: http://agent-service:8090
    description: In-cluster address only.
tags:
  - name: runs
    description: Durable run intake, status and cancellation.
  - name: observations
    description: The tool records Java re-reads to verify an Agent citation.
paths:
  /health:
    get:
      tags: [runs]
      operationId: health
      summary: Liveness and build identity
      description: 'Liveness probe. It answers from the process itself and never calls the model provider or the run store, so a provider outage cannot fail a liveness check.'
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                service: agent-service
                version: core-v1.2
  /internal/v1/runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Accept a durable investigation run
      description: |
        Idempotent on `run_id`, which case-service derives from
        `(case_id, input_revision)`. The same key with a different body is 409. The
        response is only sent after the run row is committed, so a caller that got a
        202 can rely on it (docs/core-contracts.md:38).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
            example:
              run_id: e2e2e2e2-3333-4444-8555-aaaaaaaaaaaa
              case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
              input_revision: 1
              context:
                merchant_id: M-1001
                customer_id: C-2002
                order_id: 00000000-0000-4000-8000-0000000000aa
                line_id: '7001'
              request:
                description: 包裹丢了，希望退款
                requested_actions: [REFUND]
                evidence_refs: [ev-1]
              policy_manifest:
                bundle_ids: [policy-logistics-2026.09]
                manifest_hash: '9999999999999999999999999999999999999999999999999999999999999999'
                safety_epoch: 1
              deadline_at: '2026-09-18T05:00:00Z'
              traceparent: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
      responses:
        '202':
          description: Run persisted and queued
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
              example:
                run_id: e2e2e2e2-3333-4444-8555-aaaaaaaaaaaa
                status: QUEUED
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
        '429':
          $ref: '#/components/responses/Overloaded'
  /internal/v1/runs/{run_id}:
    get:
      tags: [runs]
      operationId: readRun
      summary: Run status for case-service reconciliation
      description: |
        Returns status, the callback ids already emitted, the run version and a masked
        result summary (docs/core-contracts.md:39). It never returns raw model text or
        credentials.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current run state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
              example:
                run_id: e2e2e2e2-3333-4444-8555-aaaaaaaaaaaa
                case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
                input_revision: 1
                status: RUNNING
                version: 2
                callback_ids: [cb-1]
                result_summary: null
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/runs/{run_id}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Mark a run cancelled
      description: |
        Cancellation stops further investigation; it does not promise to un-send a
        model request that is already in flight, whose result may still be billed and
        is then discarded. That bound is stated rather than hidden
        (docs/core-contracts.md:41).
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Cancellation recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAck'
              example:
                run_id: e2e2e2e2-3333-4444-8555-aaaaaaaaaaaa
                status: CANCELLED
                cancellation_requested: true
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/runs/{run_id}/observations/{observation_id}:
    get:
      tags: [observations]
      operationId: readObservation
      summary: Read one tool observation record and its source hash
      description: |
        Java does not trust a textual conclusion from Python. It re-reads the
        authoritative business record through the same `source_ref`, checks ownership
        and version, and re-investigates if the version moved (docs/core-contracts.md:61).
        Customer statements are only ever checked against stored case evidence, never
        promoted to warehouse fact.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/ObservationId'
      responses:
        '200':
          description: Observation record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationRecord'
              example:
                observation_id: obs-1
                run_id: e2e2e2e2-3333-4444-8555-aaaaaaaaaaaa
                tool_name: get_shipment_evidence
                source_type: SHIPMENT
                source_ref: line:7001/shipment
                source_version: '2'
                content_hash: '1111111111111111111111111111111111111111111111111111111111111111'
                observed_at: '2026-09-18T04:30:00Z'
                result:
                  carrier_conclusion: LOST
                  source_version: 2
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    caseDispatcherToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Service token minted for case-service with the run scope. The model never sees
        it, and the run body must agree with it (docs/core-contracts.md:61).
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ObservationId:
      name: observation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  headers:
    Location:
      description: Canonical run URL
      schema:
        type: string
        minLength: 1
  responses:
    ForbiddenScope:
      description: Service token lacks the run scope (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN_SCOPE
            message: the caller scope does not include run:dispatch
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    NotFound:
      description: Unknown run or observation (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: no run with that id
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    Conflict:
      description: Same run key with a different body (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: IDEMPOTENCY_CONFLICT
            message: run_id was already used with a different request body
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    SemanticInvalid:
      description: The body disagrees with the token or the case binding (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SEMANTIC_INVALID
            message: request body identity does not match the service token
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    Overloaded:
      description: Run store at capacity; the caller retries later (429)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: OVERLOADED
            message: too many queued runs for this merchant
            retryable: true
            trace_id: 0af7651916cd43dd8448eb211c80319c
  schemas:
    Uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Sha256Hex:
      type: string
      pattern: '^[a-f0-9]{64}$'
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    InputRevision:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: Decision-input revision, not an optimistic-lock version.
    Traceparent:
      type: string
      pattern: '^00-[a-f0-9]{32}-[a-f0-9]{16}-[a-f0-9]{2}$'
    RequestedAction:
      type: string
      enum: [REFUND]
      description: |
        The only action a core case can request (docs/core-contracts.md:28). The compat
        enum also had RESHIP and EITHER; reship is not implemented in core.
    EvidenceSourceType:
      type: string
      enum:
        [ORDER_LINE, PAYMENT_LEDGER, SHIPMENT, SHIPMENT_TRACK, CUSTOMER_STATEMENT,
         REVIEWER_VERIFICATION, POLICY_RULE]
      description: |
        Every value must be re-readable through a core endpoint. LINE_ENTITLEMENT and
        PACKING_MANIFEST belong to the deferred entitlement and packing surfaces, so
        they are absent here.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 2000
        retryable:
          type: boolean
          description: |
            Carried explicitly so a caller never infers retryability from the status
            code. A network timeout is not a failed refund (docs/contracts.md:14).
        trace_id:
          type: [string, 'null']
          maxLength: 64
        details:
          type: [object, 'null']
          additionalProperties: true
    ErrorResponse:
      $ref: '#/components/schemas/ApiError'
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: UP
        service:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
    RunRequestContext:
      type: object
      additionalProperties: false
      required: [merchant_id, customer_id, order_id, line_id]
      description: Supplied by case-service; the model may not choose or widen it.
      properties:
        merchant_id:
          type: string
          minLength: 1
          maxLength: 64
        customer_id:
          type: string
          minLength: 1
          maxLength: 64
        order_id:
          $ref: '#/components/schemas/Uuid'
        line_id:
          type: string
          minLength: 1
          maxLength: 64
    RunRequestPayload:
      type: object
      additionalProperties: false
      required: [description, requested_actions]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 4000
        requested_actions:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RequestedAction'
        evidence_refs:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 200
    PolicyManifestRef:
      type: object
      additionalProperties: false
      required: [bundle_ids, manifest_hash, safety_epoch]
      properties:
        bundle_ids:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            minLength: 1
        manifest_hash:
          $ref: '#/components/schemas/Sha256Hex'
        safety_epoch:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    RunRequest:
      type: object
      additionalProperties: false
      required: [run_id, case_id, input_revision, context, request, policy_manifest, deadline_at]
      description: |
        Field set fixed by docs/core-contracts.md:57; the body must agree with the
        service token and the case binding, so a run cannot be pointed at another
        tenant's line by editing the request.
      properties:
        run_id:
          $ref: '#/components/schemas/Uuid'
        case_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        context:
          $ref: '#/components/schemas/RunRequestContext'
        request:
          $ref: '#/components/schemas/RunRequestPayload'
        policy_manifest:
          $ref: '#/components/schemas/PolicyManifestRef'
        deadline_at:
          type: string
          format: date-time
          description: |
            The queued deadline. Recovery must not extend it
            (docs/agent-spec.md:42): a run that waited too long is a different outcome
            than one that investigated slowly.
        traceparent:
          oneOf:
            - $ref: '#/components/schemas/Traceparent'
            - type: 'null'
    RunAccepted:
      type: object
      additionalProperties: false
      required: [run_id, status]
      properties:
        run_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          const: QUEUED
          description: |
            The status of the committed row at accept time. The compat document used
            [QUEUED, ANALYZING]; ANALYZING is a case state and does not belong to the run
            vocabulary (docs/agent-spec.md:9).
    RunView:
      type: object
      additionalProperties: false
      required: [run_id, case_id, input_revision, status, version]
      properties:
        run_id:
          $ref: '#/components/schemas/Uuid'
        case_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        status:
          type: string
          enum: [QUEUED, RUNNING, CALLBACK_PENDING, WAITING_INPUT, COMPLETED, FAILED, CANCELLED, STALE]
          description: |
            The run vocabulary of docs/agent-spec.md:9. COMPLETED means the proposal
            callback was accepted by case-service; it does not mean the refund succeeded.
        version:
          $ref: '#/components/schemas/Version'
        callback_ids:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
        result_summary:
          type: [string, 'null']
          maxLength: 2000
          description: Masked summary only; never raw model text.
    CancelAck:
      type: object
      additionalProperties: false
      required: [run_id, status, cancellation_requested]
      properties:
        run_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [CANCELLED, COMPLETED, FAILED]
          description: |
            The status the run actually holds after the request: CANCELLED when this
            call stopped it, or the terminal state it had already reached. Deliberately
            narrower than RunView.status, because a cancellation answer of RUNNING
            would be a lie.
        cancellation_requested:
          type: boolean
    ObservationRecord:
      type: object
      additionalProperties: false
      required:
        [observation_id, run_id, tool_name, source_type, source_ref, source_version,
         content_hash, observed_at]
      properties:
        observation_id:
          type: string
          minLength: 1
          maxLength: 64
        run_id:
          $ref: '#/components/schemas/Uuid'
        tool_name:
          type: string
          minLength: 1
          maxLength: 64
        source_type:
          $ref: '#/components/schemas/EvidenceSourceType'
        source_ref:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^(?!https?://)[a-z][a-z0-9_]*:\S+$'
          description: A controlled reference, never an arbitrary URL.
        source_version:
          type: string
          minLength: 1
          maxLength: 64
        content_hash:
          $ref: '#/components/schemas/Sha256Hex'
        observed_at:
          type: string
          format: date-time
        result:
          type: [object, 'null']
          additionalProperties: true
          description: The stored tool result Java re-reads and compares against the authority.
security:
  - caseDispatcherToken: []