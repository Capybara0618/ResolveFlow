          minLength: 1
          maxLength: 2000
    TimelineEvent:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, summary]
      description: |
        One row of the investigation trajectory the case view shows
        (docs/core-scope.md:7). Rows are appended in the same transaction as the inbox
        projection and the local event, so the trajectory cannot disagree with the state
        (docs/core-contracts.md:67).
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 64
        type:
          $ref: '#/components/schemas/TimelineEventType'
        occurred_at:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
          maxLength: 500
        revision:
          oneOf:
            - $ref: '#/components/schemas/InputRevision'
            - type: 'null'
    CaseSnapshot:
      type: object
      additionalProperties: false
      required: [case]
      properties:
        case:
          $ref: '#/components/schemas/CaseSummary'
        proposal:
          oneOf:
            - $ref: '#/components/schemas/ProposalView'
            - type: 'null'
        authorization:
          oneOf:
            - $ref: '#/components/schemas/AuthorizationState'
            - type: 'null'
        operation:
          oneOf:
            - $ref: '#/components/schemas/OperationView'
            - type: 'null'
        evidence:
          type: array
          maxItems: 64
          description: |
            The case's material, readable here because a reviewer cannot verify what it
            cannot read. Each entry is an EvidenceView: the citation plus the text and, for
            a human verification, which record it verified and what it concluded.
          items:
            $ref: '#/components/schemas/EvidenceView'
