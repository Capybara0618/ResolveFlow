components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User JWT from the demonstration login. It carries the principal; X-User, X-Role
        and X-Merchant headers are stripped at the gateway and never trusted here
        (docs/core-contracts.md:15).
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Internal aud/scope token for the /internal/v1/... surface, which is never exposed
        through the gateway.
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Same key with a different body is 409 (docs/core-contracts.md:15).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,15}"$'
      description: |
        The version the caller saw, quoted as an ETag. On a case resource this is the case
        version: the body's authorization_version guards the decision itself, and this guards
        the reading the decision was made from. A request that read version N and arrives after
        something else moved the case to N+1 is refused rather than applied to a state nobody
        looked at.
    IfCollaborationMatch:
      name: If-Collaboration-Match
      in: header
      required: true
      description: Quoted collaboration version from the reading; missing or stale version returns 409.
      schema:
        type: string
        pattern: '^"(?:0|[1-9][0-9]{0,14})"$'
    StaffCollaborationMatch:
      name: If-Collaboration-Match
      in: header
      required: false
      description: Required for staff writes (409 when missing); customer writes do not use ownership.
      schema:
        type: string
        pattern: '^"(?:0|[1-9][0-9]{0,14})"$'
    StaffCaseMatch:
      name: If-Match
      in: header
      required: false
      description: Required for staff writes (409 when missing); customer legacy writes retain their contract.
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,15}"$'
  headers:
    Location:
      description: Canonical URL of the created resource
      schema:
        type: string
        minLength: 1
  responses:
    Unauthenticated:
      description: Missing or invalid user token (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHENTICATED
            message: the access token is missing or expired
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    InvalidArgument:
      description: A query parameter or header the route cannot use (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_ARGUMENT
            message: cursor is not a page this service issued
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    ForbiddenScope:
      description: The principal may not perform this action (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN_SCOPE
            message: the caller may not review cases of another merchant
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    NotFound:
      description: Not visible under this principal (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: no case with that id for this principal
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    IdempotencyConflict:
      description: Same idempotency key with a different body (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: IDEMPOTENCY_CONFLICT
            message: this Idempotency-Key was already used with a different body
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    StateConflict:
      description: The case or authorisation is not in a state that allows this (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: STATE_CONFLICT
            message: the authorisation is already consumed; the input of a consumed case cannot change
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    SemanticInvalid:
      description: The body disagrees with the token, the binding or the schema (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SEMANTIC_INVALID
            message: requested_actions may only contain REFUND
            retryable: false
            trace_id: 0af7651916cd43dd8448eb211c80319c
    RateLimited:
      description: Too many attempts; retry later (429)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RATE_LIMITED
            message: too many login attempts for this account
            retryable: true
            trace_id: 0af7651916cd43dd8448eb211c80319c
    ServiceUnavailable:
      description: A dependency is temporarily unavailable (503). A timeout is not a failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SERVICE_UNAVAILABLE
            message: commerce-service did not answer within the reconciliation budget
            retryable: true
            trace_id: 0af7651916cd43dd8448eb211c80319c
  schemas:
    ReviewerSources:
      type: object
      additionalProperties: false
      required:
      - run_id
      - case_id
      - input_revision
      - status
      - model_provider
      - model_id
      - truncated
      - observations
      properties:
        run_id:
          type: string
        case_id:
          type: string
        input_revision:
          type: integer
          minimum: 1
        status:
          type: string
        model_provider: &id001
          type:
          - string
          - 'null'
        model_id: *id001
        truncated:
          type: boolean
        observations:
          type: array
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required:
            - observation_id
            - tool_name
            - source_type
            - source_ref
            - source_version
            - content_hash
            - observed_at
            - error_code
            - call_id
            - result
            - body_omitted
            properties:
              observation_id: *id001
              tool_name: *id001
              source_type: *id001
              source_ref: *id001
              source_version: *id001
              content_hash: *id001
              observed_at: *id001
              error_code: *id001
              call_id:
                type: string
              result:
                type:
                - object
                - 'null'
              body_omitted:
                type: boolean
    ReviewerInvestigation:
      type: object
      additionalProperties: false
      required:
      - case_version
      - input_revision
      - availability
      - investigation
      properties:
        case_version:
          type: integer
          minimum: 1
        input_revision:
          type: integer
          minimum: 1
        availability:
          enum:
          - AVAILABLE
          - NOT_SCHEDULED
          - UNAVAILABLE
        investigation:
          anyOf:
          - $ref: '#/components/schemas/ReviewerSources'
          - type: 'null'
    ReviewerContext:
      type: object
      additionalProperties: false
      required: [case_version, input_revision, allowed_actions, blocked_reason, policy_rules, policy_status]
      properties:
        case_version: {type: integer, minimum: 1}
        input_revision: {type: integer, minimum: 1}
        allowed_actions:
          type: array
          items: {type: string, enum: [MANUAL_PROPOSAL, REJECT, REQUEST_INFO, REVIEW_AUTHORIZATION]}
        blocked_reason: {type: string}
        policy_status: {type: string, enum: [PINNED, UNAVAILABLE]}
        review_history:
          type: array
          items:
            type: object
            required: [type, occurred_at, revision, actor, reason, question_id]
            properties:
              type: {type: string}
              occurred_at: {type: string, format: date-time}
              revision: {type: integer}
              actor: {type: [string, 'null']}
              reason: {type: [string, 'null']}
              question_id: {type: [string, 'null']}
        execution:
          type: object
          required: [case_status, operation_id, outcome, amount_minor, reason_code]
          properties:
            case_status: {type: string}
            operation_id: {type: [string, 'null']}
            outcome: {type: [string, 'null'], enum: [SUCCEEDED, FAILED, UNKNOWN, null]}
            amount_minor: {type: [integer, 'null']}
            reason_code: {type: [string, 'null']}
        policy_rules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [bundle_id, version, rule_id, title, text, chunk_id, content_hash]
            properties:
              bundle_id: {type: string}
              version: {type: string}
              rule_id: {type: string}
              title: {type: string}
              text: {type: string}
              chunk_id: {type: string}
              content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    ReviewerAction:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: {type: string, enum: [MANUAL_PROPOSAL, REJECT, REQUEST_INFO]}
        reason: {type: string, minLength: 1, maxLength: 1000}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/EvidenceRef'
        policy_refs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PolicyRef'
      allOf:
        - if:
            properties:
              action: {const: MANUAL_PROPOSAL}
          then:
            required: [evidence_refs, policy_refs]
    Uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Sha256Hex:
      type: string
      pattern: '^[a-f0-9]{64}$'
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    InputRevision:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: Decision-input revision, not an optimistic-lock version (docs/domain-model.md:3).
    AmountMinor:
      type: integer
      minimum: 0
      maximum: 1000000000
      description: CNY minor units, always an integer (docs/core-contracts.md:17).
    ReasonCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{1,63}$'
    Traceparent:
      type: string
      pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    PageMeta:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        next_cursor:
          type: [string, 'null']
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Action:
      type: string
      enum: [REFUND]
      description: |
        The only executable action in core (docs/core-contracts.md:65). The compat enum
        also had RESHIP; reship is not implemented (docs/core-scope.md:9).
    RequestedAction:
      type: string
      enum: [REFUND]
      description: |
        What the customer asked for; the executable action is a subset. Core represents
        only the refund request (docs/core-contracts.md:28).
    RecommendedAction:
      type: string
      enum: [REFUND, REQUEST_INFO, MANUAL_REVIEW, REJECT]
      description: |
        The core proposal set (docs/agent-spec.md:19). RESHIP was dropped together with
        the deferred reship workflow; the runtime fills in the identity, never the model.
    CaseType:
      type: string
      enum: [LOGISTICS, DAMAGED, WRONG_MISSING, OUT_OF_SCOPE]
    CaseStatus:
      type: string
      enum:
        [QUEUED, ANALYZING, WAITING_CUSTOMER, PENDING_REVIEW, AUTHORIZED, EXECUTING,
         RECONCILING, CLOSED_SUCCESS, CLOSED_REJECTED, CANCELLED]
      description: |
        Case lifecycle of docs/domain-model.md:55. CANCELLED exists only before the
        authorisation is consumed; after consumption there is no cancel edge.
    ProposalOrigin:
      type: string
      enum: [AGENT, HUMAN]
      description: |
        Who wrote the proposal, and therefore which members the rest of the document has
        (C03.3c). A run's proposal is the run's classification of the case; a person's is
        their reading of the same material, so it names the person and not a run.
    ProposalStatus:
      type: string
      enum: [PROPOSED, VALIDATED, STALE, REJECTED]
      description: |
        docs/domain-model.md:57, with what each value claims (C03.2b-2):

        VALIDATED means the policy citations were re-checked against the version pinned on
        this case and the amount was recomputed from the line's own amounts - so it is a claim
        about what this service verified, not about what the run said. REJECTED means a check
        refused it and refusal_reason says which. STALE means it belonged to an input revision
        that is no longer the case's current one, which is derived at read time rather than
        stored. PROPOSED would mean stored but not yet re-checked, and **no core route stores
        one**: the agent path checks before recording, and the manual path is re-checked
        synchronously too (C03.3c) because an approval has to be an approval of a fixed
        payload — a proposal that could change at approval time would make "Java owns the
        amount" untrue. The member is kept because the enumeration is the domain's, not this
        release's.
    AuthorizationStatus:
      type: string
      enum: [PENDING_REVIEW, APPROVED, REJECTED, EXPIRED, REVOKED, CONSUMED]
      description: |
        docs/domain-model.md:57. EXPIRED and REVOKED both mean "this can no longer be
        applied", and they differ in who ended it: EXPIRED is the authorisation lapsing on
        its own grounds (the input it was fixed for moved, or the reviewer asked for more
        material), while REVOKED is it being withdrawn or **superseded** — a newer revision
        produced a different authorisation, or a decision retired it (C03.3c). Neither was
        ever applied: only CONSUMED means a payment was dispatched, and only consumption is
        irreversible.
    OperationState:
      type: string
      enum: [RECEIVED, IN_PROGRESS, UNKNOWN, SUCCEEDED, FAILED]
      description: |
        The core refund_operation vocabulary (docs/domain-model.md:57): five states, and
        explicitly not the compat two-phase target protocol.
    CallbackKind:
      type: string
      enum: [STARTED, QUESTION, PROPOSAL, FAILED]
      description: |
        QUESTION and PROPOSAL are mutually exclusive terminal kinds; a late STARTED must
        not roll the state back (docs/core-contracts.md:59).
    CallbackDisposition:
      type: string
      enum: [ACCEPTED, DUPLICATE, STALE]
      description: |
        DUPLICATE means this callback_id was already applied; STALE means the run's
        revision is no longer current. Neither is an error (docs/core-contracts.md:59).
    TimelineEventType:
      type: string
      enum:
        [CASE_CREATED, EVIDENCE_APPENDED, AGENT_STARTED, QUESTION_REQUIRED, PROPOSAL_READY,
         APPROVAL_REQUIRED, AUTHORIZATION_DECIDED, EXECUTION_UPDATED, AGENT_FAILED, CASE_CLOSED]
      description: |
        The trajectory of what happened (docs/core-scope.md:7). EVIDENCE_APPENDED is the
        customer answering or adding material: without it a case whose input revision moved
        would show a revision nobody asked for, and the gap would be invisible in exactly the
        view that exists to explain the case (docs/core-contracts.md:30).

        AGENT_FAILED is here because an accepted FAILED callback has to be visible: the
        investigation ended without a question and without a proposal, and a case that showed
        nothing would look like a run that is still thinking. A retryable failure and a
        non-retryable one are the same event with different consequences (the case is queued
        again, or it is handed to a human), so the retryable flag rides in the event detail
        rather than in a second type.

        APPROVAL_REQUIRED and AUTHORIZATION_DECIDED are the two halves of the human step, kept
        apart on purpose: the first says a person has to look, the second says a person did and
        on what grounds. One type doing both would make a trajectory unable to tell a case that
        is still waiting from one that was decided and then moved on by other means
        (docs/core-contracts.md:34).
    EvidenceSourceType:
      type: string
      enum:
        [ORDER_LINE, PAYMENT_LEDGER, SHIPMENT, SHIPMENT_TRACK, CUSTOMER_STATEMENT,
         REVIEWER_VERIFICATION, POLICY_RULE]
      description: |
        Every value must be re-readable through a core endpoint. LINE_ENTITLEMENT and
        PACKING_MANIFEST belong to deferred surfaces and are absent here.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 2000
        retryable:
          type: boolean
          description: |
            Carried explicitly so a caller never infers retryability from the status
            code. A network timeout is not a failed refund (docs/contracts.md:14).
        trace_id:
          type: [string, 'null']
          maxLength: 64
        details:
          type: [object, 'null']
          additionalProperties: true
    # The HTTP error body is the flat object docs/core-contracts.md:15 keeps unchanged
    # and com.resolveflow.shared.error.ApiError serialises.
    ErrorResponse:
      $ref: '#/components/schemas/ApiError'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 1
          maxLength: 200
    LoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, role, merchant_id]
      properties:
        access_token:
          type: string
          minLength: 1
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 86400
        role:
          type: string
          enum: [CUSTOMER, REVIEWER, MERCHANT_ADMIN, OPERATOR]
          description: Persisted account role; merchant admins have read access until explicit takeover is implemented.
        merchant_id:
          type: string
          minLength: 1
        customer_id:
          type: [string, 'null']
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        merchant_name:
          type: string
          minLength: 1
          maxLength: 120
    UserProfile:
      type: object
      additionalProperties: false
      required: [username, merchant_id, role, display_name, merchant_name]
      properties:
        username: {type: string, minLength: 1, maxLength: 120}
        merchant_id: {type: string, minLength: 1}
        role: {type: string, enum: [CUSTOMER, REVIEWER, MERCHANT_ADMIN, OPERATOR]}
        customer_id: {type: string, minLength: 1}
        display_name: {type: string, minLength: 1, maxLength: 120}
        merchant_name: {type: string, minLength: 1, maxLength: 120}
    OrderLineSummary:
      type: object
      additionalProperties: false
      required: [order_id, line_id, sku, category, quantity, line_paid_amount, currency, paid_at, status, version]
      properties:
        order_id:
          $ref: '#/components/schemas/Uuid'
        line_id:
          type: string
          minLength: 1
          maxLength: 64
        sku:
          type: string
          minLength: 1
          maxLength: 64
        # Optional presentation members, identical to Commerce's own definition because this is
        # the same payload reached through a different route (tasks/dsh-reviewer/05-fields-visual.md
        # section 2). Optional so a historical line keeps answering exactly as it did.
        product_name:
          type: [string, 'null']
          maxLength: 200
        variant_text:
          type: [string, 'null']
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        line_paid_amount:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          type: string
          const: CNY
        paid_at:
          type: string
          format: date-time
        status:
          type: string
          minLength: 1
          maxLength: 64
        version:
          $ref: '#/components/schemas/Version'
    OrderLinePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
    CaseCreateRequest:
      type: object
      additionalProperties: false
      required: [line_id, description, requested_actions]
      properties:
        line_id:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          minLength: 1
          maxLength: 4000
        requested_actions:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RequestedAction'
    CaseCreatedResponse:
      type: object
      additionalProperties: false
      required: [case_id, status, input_revision, version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CaseStatus'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        version:
          $ref: '#/components/schemas/Version'
    EvidenceRef:
      type: object
      additionalProperties: false
      required: [observation_id, source_ref, source_version, content_hash]
      properties:
        observation_id:
          type: string
          minLength: 1
          maxLength: 64
        source_ref:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^(?!https?://)[a-z][a-z0-9_]*:\S+$'
          description: A controlled reference. A URL is rejected (docs/core-contracts.md:61).
        source_version:
          type: string
          minLength: 1
          maxLength: 64
        content_hash:
          $ref: '#/components/schemas/Sha256Hex'
    VerificationResult:
      type: string
      enum: [CONFIRMED, REFUTED, INCONCLUSIVE]
      description: |
        What a human concluded about one record, in the only three answers that keep the
        record's fate honest: confirmed, refuted, or not established. "Not established" is
        a third answer on purpose — forcing a reviewer to pick a side would produce
        conclusions the reviewer does not hold, and this value is what a later reader needs
        to see (docs/core-contracts.md:35).
    EvidenceView:
      type: object
      additionalProperties: false
      required: [observation_id, source_ref, source_version, content_hash, evidence_kind, content,
                 input_revision, observed_at, appended_by, appended_role]
      description: |
        The material as the case view serves it: the citation shape above plus what only the
        case can say — which kind of material it is, the material itself, who appended it and
        when. A reviewer cannot verify what it cannot read, so the text is part of the read
        surface, while `EvidenceRef` (used by proposals and by the internal re-read route)
        stays a citation without text: a citation must not become a way to smuggle unverified
        text into a proposal (docs/core-contracts.md:61).
      properties:
        observation_id:
          type: string
          minLength: 1
          maxLength: 64
        source_ref:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^(?!https?://)[a-z][a-z0-9_]*:\S+$'
        source_version:
          type: string
          minLength: 1
          maxLength: 64
        content_hash:
          $ref: '#/components/schemas/Sha256Hex'
        evidence_kind:
          $ref: '#/components/schemas/EvidenceSourceType'
        content:
          type: string
          minLength: 1
          maxLength: 8000
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        observed_at:
          type: string
          format: date-time
        appended_by:
          type: string
          minLength: 1
          maxLength: 64
        appended_role:
          type: string
          enum: [CUSTOMER, REVIEWER, MERCHANT_ADMIN, OPERATOR]
        reviewed_evidence_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Present only on a REVIEWER_VERIFICATION: the record this one verifies. The
            verified record is never edited, so both stay readable and their hashes stay
            meaningful.
        verification_result:
          oneOf:
            - $ref: '#/components/schemas/VerificationResult'
            - type: 'null'
          description: Present on the same records, and only on those.
    PolicyRef:
      type: object
      additionalProperties: false
      required: [bundle_id, version, rule_id, chunk_id, content_hash]
      properties:
        bundle_id:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: string
          minLength: 1
          maxLength: 64
        rule_id:
          type: string
          minLength: 1
          maxLength: 64
        chunk_id:
          type: string
          minLength: 1
          maxLength: 64
        content_hash:
          $ref: '#/components/schemas/Sha256Hex'
    EvidenceAppendRequest:
      type: object
      additionalProperties: false
      required: [text, evidence_kind]
      properties:
        question_id:
          type: [string, 'null']
          maxLength: 64
          description: Required and matched to the open question when the case is waiting for customer input.
        text:
          type: string
          minLength: 1
          maxLength: 8000
        evidence_kind:
          $ref: '#/components/schemas/EvidenceSourceType'
    EvidenceSubmissionResponse:
      type: object
      additionalProperties: false
      required: [case_id, input_revision, version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        version:
          $ref: '#/components/schemas/Version'
        revoked_authorization_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The live authorisation this submission retired, absent when the case had none
            (the authorisation is fixed to a revision, so new input cannot leave it applied).
    CaseCancelResponse:
      type: object
      additionalProperties: false
      required: [case_id, status, version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CaseStatus'
        version:
          $ref: '#/components/schemas/Version'
    ProposalPayload:
      type: object
      additionalProperties: false
      required:
        [schema_version, proposal_id, run_id, case_id, input_revision, case_type,
         recommended_action, summary, reason_codes]
      description: |
        The proposal a run submits (docs/core-contracts.md:59). The same field set is
        fixed by contracts/core/agent-proposal.schema.json; a test keeps the two from
        drifting apart. schema_version and case_id are carried because
        docs/core-contracts.md:9 keeps the compat field structure and
        docs/core-contracts.md:57 requires the body's subject to agree with the service
        JWT and the Case binding - a copy Java can cross-check, not a second truth.
      properties:
        review_findings:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - text
            - observation_ids
            properties:
              kind:
                type: string
                enum:
                - FACT
                - INFERENCE
                - CONFLICT
              text:
                type: string
                minLength: 1
                maxLength: 400
              observation_ids:
                type: array
                minItems: 1
                maxItems: 8
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
            allOf:
            - if:
                properties:
                  kind:
                    const: CONFLICT
              then:
                properties:
                  observation_ids:
                    minItems: 2
        schema_version:
          const: 2
          description: Protocol version of the proposal payload (docs/core-contracts.md:9).
        case_id:
          $ref: '#/components/schemas/Uuid'
        proposal_id:
          $ref: '#/components/schemas/Uuid'
        run_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        case_type:
          $ref: '#/components/schemas/CaseType'
        recommended_action:
          $ref: '#/components/schemas/RecommendedAction'
        suggested_amount_minor:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: |
            What the run suggests. Absent means nothing was suggested; null is not a
            second way to say the same thing. Java recomputes the real amount from the
            line's paid amount (docs/product-spec.md:25).
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        reason_codes:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ReasonCode'
        evidence_refs:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/EvidenceRef'
        policy_refs:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PolicyRef'
        missing_evidence:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 200
          description: What the customer still has to supply; non-empty means REQUEST_INFO.
    ProposalView:
      type: object
      additionalProperties: false
      required:
        [schema_version, proposal_id, case_id, input_revision, recommended_action, summary,
         status, origin]
      oneOf:
        - required: [run_id, case_type, reason_codes]
        - required: [authored_by, authored_role]
      description: |
        The case-side view of a proposal: the proposal fields plus the status case-service
        owns. The proposal itself never carries its own approval status.

        `origin` says who wrote it, and that decides which of the other members exist
        rather than leaving them optional by accident: a proposal from a run carries
        `run_id`, `case_type` and `reason_codes` because the run classified the case and
        named its codes, while a human-authored proposal carries `authored_by` and
        `authored_role` instead. A person does not re-classify the case, and inventing a
        `case_type` or a reason code for them would put words in their mouth; the two sets
        are therefore disjoint, and a document claiming both would be claiming two authors
        (C03.3c). `schema_version` is 2 for both — it is the core protocol version, not the
        author's. A human proposal's `summary` is the reason its author wrote: there is no
        second free-text member saying the same thing.
      properties:
        review_findings:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - text
            - observation_ids
            properties:
              kind:
                type: string
                enum:
                - FACT
                - INFERENCE
                - CONFLICT
              text:
                type: string
                minLength: 1
                maxLength: 400
              observation_ids:
                type: array
                minItems: 1
                maxItems: 8
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
            allOf:
            - if:
                properties:
                  kind:
                    const: CONFLICT
              then:
                properties:
                  observation_ids:
                    minItems: 2
        origin:
          $ref: '#/components/schemas/ProposalOrigin'
        authored_by:
          type: string
          minLength: 1
          maxLength: 64
          description: The staff subject who submitted it; present exactly when origin is HUMAN.
        authored_role:
          type: string
          enum: [REVIEWER, MERCHANT_ADMIN, OPERATOR]
        schema_version:
          const: 2
        case_id:
          $ref: '#/components/schemas/Uuid'
        proposal_id:
          $ref: '#/components/schemas/Uuid'
        run_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        case_type:
          $ref: '#/components/schemas/CaseType'
        recommended_action:
          $ref: '#/components/schemas/RecommendedAction'
        suggested_amount_minor:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: |
            What the run suggests. Absent means nothing was suggested; null is not a
            second way to say the same thing. Java recomputes the real amount from the
            line's paid amount (docs/product-spec.md:25).
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        reason_codes:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ReasonCode'
        evidence_refs:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/EvidenceRef'
        policy_refs:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PolicyRef'
        missing_evidence:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 200
        status:
          $ref: '#/components/schemas/ProposalStatus'
        recomputed_amount_minor:
          $ref: '#/components/schemas/AmountMinor'
          description: |
            What this service recomputed from the line's own amounts (paid minus refunded
            minus reserved, docs/product-spec.md:25) - never the run's suggestion, which is
            kept beside it as suggested_amount_minor so a reviewer can see both. Absent when
            there was nothing to recompute (a non-REFUND action) or the proposal was refused
            before an amount existed.
        refusal_reason:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Why a REJECTED proposal was refused, in the words of the check that refused it.
            A status alone would tell a reviewer that something was wrong without telling them
            what, and the reviewer is the person who has to act on it.
        created_at:
          type: string
          format: date-time
    AuthorizationState:
      type: object
      additionalProperties: false
      required:
        [authorization_id, authorization_version, status, action, input_revision,
         planned_operation_id, payload_hash]
      properties:
        authorization_id:
          $ref: '#/components/schemas/Uuid'
        authorization_version:
          $ref: '#/components/schemas/Version'
        status:
          $ref: '#/components/schemas/AuthorizationStatus'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
          description: |
            The revision this authorisation was derived from and whose payload it fixed. Not
            the same thing as the case's current input_revision: material arriving between
            creation and approval moves the case on while the authorisation keeps describing
            the input that was checked, so an approval has to compare the two rather than
            assume they agree (docs/core-contracts.md:34).
        expires_at:
          # anyOf rather than type: [string, 'null'] because a nullable field that also
          # carries a format must apply that format to the string branch only.
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: |
            Absent means no expiry is set. Nothing in core-v1.2 sets one yet: an approved
            authorisation lapses by being superseded or revoked, not by time, and EXPIRED is
            used for the superseded case.
        action:
          $ref: '#/components/schemas/Action'
        decided_by:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Who decided, absent while nobody has. The trajectory has no actor member, so this
            is where a decision is readable as a fact instead of being parsed out of a summary
            sentence; the sentence quotes the same reason for the person reading it.
        decided_role:
          type: string
          enum: [CUSTOMER, REVIEWER, MERCHANT_ADMIN, OPERATOR]
          description: |
            The role the decision was made in, absent while nobody has decided. The same
            vocabulary the material carries (EvidenceView.appended_role), because both answer
            "on whose authority" about one case.
        decided_at:
          type: string
          format: date-time
          description: When the decision was recorded, absent while nobody has decided.
        decision_reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: |
            Why, in the words of the person who decided. Required when a decision is submitted
            (ReviewRequest.reason) and kept here afterwards, because the next reader's question
            is not only what was decided but on what grounds.
        planned_operation_id:
          $ref: '#/components/schemas/Uuid'
          description: Pre-allocated when the authorisation is created, so the hashed payload is fixed before approval (docs/core-contracts.md:19).
        payload_hash:
          $ref: '#/components/schemas/Sha256Hex'
          description: |
            SHA-256 over the canonical JSON of the twelve command fields -
            operation_id (= planned_operation_id), case_id, authorization_id, input_revision,
            line_id, merchant_id, action, quantity, currency, amount_minor, policy_version and
            target_service (contracts/core/refund-command.schema.json). The version itself is
            not hashed: an authorisation that is re-versioned without changing what it would
            execute still hashes the same command, which is what makes the hash a statement
            about the payment rather than about the row.
    OperationView:
      type: object
      additionalProperties: false
      required: [operation_id, action, state, target_service, version]
      properties:
        operation_id:
          $ref: '#/components/schemas/Uuid'
        action:
          $ref: '#/components/schemas/Action'
        state:
          $ref: '#/components/schemas/OperationState'
        target_service:
          type: string
          const: commerce-service
        amount_minor:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000000
        quantity:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
        version:
          $ref: '#/components/schemas/Version'
          description: |
            The refund_operation row version (docs/domain-model.md:43); the result event
            reports the same number as aggregate_version (docs/core-contracts.md:67).
    CaseSummary:
      type: object
      additionalProperties: false
      required: [case_id, status, input_revision, version, created_at, updated_at, requested_actions, line_id, order_id, description]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CaseStatus'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
