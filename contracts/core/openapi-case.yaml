        role:
          type: string
          enum:
          - REVIEWER
          - MERCHANT_ADMIN
        password: &staffSchema002
          type: string
          minLength: 8
          maxLength: 200
          pattern: \S
          writeOnly: true
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
    AdminAccountUpdate:
      type: object
      additionalProperties: false
      required:
      - display_name
      - role
      - enabled
      - reason
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        role: *staffSchema001
        enabled:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
    AdminAccountPassword:
      type: object
      additionalProperties: false
      required:
      - password
      - reason
      properties:
        password: *staffSchema002
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
    AdminAccountMutation:
      type: object
      additionalProperties: false
      required:
      - account
      - session_invalidated
      properties:
        account:
          $ref: '#/components/schemas/AdminAccount'
        session_invalidated:
          type: boolean
    AdminAccountPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - total
      - enabled_admins
      - current_username
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccount'
        page:
          $ref: '#/components/schemas/PageMeta'
        total:
          type: integer
          minimum: 0
        enabled_admins:
          type: integer
          minimum: 1
        current_username:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
    AdminAccountAudit:
      type: object
      additionalProperties: false
      required:
      - id
      - action
      - actor_username
      - account_version
      - reason
      - occurred_at
      - before
      - after
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
        action:
          type: string
          enum:
          - CREATED
          - UPDATED
          - PASSWORD_RESET
        actor_username:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        account_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
        occurred_at:
          type: string
          format: date-time
        before:
          anyOf:
          - $ref: '#/components/schemas/AdminAccountState'
          - type: 'null'
        after:
          $ref: '#/components/schemas/AdminAccountState'
    AdminAccountAuditPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccountAudit'
        page:
          $ref: '#/components/schemas/PageMeta'
        total:
          type: integer
          minimum: 0

security:
  - bearerAuth: []
