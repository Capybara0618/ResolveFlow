                operation: null
                evidence:
                  - observation_id: 5f0c2b1a-9d3e-4a7b-8c2d-1e3f5a7b9c0d
                    source_ref: customer:C-2002
                    source_version: '2'
                    content_hash: '5555555555555555555555555555555555555555555555555555555555555555'
                    evidence_kind: CUSTOMER_STATEMENT
                    content: 包裹在分拨中心停了七天没有任何更新
                    input_revision: 2
                    observed_at: '2026-09-18T04:20:00Z'
