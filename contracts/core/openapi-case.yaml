                operation_id: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
                state: UNKNOWN
                reconciled: true
                version: 6
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/v1/cases/{case_id}/agent-callbacks:
    post:
      tags: [internal]
      operationId: receiveAgentCallback
      summary: Accept a run callback for a case
      description: |
        The disposition says what happened to this delivery: ACCEPTED, DUPLICATE for a
        callback_id already seen, or STALE when the run's revision is no longer current
