          maxLength: 64
        description:
          type: string
          minLength: 1
          maxLength: 2000
        requested_actions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RequestedAction'
    ReviewQueuePage:
      type: object
