                    type: PROPOSAL_READY
                    occurred_at: '2026-09-18T04:28:00Z'
                    summary: 方案建议退款2599分，引用1条证据与1条政策
                    revision: 1
                  - event_id: t-4
                    type: APPROVAL_REQUIRED
                    occurred_at: '2026-09-18T04:30:00Z'
                    summary: 等待人工审批
                    revision: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{case_id}/evidence:
    post:
      tags: [cases]
      operationId: appendEvidence
      summary: Append customer material to a case
      description: |
        Appending bumps input_revision, retires the in-flight run, returns the case to
        QUEUED and creates the durable binding for one fresh run of the new revision
        (docs/domain-model.md:55). After the authorisation is consumed the input is closed and this is 409
        (docs/core-contracts.md:30).

        New input also retires the case's live authorisation: it is fixed to the revision
        its payload was hashed from, so the revision moving leaves an approval that
        describes input the case no longer has. That authorisation becomes REVOKED —
        nobody decided it, and the recorded reason names the revision that retired it —
        and the response names it, so a caller that submitted material learns which
        approval it moved. The case returns to QUEUED even if it had been AUTHORIZED:
        an approval was never a payment, so retiring one costs nothing and the changed
        input must be investigated before another approval can be formed.

        Material is appended, never overwritten: each submission is its own record with its
        own id, so an earlier statement stays readable next to the one that corrected it
        (docs/domain-model.md:27). The revision is the server's, not the caller's: the body
        has no revision member, and material can only land on the revision the case is at now
        plus one, so there is no way to write into a past revision.

        Who may assert what is part of the protocol, because evidence is provenance
        (docs/agent-spec.md): the case's own customer may submit a CUSTOMER_STATEMENT, and the
        merchant that owns the line may submit a REVIEWER_VERIFICATION. The remaining kinds
        (ORDER_LINE, PAYMENT_LEDGER, SHIPMENT, SHIPMENT_TRACK, POLICY_RULE) are facts read from
        Commerce or from policy, never something a client asserts about itself, so they are 403
        here and arrive through the investigation instead.

        When the case is WAITING_CUSTOMER because a recorded question is open,
        question_id must equal that question's stable id. This preserves the question-answer
        link; a missing or different id is 422 and does not advance the revision.
        Staff writes require current ownership, If-Match and If-Collaboration-Match; missing
        or stale collaboration credentials return 409. Invalid input or If-Match may return 422.
        Identity is rechecked in the case-locked transaction.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/StaffCollaborationMatch'
        - $ref: '#/components/parameters/StaffCaseMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceAppendRequest'
            example:
              question_id: q-lost-1
              text: 小区驿站确认7天内没有任何到件记录
              evidence_kind: CUSTOMER_STATEMENT
      responses:
        '200':
          description: Evidence appended and the revision bumped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceSubmissionResponse'
              example:
                case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
                input_revision: 2
                version: 7
                revoked_authorization_id: 7a7a7a7a-2222-4333-8444-555566667777
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
  /api/v1/cases/{case_id}/cancel:
    post:
      tags: [cases]
      operationId: cancelCase
      summary: Cancel a case before its authorisation is consumed
      description: |
        Cancellation exists only before the authorisation is consumed; after that there
        is no cancel edge, and the operation either succeeds, fails or stays UNKNOWN
        (docs/domain-model.md:55).

        Cancelling reaches a terminal state, and a terminal case releases the line's active
        slot, so the same line can be asked about again (docs/domain-model.md:26). It is not
        idempotent: a case that is already terminal does not accept another transition, and a
        second cancel answers 409 rather than pretending a second cancellation happened.

        Customers may cancel their own visible case. Staff must own the case and supply both
        current versions. A case outside the caller scope remains 404.
        Staff writes require current ownership, If-Match and If-Collaboration-Match; missing
        or stale collaboration credentials return 409. Invalid input or If-Match may return 422.
        Identity is rechecked in the case-locked transaction.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/StaffCollaborationMatch'
        - $ref: '#/components/parameters/StaffCaseMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
            example:
              reason: 客户自行与商家达成一致，不再需要退款
      responses:
        '200':
          description: Case cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCancelResponse'
              example:
                case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
                status: CANCELLED
                version: 8
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /api/v1/cases/{case_id}/events:
    get:
      tags: [cases]
      operationId: streamCaseEvents
      summary: Server-sent events for one case
      description: |
        Resumption is by Last-Event-ID; the token is presented in the Authorization
        header and never in the URL, because URLs end up in logs and referrers
        (docs/core-contracts.md:32).

        Each frame is one trajectory row: the id is the event's own id, the event name is a
        TimelineEventType member, and the data is the same event object the case view returns, so a
        client that has read the case once can parse the stream with what it already has. The stream
        replays what already happened before it pushes what happens next, so subscribing late is not
        the same as missing the beginning.

        A Last-Event-ID this case never issued is not an error: the client cannot be resumed, so the
        stream starts from the beginning and says so in a comment — a superset of what the client is
        missing is more useful than a refusal it cannot act on. Comments (heartbeats, that notice) are
        never events.

        The stream ends when the case does: after the final event of a terminal case is sent, the
        response completes rather than staying open for an event that can no longer happen. A refusal
        before the stream starts (no token, or a case this principal cannot see) is the standard error
        body as application/json, even though the request asked for text/event-stream: an error is not a
        representation choice, and an event-stream client that cannot read its own refusals is worse off
        than one that gets a different content type.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 3f1b0d2c-9a4e-4c6b-8f0a-6d5c2b7e1a90
                event: CASE_CREATED
                data: {"event_id":"3f1b0d2c-9a4e-4c6b-8f0a-6d5c2b7e1a90","type":"CASE_CREATED","occurred_at":"2026-09-18T04:20:00Z","summary":"客户提交退款诉求（line_id=7001）","revision":1}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/review/cases:
    get:
      tags: [review]
      operationId: listReviewQueue
      summary: Reviewer queue for the caller's merchant
      description: |
        Merchant-scoped state/ownership projection (docs/case-collaboration.md and docs/core-contracts.md),
        newest first by updated_at and case_id; REVIEW selects PENDING_REVIEW.
        With no view/query/scope parameters, preserve the legacy cached pending-review page;
        legacy rows do not provide collaboration_version or authoritative ownership/counts.
        Supplying any of those parameters selects the uncached workspace (default REVIEW/PUBLIC).
        Workspace owner and collaboration_version come from persisted assignment; disabled owners
        remain assigned. Counts cover all search matches, not the loaded page: public/mine/unclaimed
        apply to the selected stage, stages apply to the selected ownership scope, total applies to both.
        PUBLIC includes all merchant matches, MINE uses the signed subject, UNCLAIMED means no owner
        (not permission to claim terminal/consumed cases). Counts/items use one database read snapshot.
        Workspace cursors bind merchant, subject, stage, scope and normalized query; changing filters
        requires restarting pagination (400 on mismatch). No money, case revision or Agent writes.
      parameters:
        - name: scope
          in: query
          schema: {type: string, enum: [PUBLIC, MINE, UNCLAIMED], default: PUBLIC}
          description: Ownership filter, independent of processing stage. MINE uses the authenticated subject.
        - name: view
          in: query
          schema: {type: string, enum: [REVIEW, WAITING, PROCESSING, ATTENTION, CLOSED, ALL]}
          description: Processing stage. With no workspace parameters, omission preserves the legacy pending-review queue.
        - name: query
          in: query
          schema: {type: string, maxLength: 100}
          description: Exact case/order ID or matching issue description. Merchant scope always applies.
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of cases needing review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueuePage'
              example:
                items:
                  - case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
                    status: PENDING_REVIEW
                    input_revision: 1
                    version: 6
                    updated_at: '2026-09-18T04:30:00Z'
                    line_id: '7001'
                    description: 包裹显示已揽收但7天无新物流，疑似丢失，希望退款
                    requested_actions: [REFUND]
                page:
                  limit: 20
                  next_cursor: null
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
  /api/v1/cases/{case_id}/reviews:
    post:
      tags: [review]
      operationId: submitReview
      summary: Approve, reject, or request information for the case authorisation
      description: |
        The reviewer acts on the version they saw: If-Match carries the case version that was
        read and the body carries the authorization_version, and neither a stale case version
        nor a stale authorization_version can be applied. Approval re-validates the
        authorisation before consuming it (docs/core-contracts.md:34): the revision it fixed
        has to still be the case's revision, the payload hash has to still be the one this
        service can recompute, and the line has to still be payable. Only a human decision can
        move an authorisation to APPROVED; model confidence is not authorisation (AGENTS.md).
        A refusal that can never become applicable expires the authorisation it refused, and
        says so in the trajectory. REQUEST_INFO expires the pending authorisation, records a
        stable question_id and uses the same two-round, waiting-state and case-expiry guards as
        the reviewer action route.
        Staff writes require current ownership, If-Match and If-Collaboration-Match; missing
        or stale collaboration credentials return 409. Invalid input or If-Match may return 422.
        Identity is rechecked in the case-locked transaction.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IfCollaborationMatch'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
            example:
              authorization_id: 7a7a7a7a-2222-4333-8444-555566667777
              authorization_version: 1
              decision: APPROVE
              reason: 物流结论与政策一致，证据充分
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
              example:
                case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
                authorization_id: 7a7a7a7a-2222-4333-8444-555566667777
                authorization_version: 2
                status: APPROVED
                case_version: 7
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
  /api/v1/cases/{case_id}/reviewed-evidence:
    post:
      tags: [review]
      operationId: appendReviewedEvidence
      summary: Append human verification without rewriting customer material
      description: |
        A reviewer's verification is a new evidence record that cites the record it
        verified; the original customer statement is never edited
        (docs/core-contracts.md:35). Recording one moves the input revision, and moving
        the revision retires the case's live authorisation: it is fixed to the revision
        its payload was hashed from, so it becomes REVOKED and `revoked_authorization_id`
        names it. Revocation is the revision moving, not the reviewer's verdict — a
        CONFIRMED verification retires it exactly as a REFUTED one does, because the
        conclusion is not what invalidated the payload. Absent
        `revoked_authorization_id` therefore means "there was no live authorisation to
        retire", which is different from "nobody checked": the server always looks.

        The record it created is read back through the case view's `evidence`
        (EvidenceView), which is what makes the conclusion a fact a later reader can see
        instead of a sentence to parse. Merchant staff record verifications and a customer
        may not (403), for the same reason a customer may not submit a carrier fact as its
        own.
        Staff writes require current ownership, If-Match and If-Collaboration-Match; missing
        or stale collaboration credentials return 409. Invalid input or If-Match may return 422.
        Identity is rechecked in the case-locked transaction.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IfCollaborationMatch'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewedEvidenceRequest'
            example:
              source_evidence_id: 9c858901-8a57-4791-81fe-4c455b099bc9
              verification_result: CONFIRMED
              reason: 承运商系统复核显示该件确实停留在分拨中心
      responses:
        '200':
          description: Verification appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewedEvidenceResponse'
              example:
                case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
                evidence_id: 1d1c2a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                input_revision: 3
                case_version: 8
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
  /api/v1/cases/{case_id}/manual-proposals:
    post:
      tags: [review]
      operationId: submitManualProposal
      summary: Add a human-authored proposal as a new revision
      description: |
        A manual proposal is a new revision with its own citations, not a direct
        payment instruction; approval still goes through the authorisation path
        (docs/core-contracts.md:36). Merchant staff submit it, and a customer may not:
        the citations are the merchant's argument about the case, not the party's request.
        Submitting one moves the case's input revision, because a person's citation set is
        new decision input rather than a comment on the agent's — which is why the response
        reports both the revision the submission produced and the case version it left
        behind. The amount is recomputed from Commerce and the payload is fixed from the
        citations supplied, so the request has no amount member to argue with.

        A live authorisation is fixed to the revision it was created for, so this
        submission **supersedes** it: that authorisation becomes REVOKED (nobody decided
        it, and the recorded reason names the revision that retired it) and a new
        authorisation is created for the new revision — the one a reviewer then approves or
        refuses. A case that was AUTHORIZED therefore returns to PENDING_REVIEW, because an
        approval is not a payment: the only thing that turns an approval into money is
        consumption. Once the case is executing or terminal its input is frozen and this
        route answers 409 rather than starting a new revision
        (docs/domain-model.md:36).
        Staff writes require current ownership, If-Match and If-Collaboration-Match; missing
        or stale collaboration credentials return 409. Invalid input or If-Match may return 422.
        Identity is rechecked in the case-locked transaction.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IfCollaborationMatch'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualProposalRequest'
            example:
              action: REFUND
              evidence_refs:
                - observation_id: obs-1
                  source_ref: line:7001/shipment
                  source_version: '2'
                  content_hash: '1111111111111111111111111111111111111111111111111111111111111111'
              policy_refs:
                - bundle_id: policy-logistics-2026.09
                  version: '2026.09'
                  rule_id: R-LOST-001
                  chunk_id: c-01
                  content_hash: '2222222222222222222222222222222222222222222222222222222222222222'
              reason: 人工复核后确认按丢失政策全额退款
      responses:
        '200':
          description: Manual proposal recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualProposalResponse'
              example:
                case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
                proposal_id: 5f0f0f0f-1111-4222-8333-444455556666
                input_revision: 4
                case_version: 9
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
  /api/v1/operations/{operation_id}/reconcile:
    post:
      tags: [operations]
      operationId: reconcileOperation
      summary: Ask Commerce for the authoritative state of an uncertain refund
      description: |
        Operator-only. Reconciliation asks the authority; it never turns a timeout into a
        failure and never re-pays with a new id (docs/domain-model.md:15). A still
        unknown answer stays UNKNOWN and keeps the money reserved.
      parameters:
