        authorization_version:
          $ref: '#/components/schemas/Version'
        status:
          $ref: '#/components/schemas/AuthorizationStatus'
        case_version:
          $ref: '#/components/schemas/Version'
    ManualProposalRequest:
      type: object
      additionalProperties: false
      required: [action, evidence_refs, policy_refs, reason]
      properties:
        action:
          $ref: '#/components/schemas/Action'
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/EvidenceRef'
        policy_refs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PolicyRef'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ManualProposalResponse:
      type: object
      additionalProperties: false
      required: [case_id, proposal_id, input_revision, case_version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        proposal_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        case_version:
          $ref: '#/components/schemas/Version'
    ReviewedEvidenceRequest:
      type: object
      additionalProperties: false
      required: [source_evidence_id, verification_result, reason]
      properties:
        source_evidence_id:
          $ref: '#/components/schemas/Uuid'
          description: |
            The record being verified. It is one this service issued, so it is a Uuid rather
            than an open string, and a record that is not in this case is a semantic refusal
            (422) rather than a new record that cites nothing.
        verification_result:
          $ref: '#/components/schemas/VerificationResult'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ReviewedEvidenceResponse:
      type: object
      additionalProperties: false
      required: [case_id, evidence_id, input_revision, case_version]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        evidence_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        case_version:
          $ref: '#/components/schemas/Version'
        revoked_authorization_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The live authorisation this new revision retired, absent when the case had none.
            A verification retires it whatever the conclusion was: what invalidated the
            payload is the revision moving, not the verdict.
    ReconcileResponse:
      type: object
      additionalProperties: false
      required: [operation_id, state, reconciled, version]
      properties:
        operation_id:
          $ref: '#/components/schemas/Uuid'
        state:
          $ref: '#/components/schemas/OperationState'
        reconciled:
          type: boolean
          description: True when the authority answered; false when it could not be reached.
        version:
          $ref: '#/components/schemas/Version'
    StartedPayload:
      type: object
      additionalProperties: false
      required: [started_at]
      properties:
        started_at:
          type: string
          format: date-time
    AgentQuestion:
      type: object
      additionalProperties: false
      required: [field, prompt]
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 64
        prompt:
          type: string
          minLength: 1
          maxLength: 500
    QuestionPayload:
      type: object
      additionalProperties: false
      required: [question_id, questions]
      description: |
        At most three aggregated questions, each with a stable question_id, so a repeated
        delivery is recognisable instead of being re-asked
        (docs/core-contracts.md:59).
      properties:
        question_id:
          type: string
          minLength: 1
          maxLength: 64
        questions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/AgentQuestion'
        reason_codes:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ReasonCode'
    FailedPayload:
      type: object
      additionalProperties: false
      required: [reason_codes, retryable]
      properties:
        reason_codes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/ReasonCode'
        retryable:
          type: boolean
        last_observation_refs:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 200
    AgentCallbackRequest:
      type: object
      additionalProperties: false
      required: [callback_id, run_id, input_revision, kind, payload]
      properties:
        callback_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Stable per callback, so a redelivery is recognised as a duplicate.
        run_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        kind:
          $ref: '#/components/schemas/CallbackKind'
        payload:
          oneOf:
            - $ref: '#/components/schemas/StartedPayload'
            - $ref: '#/components/schemas/QuestionPayload'
            - $ref: '#/components/schemas/ProposalPayload'
            - $ref: '#/components/schemas/FailedPayload'
        traceparent:
          oneOf:
            - $ref: '#/components/schemas/Traceparent'
            - type: 'null'
      allOf:
        - if:
            properties:
              kind:
                const: STARTED
          then:
            properties:
              payload:
                $ref: '#/components/schemas/StartedPayload'
        - if:
            properties:
              kind:
                const: QUESTION
          then:
            properties:
              payload:
                $ref: '#/components/schemas/QuestionPayload'
        - if:
            properties:
              kind:
                const: PROPOSAL
          then:
            properties:
              payload:
                $ref: '#/components/schemas/ProposalPayload'
        - if:
            properties:
              kind:
                const: FAILED
          then:
            properties:
              payload:
                $ref: '#/components/schemas/FailedPayload'
    AgentCallbackResponse:
      type: object
      additionalProperties: false
      required: [disposition]
      properties:
        disposition:
          $ref: '#/components/schemas/CallbackDisposition'
        case_version:
          oneOf:
            - $ref: '#/components/schemas/Version'
            - type: 'null'
    EvidenceListResponse:
      type: object
      additionalProperties: false
      required: [case_id, input_revision, evidence]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
        evidence:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/EvidenceRef'
    PolicyManifestResponse:
      type: object
      additionalProperties: false
      required: [merchant_id, bundles, effective_from]
      description: |
        The policy a case is pinned to.

        merchant_id is the merchant the pinned window was selected for (C07.1). It is read
        from the pin rather than from the case row: a run filters retrieval by the merchant
        the manifest names, and this route is where a run learns it.
      properties:
        merchant_id:
          type: string
          minLength: 1
          maxLength: 64
        bundles:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [bundle_ids, manifest_hash, safety_epoch]
            properties:
              bundle_ids:
                type: array
                minItems: 1
                maxItems: 16
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
              manifest_hash:
                $ref: '#/components/schemas/Sha256Hex'
              safety_epoch:
                type: integer
                minimum: 0
                maximum: 9007199254740991
        effective_from:
          type: string
          format: date-time
        effective_to:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    ToolCredentialRequest:
      type: object
      additionalProperties: false
      required: [case_id, input_revision]
      description: |
        The revision the credential is being renewed for; case-service confirms it is
        still current before signing a new one (docs/core-contracts.md:61).
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        input_revision:
          $ref: '#/components/schemas/InputRevision'
    ToolCredentialResponse:
      type: object
      additionalProperties: false
      required: [token, expires_at, scopes]
      properties:
        token:
          type: string
          minLength: 1
          description: Scoped service token. Never persisted in an outbox body, never shown to the model.
        expires_at:
          type: string
          format: date-time
        scopes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            minLength: 1
    PolicyRule:
      type: object
      additionalProperties: false
      required: [rule_id, title, text, chunk_id, content_hash]
      description: |
        One rule, plus the two members a citation needs.

        chunk_id and content_hash are here because PolicyRef requires them and no other
        route publishes them: without them a run could only guess the hash it is supposed
        to cite, and the citation check would be unverifiable by construction. They are
        derived from the stored rule — chunk_id from its position in the bundle, content_hash
        from the bundle id, chunk id, title and text — never read from the file the bundle
        was imported from, so what a run cites is what this service will re-hash.
      properties:
        rule_id:
          type: string
          minLength: 1
          maxLength: 64
        title:
          type: string
          minLength: 1
          maxLength: 200
        text:
          type: string
          minLength: 1
          maxLength: 4000
        chunk_id:
          type: string
          minLength: 1
          maxLength: 64
        content_hash:
          $ref: '#/components/schemas/Sha256Hex'
    PolicyBundle:
      type: object
      additionalProperties: false
      required: [bundle_id, merchant_id, version, manifest_hash, rules]
      description: |
        An immutable, versioned rule set (docs/policy-rag.md). Core has no route that
        publishes or revokes one; that happens through the controlled import script
        (docs/core-contracts.md:53).

        merchant_id is part of the bundle's identity rather than metadata beside it: it is
        covered by manifest_hash, so the same wording published by two merchants is two
        different bundles, and a citation can say whose policy it cites. It is served
        because C07.1's filter is "this run's merchant" and the Agent has to be able to
        check the bundle it retrieved against the merchant the run was dispatched for.
      properties:
        bundle_id:
          type: string
          minLength: 1
          maxLength: 64
        merchant_id:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: string
          minLength: 1
          maxLength: 64
        manifest_hash:
          $ref: '#/components/schemas/Sha256Hex'
        safety_epoch:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        rules:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/PolicyRule'
    CustomerCaseSummary:
