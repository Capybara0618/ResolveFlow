openapi: 3.1.0
info:
  title: ResolveFlow case-service core API
  version: core-v1.2
  x-core-profile: core-v1.2
  x-core-schema-version: 2
  description: |
    Core-v1.2 case surface: the customer case lifecycle, the reviewer decisions, the
    operator reconciliation and the service-to-service endpoints the Agent needs.
    Target protocol of C00 (docs/core-contracts.md sections 3 and 4); it does not claim
    these operations are implemented yet.

    Narrower than the T02 compat document (contracts/openapi-case.yaml):
    - REFUND is the only executable action; reship is not implemented
      (docs/core-scope.md:9).
    - The refund operation vocabulary is the core five states
      (docs/domain-model.md:57), not the compat two-phase machine.
    - The three policy-management routes (/api/v1/policies/import, .../publish,
      .../revoke) are absent: policy is imported and validated by a controlled script
      (docs/core-contracts.md:53). The two read-only policy surfaces remain.
    - A case view returns its investigation trajectory (docs/core-scope.md:7), which the
      compat snapshot left to a separate timeline read.

    The public surface is authenticated with the demonstration user JWT; every
    /internal/v1/... operation requires the service token instead and is never exposed
    through the gateway.
servers:
  - url: https://api.resolveflow.local
    description: |
      Local compose deployment through the gateway; no public instance is published.
      Internal routes are reachable in-cluster only, never through this URL.
tags:
  - name: auth
    description: Persisted local accounts and current session identity.
  - name: orders
    description: Read-only order views scoped to the authenticated principal.
  - name: cases
    description: Case lifecycle, evidence and cancellation.
  - name: review
    description: Reviewer queue and human authorisation decisions.
  - name: operations
    description: Operator-only reconciliation of an uncertain operation.
  - name: internal
    description: Service-to-service endpoints. Never exposed through the gateway.
paths:
  /api/v1/review/staff:
    get:
      operationId: listReviewStaff
      summary: Read enabled staff available for transfer in the current merchant
      description: |
        Staff only; scope comes from persisted identity (docs/case-collaboration.md).
        Returns display identity only, with no passwords, customer identities or other merchants.
      responses:
        '200':
          description: Enabled merchant staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseCollaborationOwner'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
  /api/v1/cases/{case_id}/collaboration:
    get:
      operationId: readCaseCollaboration
      summary: Read the current owner and independent collaboration history
      description: |
        Merchant staff only, scoped by current persisted identity (docs/case-collaboration.md).
        Historical cases start with no owner and version zero. No investigation or business writes.
      parameters:
      - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Current collaboration projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCollaboration'
              example:
                case_id: '0f9a2f4c-6b1d-4c8e-8f2a-1d3b5c7e9a02'
                version: 0
                owner: null
                is_owner: false
                allowed_actions: [CLAIM]
                history: []
        '401':
          description: Missing or invalidated user session
        '403':
          description: Customer identity is not merchant staff
        '404':
          description: Case not visible to this merchant
    post:
      operationId: changeCaseCollaboration
      summary: Atomically claim, release, transfer or explicitly take over a case
      description: |
        A short case-locked transaction checks signed identity and collaboration versions
        (docs/case-collaboration.md). TAKEOVER requires MERCHANT_ADMIN. Same-owner CLAIM replay is
        idempotent; other stale submissions conflict. No change to input_revision, case version,
        authorizations, policy, money or Agent runs. Consumed input and approved/executing/terminal
        cases retain their last owner. Human writes additionally check current ownership and both versions.
      parameters:
      - $ref: '#/components/parameters/CaseId'
      - name: If-Collaboration-Match
        in: header
        required: true
        description: Quoted collaboration version; missing legacy header returns 409.
        schema:
          type: string
          pattern: '^"(?:0|[1-9][0-9]{0,14})"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCollaborationAction'
            example:
              action: CLAIM
              reason: 合成演示：开始处理该申请
      responses:
        '200':
          description: Current ownership and committed history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCollaboration'
        '401':
          description: Invalidated session, including a race during transaction entry
        '403':
          description: Wrong role, including non-admin takeover
        '404':
          description: Case not visible to this merchant
        '409':
          description: Missing/stale version, occupied case or frozen collaboration
        '422':
          description: Invalid version header, reason, action or transfer target
  /api/v1/cases/{case_id}/investigation:
    get:
      operationId: readReviewerInvestigation
      summary: Read persisted investigation tool results without running tools or models
      description: |
        Merchant staff only; uses the current case revision binding. Remote failure is
        UNAVAILABLE, missing binding is NOT_SCHEDULED. Read-only projection of the
        persisted tool results: it never re-runs a model or a tool, never writes, and
        never substitutes current business values for the recorded ones
        (docs/core-contracts.md:107).
      parameters:
      - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Read-only recorded sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerInvestigation'
        '401':
          description: Authentication required
        '403':
          description: Wrong identity or scope
        '404':
          description: Subject binding not visible
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange a synthetic account for a user JWT
      description: |
        Persisted local accounts; there is no public registration. Disabled accounts and
        disabled merchants cannot log in. User sessions carry identity_version; Case
        checks account state, binding, role and revision on every public request.
        The token carries the principal, and the merchant it belongs to is taken from the
        account rather than from the request body (docs/core-contracts.md:15).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: demo-customer
              password: demo-pass-1001
      responses:
        '200':
          description: Signed-in principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiJ9.demo.access.token
                token_type: Bearer
                expires_in: 3600
                role: CUSTOMER
                merchant_id: M-1001
                customer_id: C-2002
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: readCurrentIdentity
      summary: Read the currently enabled persisted user identity
      description: |
        Validates the JWT and current account/merchant state, identity_version, role
        and customer binding. Direct Case access performs the same checks as Gateway
        access (docs/core-contracts.md:15). No passwords or service credentials returned.
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                username: demo-reviewer
                role: REVIEWER
                merchant_id: M-1001
                display_name: 审核员 · demo-reviewer
                merchant_name: ResolveFlow 演示商家一
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/customer/cases:
    get:
      tags:
      - cases
      summary: listCustomerApplications
      operationId: listCustomerApplications
      description: Customer-only projection and actions; persisted merchant/customer
        scope and versions are enforced (docs/customer-workspace.md:7).
      parameters:
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - ALL
          - WAITING
          - PROCESSING
          - REVIEW
          - CLOSED
          default: ALL
      - name: line_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      responses:
        '200':
          description: Current customer view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCasePage'
              example:
                items:
                - &customer_example_summary
                  case_id: 00000000-0000-4000-8000-000000000001
                  status: QUEUED
                  line_id: '7001'
                  order_id: 00000000-0000-4000-8000-0000000000aa
                  description: 包裹丢失，申请退款
                  version: 1
                  created_at: '2026-10-01T10:00:00Z'
                  updated_at: '2026-10-01T10:00:00Z'
                page:
                  next_cursor: null
                  limit: 20
        '400':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/customer/cases/{case_id}:
    get:
      tags:
      - cases
      summary: readCustomerApplication
      operationId: readCustomerApplication
      description: Customer-only projection and actions; persisted merchant/customer
        scope and versions are enforced (docs/customer-workspace.md:7).
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Current customer view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCaseDetail'
              example: &customer_example_detail
                case: *customer_example_summary
                input_revision: 1
                allowed_actions:
                - CANCEL
                - APPEND_EVIDENCE
                blocked_reason: ''
                materials: []
                questions: []
                result:
                  status: QUEUED
                  message: 申请已收到，等待调查
                  amount_minor: null
                  currency: CNY
                  public_reason: null
                timeline: []
        '400':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/customer/order-lines/{line_id}:
    get:
      tags:
      - cases
      summary: readCustomerOrderEligibility
      operationId: readCustomerOrderEligibility
      description: Customer-only projection and actions; persisted merchant/customer
        scope and versions are enforced (docs/customer-workspace.md:7).
      parameters:
      - name: line_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      responses:
        '200':
          description: Current customer view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderLine'
              example:
                order_line:
                  order_id: 00000000-0000-4000-8000-0000000000aa
                  line_id: '7001'
                  sku: SKU-RED-M
                  category: apparel
                  quantity: 2
                  line_paid_amount: 2599
                  currency: CNY
                  paid_at: '2026-09-10T08:15:00Z'
                  status: PAID
                  version: 3
                application: null
                can_apply: true
                blocked_reason: ''
        '400':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/customer/cases/{case_id}/answers:
    post:
      tags:
      - cases
      summary: answerCustomerQuestion
      operationId: answerCustomerQuestion
      description: Customer-only projection and actions; persisted merchant/customer
        scope and versions are enforced (docs/customer-workspace.md:7).
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[1-9][0-9]{0,15}"$
      responses:
        '200':
          description: Current customer view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCaseDetail'
              example: *customer_example_detail
        '400':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Request refused according to the customer workspace contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAnswer'
            example:
              question_id: 00000000-0000-4000-8000-000000000002
              text: 已联系承运商，反馈包裹丢失。
  /api/v1/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Order lines visible to the authenticated principal
      description: |
        A customer sees only their own lines, a merchant only its own; the scope comes
        from the token, so a crafted query cannot widen it (docs/core-contracts.md:15).
        The cursor is opaque and owned by Commerce, which is the only party that can
        tell whether it issued that page: this service passes it through, and a cursor
        Commerce refuses is a 400 (INVALID_ARGUMENT), not an outage.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of order lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLinePage'
              example:
                items:
                  - order_id: 00000000-0000-4000-8000-0000000000aa
                    line_id: '7001'
                    sku: SKU-RED-M
                    category: apparel
                    quantity: 2
                    line_paid_amount: 2599
                    currency: CNY
                    paid_at: '2026-09-10T08:15:00Z'
                    status: PAID
                    version: 3
                page:
                  limit: 20
                  next_cursor: null
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/orders/{order_id}:
    get:
      tags: [orders]
      operationId: readOrder
      summary: One authorised order and its lines
      description: |
        The customer's own order, or a merchant's order for a line it owns
        (docs/core-contracts.md:27). A line the principal cannot see is 404, not 403: the
        existence of another tenant's order is not disclosed.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order lines the principal may see
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLinePage'
              example:
                items:
                  - order_id: 00000000-0000-4000-8000-0000000000aa
                    line_id: '7001'
                    sku: SKU-RED-M
                    category: apparel
                    quantity: 2
                    line_paid_amount: 2599
                    currency: CNY
                    paid_at: '2026-09-10T08:15:00Z'
                    status: PAID
                    version: 3
                page:
                  limit: 20
                  next_cursor: null
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/cases:
    post:
      tags: [cases]
      operationId: createCase
      summary: Open a refund case for one order line
      description: |
        Idempotent on the Idempotency-Key header; the same key with a different body is
        409, and the same key with the same body replays the stored answer. The case starts
        at QUEUED with input_revision 1 (docs/domain-model.md:55), and its line must be one
        the principal can see: the scope is derived from the token, so a line that is not
        the caller's is 404 like any other invisible resource (docs/core-contracts.md:27).
        Merchant staff do not open cases here; they work the review queue
        (docs/core-contracts.md:33), so a merchant-scoped token without a customer is 403.
        One line has at most one active case; a second attempt while one is open is 409
        (docs/domain-model.md:26).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreateRequest'
            example:
              line_id: '7001'
              description: 包裹显示已揽收但7天无新物流，疑似丢失，希望退款
              requested_actions: [REFUND]
      responses:
        '201':
          description: Case created
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCreatedResponse'
              example:
                case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
                status: QUEUED
                input_revision: 1
                version: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/SemanticInvalid'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/cases/{case_id}:
    get:
      tags: [cases]
      operationId: readCase
      summary: Case state, public evidence and investigation trajectory
      description: |
        Returns the case, its proposal, its authorisation, its operation and the
        trajectory of what happened, in the order it happened
        (docs/core-scope.md:7). The trajectory is read from case_timeline, which is
        written in the same transaction as the inbox projection and the local event
        (docs/core-contracts.md:67).

        Visibility follows the same rule as the order view: the case's own customer, or the
        merchant that owns the line. A case the principal cannot see is 404, never 403, so
        the existence of another tenant's case is not disclosed (docs/core-contracts.md:27).
        The proposal, authorisation and operation members appear once those exist; a case at
        QUEUED has none of them yet.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSnapshot'
              example:
                case:
                  case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
                  status: PENDING_REVIEW
                  input_revision: 1
                  version: 6
                  created_at: '2026-09-18T03:00:00Z'
                  updated_at: '2026-09-18T04:30:00Z'
                  requested_actions: [REFUND]
                  line_id: '7001'
                  order_id: 00000000-0000-4000-8000-0000000000aa
                  description: 包裹显示已揽收但7天无新物流，疑似丢失，希望退款
                proposal:
                  origin: AGENT
                  schema_version: 2
                  proposal_id: 5f0f0f0f-1111-4222-8333-444455556666
                  run_id: e2e2e2e2-3333-4444-8555-aaaaaaaaaaaa
                  case_id: 9c858901-8a57-4791-81fe-4c455b099bc9
                  input_revision: 1
                  case_type: LOGISTICS
                  recommended_action: REFUND
                  suggested_amount_minor: 2599
                  summary: 物流7天无更新且承运商结论为丢失，按政策可全额退款
                  reason_codes: [CARRIER_LOST, NO_SCAN_7D]
                  evidence_refs:
                    - observation_id: obs-1
                      source_ref: line:7001/shipment
                      source_version: '2'
                      content_hash: '1111111111111111111111111111111111111111111111111111111111111111'
                  policy_refs:
                    - bundle_id: policy-logistics-2026.09
                      version: '2026.09'
