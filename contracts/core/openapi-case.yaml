                    appended_role: CUSTOMER
                  - observation_id: 1d1c2a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                    source_ref: evidence:5f0c2b1a-9d3e-4a7b-8c2d-1e3f5a7b9c0d
                    source_version: '2'
                    content_hash: '6666666666666666666666666666666666666666666666666666666666666666'
                    evidence_kind: REVIEWER_VERIFICATION
                    content: 承运商系统复核显示该件确实停留在分拨中心
                    input_revision: 3
