  /internal/v1/cases/{case_id}/policy-manifest:
    get:
      tags: [internal]
      operationId: readPolicyManifest
      summary: Policy bundles, versions and hashes bound to the case
      description: |
        The run is pinned to an immutable manifest; a case never silently switches to a
        newer policy (docs/core-contracts.md:50).
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Pinned manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyManifestResponse'
              example:
                merchant_id: M-1001
                bundles:
                  - bundle_ids: [policy-logistics-2026.09]
                    manifest_hash: '9999999999999999999999999999999999999999999999999999999999999999'
                    safety_epoch: 1
                effective_from: '2026-09-01T00:00:00Z'
                effective_to: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/policies/{bundle_id}:
    get:
      tags: [internal]
      operationId: readPolicyBundle
      summary: Authoritative policy rules for one bundle
      description: |
        The text the Agent cited, so Java can re-check the citation against the source
        rather than against the Agent's summary (docs/core-contracts.md:51).
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/BundleId'
      responses:
        '200':
          description: Policy bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyBundle'
              example:
                bundle_id: policy-logistics-2026.09
                merchant_id: M-1001
                version: '2026.09'
                manifest_hash: '9999999999999999999999999999999999999999999999999999999999999999'
                safety_epoch: 1
                rules:
                  - rule_id: R-LOST-001
                    title: 承运商判定丢失
                    text: 承运商结论为 LOST 且无有效签收时，可按行支付金额全额退款。
                    chunk_id: c-01
                    content_hash: '3333333333333333333333333333333333333333333333333333333333333333'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{case_id}/review-context:
    get:
      summary: Read scoped reviewer actions and pinned policy text
      operationId: readReviewerContext
      description: |
        Merchant staff only; cross-merchant and unknown are both 404. Returns the current case
        version, the actions that are actually allowed now, the pinned policy text of the
        bundle the case was opened with, the recorded human decisions and the execution result
        of the current authorization. Absent policy is UNAVAILABLE rather than an inferred
        eligibility (docs/core-contracts.md:94).
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Current version, allowed actions and policy text; actions remain subject to write-time validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerContext'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{case_id}/review-actions:
    post:
      summary: Form a manual proposal or decide a case without a pending authorization
      operationId: submitReviewerAction
      description: |
        Staff only. If-Match is mandatory. MANUAL_PROPOSAL requires actual case evidence
        with exact provenance and pinned policy citations; amount is recomputed by Java.
        REJECT and REQUEST_INFO do not require a fabricated authorization and advance
        input_revision to fence older investigation callbacks. Consumed input is frozen.
        REQUEST_INFO is unavailable while waiting, after two question rounds, or after expiry.
        The amount is never taken from the body: a manual proposal is a proposal, not a
        payment, and the executable authorization is created only if the citations still
        verify against this service's own records (docs/core-contracts.md:96).
        Staff writes require current ownership, If-Match and If-Collaboration-Match; missing
        or stale collaboration credentials return 409. Invalid input or If-Match may return 422.
        Identity is rechecked in the case-locked transaction.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IfCollaborationMatch'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewerAction'
      responses:
        '200':
          description: Updated case snapshot; a manual proposal still requires separate authorization review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSnapshot'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Stale case version or action unavailable in current state.
        '422':
          description: Invalid action, reason or citations.

  /api/v1/admin/accounts:
    get:
      operationId: listMerchantAccounts
      summary: List own merchant accounts
      description: 'docs/staff-management.md: MERCHANT_ADMIN only, own merchant from signed current session;
        immutable username/merchant/customer binding. Merchant then ordered account locks, last enabled
        administrator protected. Public state/audit never expose credentials; security changes invalidate
        old tokens. Account maintenance does not change case ownership or Agent inputs.'
