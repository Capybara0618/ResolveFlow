            PROCESSING: {type: integer, minimum: 0}
            ATTENTION: {type: integer, minimum: 0}
            CLOSED: {type: integer, minimum: 0}
            ALL: {type: integer, minimum: 0}
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [authorization_id, authorization_version, decision, reason]
      properties:
        authorization_id:
          $ref: '#/components/schemas/Uuid'
        authorization_version:
          $ref: '#/components/schemas/Version'
          description: The version the reviewer saw. A stale version cannot be applied.
        decision:
          type: string
          enum: [APPROVE, REJECT, REQUEST_INFO]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ReviewResponse:
      type: object
      additionalProperties: false
