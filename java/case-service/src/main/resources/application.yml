# case-service — T01 skeleton configuration.
# Ports follow docs/architecture.md (container-internal ports).
server:
  port: 8083

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: case-service
  jackson:
    deserialization:
      # The core schemas are additionalProperties: false, so an unknown member is a protocol error
      # rather than something to ignore. Boot defaults this to false; the contracts decide here.
      fail-on-unknown-properties: true
  datasource:
    # case_db, and the case_svc account that may read nothing else
    # (docs/engineering.md:60; infra/mysql/init/01-databases.sql).
    url: ${CASE_DB_URL:jdbc:mysql://127.0.0.1:3306/case_db?connectionTimeZone=UTC&preserveInstants=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${CASE_DB_USER:case_svc}
    password: ${CASE_DB_PASSWORD:case_svc}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 100ms
      connect-timeout: 100ms

# Demonstration identity (C01.1) lives under resolveflow.identity below; the secret is a local
# default, not a deployment key: the core profile is meant to be runnable and explainable, and a real
# deployment must override it.
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # Rows map into records through their canonical constructor; there are no setters to
    # fall back on, so argument names must be compiled in (Boot's parent does that).
    arg-name-based-constructor-auto-mapping: true

resolveflow:
  compat:
    # Historical facade tests may opt in; Gateway routes trading requests directly to Commerce.
    commerce-facade-enabled: false
  user-media-dir: ${RESOLVEFLOW_USER_MEDIA_DIR:tmp/user-media}
  product-reviews:
    rate-limit-enabled: ${PRODUCT_REVIEW_RATE_LIMIT_ENABLED:false}
  review-cache:
    enabled: ${REVIEW_CACHE_ENABLED:false}
  commerce:
    # Where Case reaches Commerce for the order view. The local default matches a JVM run of
    # commerce-service; compose overrides it with the in-cluster address.
    base-url: ${COMMERCE_BASE_URL:http://127.0.0.1:8081}
  # Where Case hands a run to the Agent (C06.1c). The local default matches a JVM run of the Python
  # service on its own port; compose overrides it with the in-cluster address.
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8082}
  identity:
    jwt:
      secret: resolveflow-core-demo-identity-secret
      ttl-seconds: 3600

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Details stay hidden by default: the gateway is reachable from outside the
      # compose network, and component/DB status is useful reconnaissance. The
      # Agent service takes the same position (status only). Enable temporarily
      # with -Dmanagement.endpoint.health.show-details=always when debugging.
      show-details: never
