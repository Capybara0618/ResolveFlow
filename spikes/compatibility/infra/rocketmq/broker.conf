# T00 spike broker config.
# brokerIP1 is required: the default is the container's internal IP, which the
# host-run Java client and Testcontainers cannot reach. 127.0.0.1 is correct
# because the broker's published port is bound on the host.
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
namesrvAddr = rocketmq-namesrv:9876
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# Local dev convenience: the spike creates its topic on first send.
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true