[project]
name = "resolveflow-t00-python-spike"
version = "0.0.1"
description = "T00 compatibility spike: LangGraph PG checkpointer, MCP stdio, canonical JSON hash"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned to versions observed in the PyPI JSON API (see docs/compatibility-report.md).
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.5",
    "mcp==2.2.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spike_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]