<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#14233e;background:#f3f6fb;font-size:16px;--blue:#165dff;--line:#e5ebf4;--muted:#60718a}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #759aff;outline-offset:3px}button{border:1px solid var(--line);background:white;color:inherit;border-radius:8px;padding:10px 16px}button:hover{background:#f0f5ff}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.primary:hover{background:#114bd1}button.quiet{border:0;color:var(--blue);background:transparent;padding:6px}button:disabled{cursor:default;color:#78869a;background:#edf0f5;border-color:#edf0f5}h1,h2,h3,p{margin-top:0}h1{font-size:26px;margin-bottom:10px}h2{font-size:22px;margin-bottom:16px}h3{font-size:18px;margin-bottom:10px}p{line-height:1.7;margin-bottom:12px}.muted{color:var(--muted)}.preview{background:#172b4b;color:#e1eaff;padding:15px 28px;display:flex;gap:24px;align-items:center;justify-content:space-between}.preview strong{font-size:18px}.preview span{color:#d1def4}.preview a{color:#d1e2ff}.views{padding:14px 28px;background:white;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.views button{padding:8px 13px}.views button[aria-pressed=true]{background:#eaf0ff;color:#104fdf;border-color:#aec6ff}.app{max-width:1680px;margin:0 auto;background:#f7faff;min-height:750px}.top{height:80px;display:flex;align-items:center;gap:34px;padding:0 32px;background:white;border-bottom:1px solid var(--line)}.brand{font-weight:750;font-size:24px;color:#165dff;letter-spacing:-.5px}.top nav{display:flex;gap:28px;align-items:center;flex:1}.top nav span.active{color:var(--blue);font-weight:650}.account{display:flex;gap:10px;align-items:center}.avatar{display:grid;place-items:center;flex-shrink:0;width:38px;height:38px;border-radius:50%;background:#e7efff;color:var(--blue);font-weight:650}.workspace{d margin-top:20px;gap:12px}.chat-shell{display:flex;flex:1;min-width:0}.chat{flex:1;min-width:0;background:white;display:flex;flex-direction:column}.chat-title{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}.chat-title h2{margin:0 0 5px}.chat-title .art{width:64px;height:64px}.chat-title .art img,.chat-title .art svg{width:56px;height:56px}.chat-title .meta{flex:1}.chat-title .meta p{margin:0}.chat-body{padding:24px 28px;flex:1}.message{display:flex;gap:12px;margin-bottom:20px;align-items:flex-start}.message.user{flex-direction:row-reverse}.bubble{max-width:88%;background:#f4f7fb;border:1px solid #edf1f6;border-radius:12px;padding:14px 18px;line-height:1.75}.user .bubble{background:#edf3ff;border-color:#dce8ff}.author{font-weight:650;display:block;margin-bottom:5px}.bubble p:last-child{margin-bottom:0}.bubble .facts{border-left:3px solid #9fbeff;padding-left:14px;margin:12px 0}.citation{color:var(--blue);display:inline-block;border:0;padding:0;background:none;text-align:left}.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-left:50px;margin-top:-4px}.composer{padding:18px 26px 22px;border-top:1px solid var(--line);background:white}.composer textarea{width:100%;height:70px;resize:vertical;padding:12px;border:1px solid #d8e0ed;border-radius:9px;background:#fff}.compose-footer{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:12px}.mode{display:flex;gap:8px;margin-bottom:12px}.mode button{padding:7px 12px}.mode button.active{background:#edf3ff;color:var(--blue);border-color:#b6ccff}.context{width:278px;background:#f8faff;border-left:1px solid var(--line);padding:24px 20px;flex-shrink:0}.context h3{margin-bottom:16px}.context section{margin-bottom:26px}.context p{margin:0 0 12px}.context .value{display:block;color:var(--muted);margin-top:5px;line-height:1.6}.subtle-line{border-top:1px solid var(--line);padding-top:18px}.action-card{margin:0 0 20px 50px;border:1px solid #bfd0f2;border-radius:12px;background:white;overflow:hidden}.action-card .card-head{background:#f0f5ff;padding:15px 20px;border-bottom:1px solid #dbe6fa}.action-card .card-head h3{margin:0}.action-card .card-main{padding:20px}.field{margin-bottom:16px}.field>label{display:block;font-weight:650;margin-bottom:8px}.field textarea{width:100%;min-height:82px;font:inherit;line-height:1.65;border:1px solid #dbe3ef;border-radius:8px;padding:10px;resize:vertical}.field .value{line-height:1.7}.action-footer{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding:15px 20px}.notice{background:#fff7e9;border-radius:8px;color:#7a581a;padding:12px 14px;line-height:1.6}.inline-success{padding:12px 16px;background:#e8f5ee;color:#286746;border-radius:8px}.timeline{padding-left:18px;border-left:2px solid #dce5f3}.timeline>div{position:relative;margin-bottom:22px;padding-left:8px}.timeline>div:before{content:"";position:absolute;left:-25px;top:7px;width:10px;height:10px;border-radius:50%;background:#75a0ef;border:3px solid #f8faff}.timeline strong{display:block;margin-bottom:5px}.merchant-nav{width:220px;padding:24px 16px;background:white;border-right:1px solid var(--line)}.merchant-nav button{width:100%;text-align:left;margin-bottom:8px;border:0}.merchant-nav button.active{background:#edf3ff;color:var(--blue);font-weight:650}.merchant-nav .store-name{padding:10px 14px 20px;font-size:18px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}.metric{padding:20px 24px}.metric strong{display:block;font-size:28px;margin-top:8px}.case-row{display:flex;align-items:center;gap:20px;margin-bottom:16px}.case-row .text{flex:1;min-width:0}.case-row h3{margin:0 0 9px}.case-row p{margin:0;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 326px;gap:22px}.detail-grid .card{margin-bottom:18px}.two-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.label{font-weight:650;margin-bottom:10px}.list{padding-left:20px;line-height:1.8;margin-bottom:0}.evidence{border-left:3px solid #c6d7fa;padding-left:14px;margin-bottom:18px}.evidence strong{display:block;margin-bottom:6px}.reply-box{min-height:135px;width:100%;font:inherit;padding:12px;border:1px solid #dae3f0;border-radius:8px;line-height:1.65;resize:vertical}.reply-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.banner{background:#eef4ff;border:1px solid #d5e3fc;border-radius:8px;padding:12px 16px;margin-bottom:18px;line-height:1.65}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#203959;color:white;padding:13px 22px;border-radius:9px;box-shadow:0 6px 24px #132d4930;z-index:10}.policy{position:fixed;inset:0;background:#15243b44;display:flex;justify-content:flex-end;z-index:20}.policy>div{width:min(520px,95vw);padding:32px;background:white;overflow:auto}.policy h2{margin-top:20px}details{line-height:1.8}summary{cursor:pointer;color:var(--blue)}.hidden{display:none!important}.selected-hint{padding:14px;border-radius:8px;background:#eaf1ff;color:#2b5797;margin-top:18px;line-height:1.65}
@media(max-width:1300px){.context{width:250px;padding:22px 16px}.history{width:218px}.chat-body{padding:22px}.content{padding:26px}.detail-grid{grid-template-columns:minmax(0,1fr) 290px}.top{gap:24px}.top nav{gap:20px}.case-row{gap:14px}}
@media(max-width:1020px){.context{display:none}.history{width:205px}.top nav{gap:15px}.top{padding:0 22px}.detail-grid{grid-template-columns:1fr}.merchant-nav{width:180px}.order-grid{grid-template-columns:1fr}.metrics{gap:10px}.preview{align-items:flex-start}.preview span{max-width:60%}}

<body>
<div class="preview"><strong>售后客服 · 预期图 v1</strong><span>设计预览：示例对话与办理记录，不提交业务　·　<a href="README.md">图文说明</a></span></div>
<div class="views" id="views" aria-label="预期视图选择"></div>
<div id="app" class="app"></div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="policy" class="policy hidden" role="dialog" aria-modal="true" aria-label="政策出处"></div>
<script src="samples.js"></script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const samples=window.DESIGN_SAMPLES;
const pages=[['orders','用户 · 选择商品'],['chat','用户 · 自然咨询'],['handoff','用户 · 人工转交'],['refund','用户 · 退款确认'],['progress','用户 · 人工接续'],['queue','商家 · 待办'],['detail','商家 · 核查详情']];
let view='orders',selected='A-SIGNED',recipient='merchant',shared=true,ticket='pending',historyNotes={};
const flowBySample={},merchantReplies={},sharedBySample={},summaryBySample={};
function hasReply(){return Boolean(merchantReplies[selected])}
const sample=()=>samples.find(x=>x.name===selected);
function art(s){return s.merchant_id==='M-1001'?'<img alt="耳机商品插画" src="../../web/src/preview/assets/headphones.svg">':'<svg viewBox="0 0 100 100" role="img" aria-label="台灯商品插画"><path d="M32 24 61 11 78 40 37 49Z" fill="#95b5ed"/><path d="m54 45 8 28-15 12" fill="none" stroke="#395b8a" stroke-width="6" stroke-linecap="round"/><ellipse cx="49" cy="87" rx="25" ry="6" fill="#9bb5de"/><path d="m39 51 41-12" stroke="#486da2" stroke-width="4" stroke-linecap="round"/></svg>'}
function product(s,price=false){return `<div class="product"><div class="art">${art(s)}</div><div class="product-copy"><strong>${esc(s.product_name)}</strong><p>${esc(s.variant)} · 数量 1</p>${price?`<div class="price">¥${(s.amount_minor/100).toFixed(2)}</div>`:''}</div></div>`}
function appHeader(merchant=false){return `<header class="top"><span class="brand">ResolveFlow</span><nav>${(merchant?['商家工作台']:['商城首页','购物车','我的订单','售后服务']).map(x=>`<span class="${x===(merchant?'商家工作台':'售后服务')?'active':''}">${x}</span>`).join('')}</nav><div class="account"><span class="avatar">${merchant?'松':'我'}</span><span>${merchant?'松间数码':'买家01'}</span></div></header>`}
function historyPanel(){return `<aside class="history"><h3>我的咨询</h3><p class="hint">每件商品保留独立对话</p>${['A-SIGNED','B-SIGNED'].map(key=>{let s=samples.find(x=>x.name===key);return `<button class="history-item ${selected===key?'selected':''}" data-action="select" data-sample="${key}"><strong>${esc(s.product_name)}</strong><small>${esc(s.store_name)}</small><small>${key===selected?'当前咨询':'查看这件商品的咨询'}</small></button>`}).join('')}<button class="quiet" data-action="view" data-view="orders">＋ 选择其他订单商品</button><div class="bottom">当前店铺<br><strong>${esc(sample().store_name)}</strong><br>只处理当前选中的商品</div></aside>`}
function ruleFor(s){if(s.status==='DELIVERED')return {title:'已签收争议',text:'存在有效签收记录时不能仅因客户主张未收到而退款，须人工核验签收争议；事实不足时要求补充材料或转人工调查。'};if(s.status==='LOST')return {title:'承运商判定丢失',text:'承运商结论为 LOST 且无有效签收记录时，经人工核验可按该订单行全部数量的实付金额退款；本地模拟在途不代表承运商丢失。'};return {title:'普通在途及待核实情况',text:'IN_TRANSIT 本身不构成物流丢失或退款资格；尚无承运商异常结论且无其他经核验的退款理由时，要求补充信息或转人工，不按未发货规则退款。'}}
function context(progress=false){let s=sample();if(progress&&flowBySample[selected]==='refund')return '<aside class="context"><section><h3>退款申请进度</h3><p>客户已确认申请</p><p>等待商家核验与审批</p><p class="muted">批准后才会进入退款执行。</p></section></aside>';return `<aside class="context"><section><h3>订单与物流</h3><p>所属店铺<span class="value">${esc(s.store_name)}</span></p><p>本行实付<span class="value">¥${(s.amount_minor/100).toFixed(2)} · 1 件</span></p><p>物流记录<span class="value">${s.status==='DELIVERED'?'已有签收记录':'当前'+label(s.status)}</span></p><p>用户反馈<span class="value">${selected.endsWith('SIGNED')?'尚未收到商品':'希望了解当前物流'}</span></p></section>${progress?`<section class="subtle-line"><h3>商家处理进度</h3><div class="timeline"><div><strong>已转交商家</strong><span class="muted">问题及共享材料已提交</span></div><div><strong>${hasReply()?'商家已回复':'等待商家核查'}</strong><span class="muted">回复会出现在当前会话</span></div></div></section>`:`<section class="subtle-line"><h3>办理依据</h3><p class="muted">${esc(ruleFor(s).text)}</p><button class="quiet" data-action="policy">查看本店政策出处 ↗</button></section>`}<section class="subtle-line"><p class="muted">咨询与退款申请分别处理。提交申请前会请你确认。</p></section></aside>`}
function label(status){return ({IN_TRANSIT:'运输中',DELIVERED:'已签收',LOST:'物流丢失',UNKNOWN:'待核实'})[status]||status}
function msg(who,body){return `<div class="message ${who==='我'?'user':''}"><span class="avatar">${who==='我'?'我':who==='商家'?'松':'助'}</span><div class="bubble"><span class="author">${who==='助手'?'售后助手':who==='商家'?esc(sample().store_name)+' · 商家回复':'我'}</span>${body}</div></div>`}
function orders(){return appHeader()+`<main class="content"><div class="heading"><div><h1>想咨询哪件商品？</h1><p class="muted">选择商品后，直接描述你的问题。</p></div><button data-action="view" data-view="chat">继续上次咨询</button></div><div class="tabs"><button class="active" data-action="filter" data-filter="all">全部店铺</button><button data-action="filter" data-filter="M-1001">松间数码</button><button data-action="filter" data-filter="M-1002">拾光家居</button></div><div class="order-grid">${['A-SIGNED','B-SIGNED','A-TRANSIT','B-LOST'].map(key=>{let s=samples.find(x=>x.name===key);return `<section class="card order-card" data-merchant="${s.merchant_id}"><div class="store"><strong>${esc(s.store_name)}</strong><span class="pill ${s.status==='DELIVERED'?'green':'blue'}">${label(s.status)}</span></div>${product(s,true)}<div class="card-footer"><span class="muted">订单尾号 ${esc(s.order_tail)}</span><button class="primary" data-action="select" data-sample="${key}">咨询这件商品</button></div></section>`}).join('')}</div></main>`}
function composer(progress){let to=progress?recipient:'assistant';return `<footer class="composer">${progress?`<div class="mode"><button data-action="recipient" data-recipient="merchant" class="${to==='merchant'?'active':''}">补充给商家</button><button data-action="recipient" data-recipient="assistant" class="${to==='assistant'?'active':''}">询问智能助手</button></div>`:''}<label class="hidden" for="message-input">消息内容</label><textarea id="message-input" placeholder="${to==='merchant'?'补充核查情况，发送给当前商家…':'描述问题，也可以补充或纠正之前的信息…'}"></textarea><div class="compose-footer"><span class="muted">${to==='merchant'?'发送到当前咨询核查单':'当前商品的独立咨询'}</span><button class="primary" data-action="send">发送</button></div></footer>`}
function confirmCard(kind){let refund=kind==='refund',s=sample();return `<section class="action-card"><div class="card-head"><h3>${refund?'确认退款申请':'转交商家核查'}</h3></div><div class="card-main">${product(s)}<div class="field" style="margin-top:20px"><label for="summary">${refund?'申请说明':'问题摘要 · 可修改'}</label><textarea id="summary">${refund?(s.status==='DELIVERED'?'物流显示签收，但本人未收到，希望申请本行商品全额退款。':'希望根据当前物流情况申请本行商品全额退款。'):(s.status==='DELIVERED'?'物流显示签收，但本人未收到；已确认家人和代收点未找到，希望商家核实签收情况。':'希望商家核实当前物流进度，暂不申请退款。')}</textarea></div>${refund?`<div class="field"><label>申请退款金额</label><div class="price">¥${(s.amount_minor/100).toFixed(2)}</div><div class="muted">本行商品全部数量 · 1 件</div></div><div class="notice">这是退款申请，提交后由商家核验和审批。当前尚未批准或执行退款。</div>`:`<div class="field"><label>一并转交的内容</label><p>当前问题描述、相关物流记录，以及你选择共享的原文。</p><label><input id="share" type="checkbox" ${shared?'checked':''}> 共享与本次问题相关的客户原文</label><details style="margin-top:12px"><summary>预览共享原文</summary><p>“物流显示签收，但我没有收到。家里人和代收点都确认过，没有找到。”</p></details></div><div class="notice">本次只请商家核查，不申请退款。商家会在这里回复，你也可以继续补充。</div>`}</div><div class="action-footer"><button data-action="cancel">${refund?'暂不申请':'继续咨询'}</button><button class="primary" data-action="${refund?'confirm-refund':'confirm-handoff'}">${refund?'确认申请退款':'转交商家'}</button></div></section>`}
function customer(){let s=sample(),progress=view==='progress',refund=progress&&flowBySample[selected]==='refund';let initial=selected.endsWith('SIGNED')?'物流显示签收，但我没有收到。家里人和代收点都确认过，没有找到。':'帮我看看这件商品现在的物流情况。';let answer=selected.endsWith('SIGNED')?`<p>物流中已有签收记录，但你反馈尚未收到，两种信息我会分别保留。</p><p>按本店政策，签收争议需要商家核验。我可以帮你整理核查问题，不需要先申请退款。</p><button class="citation" data-action="policy">依据：本店售后政策 · 签收争议 ↗</button>`:`<p>当前物流状态为${label(s.status)}。${s.status==='LOST'?'模拟承运商已有丢失结论，可进一步了解本店退款条件。':'我可以继续查询政策或帮你准备商家核查问题。'}</p>`;return appHeader()+`<div class="workspace">${historyPanel()}<div class="chat-shell"><section class="chat"><header class="chat-title"><div class="art">${art(s)}</div><div class="meta"><h2>${esc(s.product_name)}</h2><p class="muted">${esc(s.store_name)} · ${esc(s.variant)} · 实付 ¥${(s.amount_minor/100).toFixed(2)}</p></div><span class="pill ${progress?'amber':'blue'}">${refund?'退款申请待核验':progress?(hasReply()?'商家已回复':'等待商家核查'):'智能客服'}</span></header><div class="chat-body">${msg('我',`<p>${initial}</p>`)}${msg('助手',answer)}${view==='handoff'?confirmCard('handoff'):view==='refund'?confirmCard('refund'):refund?refundProgress():progress?`${msg('助手','<p>问题及你确认共享的材料已转交给商家。本次是咨询核查，没有申请退款。</p>')}${hasReply()?msg('商家','<p>'+esc(merchantReplies[selected])+'</p>'):msg('我','<p>麻烦核实一下，我暂时不退款。</p>')}<div class="banner">${hasReply()?'商家正在等待你的补充。可以直接在下方回复。':'商家回复后会出现在这里，你也可以现在补充情况。'}</div>${hasReply()?'<button data-action="resolved">问题已解决</button>':''}`:`<div class="suggestions"><button data-action="view" data-view="handoff">请商家核查</button><button data-action="view" data-view="refund">我想申请退款</button><button data-action="policy">先了解退款条件</button></div>${historyNotes[selected]?msg('我',`<p>${esc(historyNotes[selected])}</p>`)+msg('助手','<p>已收到你的最新补充。我会保留原物流记录，并按当前情况继续处理。</p>'):''}`}</div>${composer(progress)}</section>${context(progress)}</div></div>`}
function merchantNav(){return `<aside class="merchant-nav"><div class="store-name">松间数码</div>${['商家概览','商品管理','交易订单','售后工单','售后政策'].map(x=>`<button class="${x==='售后工单'?'active':''}" ${x==='售后工单'?'data-action="view" data-view="queue"':'data-action="placeholder"'}>${x}</button>`).join('')}<div class="bottom muted" style="padding:20px 12px;line-height:1.7">当前工作范围<br>本店订单与售后</div></aside>`}
function queue(){let s=samples.find(x=>x.name==='A-SIGNED');return appHeader(true)+`<div class="workspace">${merchantNav()}<main class="content"><div class="heading"><div><h1>售后待办</h1><p class="muted">集中处理本店咨询核查与退款申请</p></div><span class="pill">松间数码</span></div><div class="metrics"><section class="card metric">待核查咨询<strong>1</strong></section><section class="card metric">待审核申请<strong>1</strong></section><section class="card metric">待客户补充<strong>0</strong></section></div><div class="tabs"><button class="active" data-action="queue-filter" data-kind="all">全部待办</button><button data-action="queue-filter" data-kind="consultation">咨询核查</button><button data-action="queue-filter" data-kind="refund">退款申请</button></div><section class="card case-row" data-kind="consultation"><div class="art">${art(s)}</div><div class="text"><h3>签收后未收到 · 请求核实</h3><p>${esc(s.product_name)} · 买家01 · 本行实付 ¥329.00</p><p style="margin-top:9px">客户暂不退款，希望核查签收情况。</p></div><span class="pill amber">待商家核查</span><button class="primary" data-action="view" data-view="detail">查看并处理</button></section><section class="card case-row" data-kind="refund"><div class="art">${art(s)}</div><div class="text"><h3>签收争议 · 退款申请</h3><p>无线降噪耳机 · 买家01 · 申请 ¥329.00</p><p style="margin-top:9px">已整理调查建议，等待人工核验。</p></div><span class="pill blue">待审核</span><button data-action="placeholder">查看申请</button></section><p class="muted">以上待办为不同请求的设计示例，非同一诉求重复建单。</p></main></div>`}
function detail(){let s=samples.find(x=>x.name==='A-SIGNED');return appHeader(true)+`<div class="workspace">${merchantNav()}<main class="content"><div class="heading"><div><button class="quiet" data-action="view" data-view="queue">← 返回售后待办</button><h1 style="margin-top:12px">签收后未收到 · 咨询核查</h1><p class="muted">买家01 · 松间数码 · 本次没有退款申请</p></div><span class="pill amber">${hasReply()?'已回复，待客户补充':'待商家核查'}</span></div><div class="detail-grid"><div><section class="card">${product(s,true)}</section><section class="card"><h2>客户诉求与共享材料</h2><p>客户希望核实签收情况，暂不申请退款。</p><div class="evidence"><strong>客户原文 · 已共享</strong><p>“物流显示签收，但我没有收到。家里人和代收点都确认过，没有找到。”</p></div><details><summary>查看相关对话与后续补充</summary><p>仅展示客户本次确认共享的原文及提交后的补充，不包含其他商品咨询。</p></details></section><section class="card"><h2>调查依据与处理建议</h2><div class="two-columns"><div><div class="label">系统记录</div><p>当前物流：已签收<br>来源：模拟物流查询</p></div><div><div class="label">客户陈述</div><p>尚未收到；已询问家人及代收点。</p></div></div><div class="banner"><strong>Agent 建议</strong><br>当前存在签收争议，建议核验签收记录及代收信息，再回复客户。现有记录不足以确认本人已收货。</div><button class="citation" data-action="policy">政策依据：签收争议须人工核验 ↗</button><details style="margin-top:12px"><summary>展开来源与版本</summary><p>适用店铺：松间数码<br>政策版本：2026.10<br>物流与客户材料分别保留，核验结果另行记录。</p></details></section></div><aside><section class="card"><h2>回复与跟进</h2><label for="merchant-reply">给客户的回复</label><textarea id="merchant-reply" class="reply-box" style="margin-top:12px">已收到你的反馈。请补充是否曾授权他人代收，我们会继续核查签收记录。</textarea><div class="reply-actions"><button class="primary" data-action="merchant-reply">请求补充信息</button><button data-action="merchant-reply">发送核查回复</button></div><p class="muted" style="margin:15px 0 0">提交后显示为商家回复。已回复不自动等于问题已解决。</p></section><section class="card"><h3>核查记录</h3><p class="muted">记录已核实事项及依据，原材料继续保留。</p><textarea class="reply-box" id="internal-note" aria-label="核查记录" placeholder="填写实际核查结果…" style="min-height:90px"></textarea><button data-action="save-note" style="margin-top:12px">保存核查记录</button></section></aside></div></main></div>`}
function refundProgress(){return msg('助手','<p>退款申请已提交，等待商家核验。当前尚未批准或执行退款。</p>')+'<div class="banner">申请进度：待商家核验 · 申请金额 ¥'+(sample().amount_minor/100).toFixed(2)+'</div>'}
function setView(next){view=next;render()}
function render(){if(['queue','detail'].includes(view))selected='A-SIGNED';$('#views').innerHTML=pages.map(([k,l])=>`<button data-action="view" data-view="${k}" aria-pressed="${k===view}">${l}</button>`).join('');$('#app').innerHTML=view==='orders'?orders():view==='queue'?queue():view==='detail'?detail():customer();if(view==='detail'){if(summaryBySample[selected])$('.detail-grid .card:nth-of-type(2)>p').textContent=summaryBySample[selected];if(sharedBySample[selected]===false)$('.evidence').innerHTML='<strong>客户未共享原文</strong><p>本次仅转交客户确认的问题摘要及相关业务记录。</p>';}window.history.replaceState(null,'','#'+view);document.title='ResolveFlow · '+pages.find(p=>p[0]===view)[1]}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
document.addEventListener('click',event=>{let b=event.target.closest('[data-action]');if(!b)return;let action=b.dataset.action;if(action==='view')setView(b.dataset.view);if(action==='select'){selected=b.dataset.sample;view='chat';recipient='merchant';render()}if(action==='recipient'){recipient=b.dataset.recipient;render()}if(action==='cancel'){view='chat';render();toast('已保留咨询，未提交申请或转交')}if(action==='confirm-handoff'){shared=$('#share').checked;sharedBySample[selected]=shared;summaryBySample[selected]=$('#summary').value;ticket='pending';flowBySample[selected]='consultation';view='progress';render();toast('预览：问题已转交商家，未申请退款')}if(action==='confirm-refund'){flowBySample[selected]='refund';view='progress';render();toast('预览：申请已提交，尚未批准或执行退款')}if(action==='send'){let input=$('#message-input'),text=input.value.trim();if(!text){toast('请输入需要发送的内容');return}historyNotes[selected]=text;if(view==='progress'){let body=$('.chat-body');body.insertAdjacentHTML('beforeend',msg('我',`<p>${esc(text)}</p>`)+`<div class="banner">${recipient==='merchant'?'已补充到当前商家核查记录。':'助手将基于当前商品回答；没有修改商家核查结论。'}</div>`);input.value=''}else{render()}}if(action==='merchant-reply'){if(!$('#merchant-reply').value.trim()){toast('请填写回复');return}merchantReplies['A-SIGNED']=$('#merchant-reply').value;toast('预览：已发为商家回复，用户端可查看')}if(action==='save-note'){toast($('#internal-note').value.trim()?'预览：核查记录已保存，原材料继续保留':'请先填写核查结果')}if(action==='resolved'){ticket='resolved';$('.chat-title .pill').textContent='咨询已解决';toast('预览：咨询已解决，没有提交退款')}if(action==='policy'){let store=['queue','detail'].includes(view)?'松间数码':sample().store_name;$('#policy').innerHTML=`<div><button data-action="close-policy">关闭</button><h2>${esc(store)} · 售后政策</h2><p class="muted">2026.10 · 合成演示政策</p><h3>${esc(ruleFor(sample()).title)}</h3><p>${esc(ruleFor(sample()).text)}</p><h3>单行全额与人工决定</h3><p>仅支持单订单行全部数量的全额模拟退款。模型建议不是授权，最终由商家核验并审批。</p></div>`;$('#policy').classList.remove('hidden')}if(action==='close-policy')$('#policy').classList.add('hidden');if(action==='filter'){document.querySelectorAll('.order-card').forEach(c=>c.classList.toggle('hidden',b.dataset.filter!=='all'&&c.dataset.merchant!==b.dataset.filter));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b))}if(action==='queue-filter'){document.querySelectorAll('.case-row').forEach(c=>c.classList.toggle('hidden',b.dataset.kind!=='all'&&c.dataset.kind!==b.dataset.kind));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b))}if(action==='placeholder')toast('当前预期图重点展示咨询核查，其他入口沿用现有功能')});
document.addEventListener('keydown',event=>{if(event.key==='Escape')$('#policy').classList.add('hidden')});
addEventListener('hashchange',()=>{let requested=location.hash.slice(1);if(pages.some(([key])=>key===requested))setView(requested)});
let initial=location.hash.slice(1);if(pages.some(([key])=>key===initial))view=initial;render();
</script>
</body>
</html>
