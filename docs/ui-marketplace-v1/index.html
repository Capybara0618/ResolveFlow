<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResolveFlow · 多商家购物预期图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#122341;font-family:"Microsoft YaHei",system-ui,sans-serif;font-size:18px}header{padding:24px 32px;background:#fff;border-bottom:1px solid #dfe5ef;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:28px;margin:0}header p{margin:8px 0 0;color:#52647b;font-size:18px}.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 108px)}nav{padding:20px;background:white;border-right:1px solid #dfe5ef;display:flex;flex-direction:column;gap:8px}nav button{font:inherit;font-size:17px;text-align:left;border:0;border-radius:10px;background:transparent;color:#344966;padding:13px 12px;cursor:pointer}nav button[aria-current]{background:#e9f1ff;color:#165dff;font-weight:700}button:focus-visible,a:focus-visible{outline:3px solid #165dff;outline-offset:3px}main{padding:26px;min-width:0}h2{font-size:26px;margin:0 0 12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.toolbar a,header a{color:#165dff;text-decoration:none;font-size:18px}.figure{margin:0;border:1px solid #dfe5ef;background:white;border-radius:14px;overflow:hidden}.figure img{width:100%;height:auto;display:block;cursor:zoom-in}.summary{padding:18px 20px;font-size:18px;line-height:1.7;border-top:1px solid #e4e9f1}dialog{padding:20px;border:1px solid #dfe5ef;border-radius:16px;max-width:96vw;max-height:96vh;background:#fff}dialog::backdrop{background:#122341bf}dialog .dialog-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:20px}dialog button{font:inherit;background:#165dff;color:white;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}dialog img{display:block;max-width:90vw;max-height:80vh;object-fit:contain}#error{color:#a43824;padding:24px}a:hover{text-decoration:underline}
</style></head><body>
<header><div><h1>ResolveFlow · 多商家购物预期图</h1><p>11个页面视图＋2张状态板 · 目标设计，尚未实现 · 桌面网页</p></div><a href="README.md">阅读图文合同</a></header>
<div class="shell"><nav aria-label="页面选择"><button type="button" data-index="0" aria-current="page">M01 多商家商城首页</button>
<button type="button" data-index="1">M02 商品搜索与分类</button>
<button type="button" data-index="2">M03 商家店铺</button>
<button type="button" data-index="3">M04 商品详情</button>
<button type="button" data-index="4">M05 多店购物车</button>
<button type="button" data-index="5">M06 确认订单</button>
<button type="button" data-index="6">M07 模拟支付与结果</button>
<button type="button" data-index="7">M08 跨店个人订单中心</button>
<button type="button" data-index="8">M09 订单详情与售后衔接</button>
<button type="button" data-index="9">M10 商家交易订单</button>
<button type="button" data-index="10">M11 商家订单详情与模拟发货</button>
<button type="button" data-index="11">M12 交易异常状态板</button>
<button type="button" data-index="12">M13 归属与售后状态板</button></nav><main>
<div class="toolbar"><h2 id="title"></h2><a id="original" target="_blank" rel="noopener">查看原图</a></div>
<figure class="figure"><img id="preview" alt="" tabindex="0"><div id="error" hidden>图片尚未就绪，请检查 images 目录。</div><figcaption class="summary" id="summary"></figcaption></figure>
</main></div>
<dialog id="zoom"><div class="dialog-toolbar"><strong id="zoom-title"></strong><button type="button" id="close">关闭</button></div><img id="zoom-image" alt=""></dialog>
<script>
const pages=[{"id":"M01","title":"多商家商城首页","file":"01-marketplace.png"},{"id":"M02","title":"商品搜索与分类","file":"02-search.png"},{"id":"M03","title":"商家店铺","file":"03-store.png"},{"id":"M04","title":"商品详情","file":"04-product.png"},{"id":"M05","title":"多店购物车","file":"05-cart.png"},{"id":"M06","title":"确认订单","file":"06-checkout.png"},{"id":"M07","title":"模拟支付与结果","file":"07-payment.png"},{"id":"M08","title":"跨店个人订单中心","file":"08-orders.png"},{"id":"M09","title":"订单详情与售后衔接","file":"09-order-detail-v2.png"},{"id":"M10","title":"商家交易订单","file":"10-merchant-orders.png"},{"id":"M11","title":"商家订单详情与模拟发货","file":"11-merchant-detail-v2.png"},{"id":"M12","title":"交易异常状态板","file":"12-trade-states.png"},{"id":"M13","title":"归属与售后状态板","file":"13-aftercare-states.png"}];
const descriptions=[
"同一平台买家浏览两家店铺。商品卡突出图片、名称、价格与店铺。",
"关键词、分类、价格排序和店铺筛选；不展示虚构销量或评价。",
"进入某家店铺继续浏览，顶部仍保留全站商城和个人入口。",
"商品归属明确，数量可调整；购物车与立即购买共用交易路径。",
"两店商品同时保存，每家店独立结算。松间数码合计727元，拾光家居合计218元。",
"当前只结算松间数码：耳机1件329元、键盘2件398元，合计727元；收货信息为合成示例。",
"待支付与成功是同一订单的两个独立状态示例，不同时显示在正式操作页面。",
"同一买家看到不同店铺的本人订单；待支付草稿与已付款订单分开表达。",
"售后按订单行显示：耳机申请处理中，键盘未申请，原订单实付仍为727元。",
"商家管理员只能处理松间数码的交易。跨店个人汇总不扩大工作人员权限。",
"SF1003为耳机1件329元的新待发货订单；发货场景首次发布后冻结，交易页面不直接退款。",
"独立状态示例。响应未知先查询原付款，明确失败才允许新的付款尝试；重复提交与取消竞争由文字合同补充。",
"独立状态示例。越权不泄露订单，已付未发货退款需补政策；退款结果待确认不得另建退款操作。"
];
const preview=document.getElementById("preview"), zoom=document.getElementById("zoom");
function select(index){const p=pages[index];document.getElementById("title").textContent=p.id+" "+p.title;preview.src="images/"+p.file;preview.alt=p.title;document.getElementById("original").href=preview.getAttribute("src");document.getElementById("summary").textContent=descriptions[index];document.getElementById("error").hidden=true;document.querySelectorAll("nav button").forEach((b,i)=>{if(i===index)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});location.hash=p.id;}
function enlarge(){document.getElementById("zoom-image").src=preview.src;document.getElementById("zoom-image").alt=preview.alt;document.getElementById("zoom-title").textContent=document.getElementById("title").textContent;zoom.showModal();}
preview.addEventListener("click",enlarge);preview.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();enlarge();}});preview.addEventListener("error",()=>{document.getElementById("error").hidden=false;});
document.getElementById("close").addEventListener("click",()=>zoom.close());document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>select(Number(b.dataset.index))));
window.addEventListener("hashchange",()=>{const index=pages.findIndex(p=>"#"+p.id===location.hash);if(index>=0&&preview.getAttribute("src")!=="images/"+pages[index].file)select(index);});
select(Math.max(0,pages.findIndex(p=>"#"+p.id===location.hash)));
</script></body></html>
