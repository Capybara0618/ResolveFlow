<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResolveFlow 售后预期图 v3</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172b4d;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px 32px;background:white;border-bottom:1px solid #e0e6ee}h1{margin:0;font-size:28px}p{margin:8px 0}nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}button{font:inherit;background:white;border:1px solid #d8e2f2;border-radius:8px;padding:10px 18px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#165dff;color:white}main{max-width:1600px;padding:24px;margin:auto}img{display:block;max-width:100%;height:auto;margin:auto;border:1px solid #e0e6ee;border-radius:12px;background:white}a{color:#165dff}</style>
<header><h1>ResolveFlow · 售后预期图 v3</h1><p>买家与商家统一简约风格，商品优先。设计样例，实际字段与功能以<a href="README.md">图文合同</a>为准。</p><nav aria-label="预期图页面"></nav></header><main><img id="preview" alt=""><p><a id="original" target="_blank">打开原图</a></p></main>
<script>const pages=[['buyer-list','买家 · 我的售后'],['buyer-apply','买家 · 申请退款'],['buyer-detail','买家 · 详情与补证'],['merchant-list','商家 · 售后工单'],['merchant-detail','商家 · 审核详情']];const nav=document.querySelector('nav');pages.forEach(([key,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.key=key;b.onclick=()=>{location.hash=key};nav.append(b)});function show(){const p=pages.find(p=>p[0]===location.hash.slice(1))||pages[0];document.querySelector('#preview').src='images/'+p[0]+'.png';document.querySelector('#preview').alt=p[1]+'预期图';document.querySelector('#original').href='images/'+p[0]+'.png';nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===p[0])))}addEventListener('hashchange',show);show()</script></html>
