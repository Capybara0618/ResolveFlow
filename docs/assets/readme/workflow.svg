<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
<title id="title">从购物到退款的业务流程</title><desc id="desc">买家购物与咨询，Agent调查，买家确认建单，商家审批，Java执行模拟退款。</desc>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="1278" height="328" rx="20" fill="#f7fafc" stroke="#dce6ef"/>
<text x="34" y="47" font-size="29" fill="#152d46" font-weight="700" text-anchor="start">从一笔订单，到一次有依据的处理</text>
<text x="34" y="81" font-size="20" fill="#596f85" font-weight="400" text-anchor="start">用户确认申请，商家审核建议，Java 服务执行退款。</text>
<rect x="34" y="112" width="190" height="155" rx="14" fill="#ffffff" stroke="#cedfe9"/>
<circle cx="63" cy="141" r="15" fill="#e8f2ff"/>
<text x="63" y="147" font-size="17" fill="#2463a4" font-weight="700" text-anchor="middle">1</text>
<text x="88" y="147" font-size="17" fill="#668099" font-weight="400" text-anchor="start">买家</text>
<text x="50" y="192" font-size="23" fill="#152d46" font-weight="700" text-anchor="start">购物与结算</text>
<text x="50" y="229" font-size="17" fill="#5d7188" font-weight="400" text-anchor="start">商品 · 购物车 · 付款</text>
<text x="231" y="197" font-size="24" fill="#7498b6" font-weight="400" text-anchor="middle">›</text>
<rect x="238" y="112" width="190" height="155" rx="14" fill="#ffffff" stroke="#cedfe9"/>
<circle cx="267" cy="141" r="15" fill="#e8f2ff"/>
<text x="267" y="147" font-size="17" fill="#2463a4" font-weight="700" text-anchor="middle">2</text>
<text x="292" y="147" font-size="17" fill="#668099" font-weight="400" text-anchor="start">买家</text>
<text x="254" y="192" font-size="23" fill="#152d46" font-weight="700" text-anchor="start">售后咨询</text>
<text x="254" y="229" font-size="17" fill="#5d7188" font-weight="400" text-anchor="start">诉求 · 纠正 · 补充</text>
<text x="435" y="197" font-size="24" fill="#7498b6" font-weight="400" text-anchor="middle">›</text>
<rect x="442" y="112" width="190" height="155" rx="14" fill="#ffffff" stroke="#cedfe9"/>
<circle cx="471" cy="141" r="15" fill="#e8f2ff"/>
<text x="471" y="147" font-size="17" fill="#2463a4" font-weight="700" text-anchor="middle">3</text>
<text x="496" y="147" font-size="17" fill="#668099" font-weight="400" text-anchor="start">Agent</text>
<text x="458" y="192" font-size="23" fill="#152d46" font-weight="700" text-anchor="start">Agent 调查</text>
<text x="458" y="229" font-size="17" fill="#5d7188" font-weight="400" text-anchor="start">订单 · 物流 · 政策</text>
<text x="639" y="197" font-size="24" fill="#7498b6" font-weight="400" text-anchor="middle">›</text>
<rect x="646" y="112" width="190" height="155" rx="14" fill="#ffffff" stroke="#cedfe9"/>
<circle cx="675" cy="141" r="15" fill="#e8f2ff"/>
<text x="675" y="147" font-size="17" fill="#2463a4" font-weight="700" text-anchor="middle">4</text>
<text x="700" y="147" font-size="17" fill="#668099" font-weight="400" text-anchor="start">买家</text>
<text x="662" y="192" font-size="23" fill="#152d46" font-weight="700" text-anchor="start">确认与建单</text>
<text x="662" y="229" font-size="17" fill="#5d7188" font-weight="400" text-anchor="start">摘要 · 材料 · 版本</text>
<text x="843" y="197" font-size="24" fill="#7498b6" font-weight="400" text-anchor="middle">›</text>
<rect x="850" y="112" width="190" height="155" rx="14" fill="#ffffff" stroke="#cedfe9"/>
<circle cx="879" cy="141" r="15" fill="#e8f2ff"/>
<text x="879" y="147" font-size="17" fill="#2463a4" font-weight="700" text-anchor="middle">5</text>
<text x="904" y="147" font-size="17" fill="#668099" font-weight="400" text-anchor="start">商家</text>
<text x="866" y="192" font-size="23" fill="#152d46" font-weight="700" text-anchor="start">商家审批</text>
<text x="866" y="229" font-size="17" fill="#5d7188" font-weight="400" text-anchor="start">事实 · 依据 · 授权</text>
<text x="1047" y="197" font-size="24" fill="#7498b6" font-weight="400" text-anchor="middle">›</text>
<rect x="1054" y="112" width="190" height="155" rx="14" fill="#ffffff" stroke="#cedfe9"/>
<circle cx="1083" cy="141" r="15" fill="#d9f7ef"/>
<text x="1083" y="147" font-size="17" fill="#087f79" font-weight="700" text-anchor="middle">6</text>
<text x="1108" y="147" font-size="17" fill="#668099" font-weight="400" text-anchor="start">Java</text>
<text x="1070" y="192" font-size="23" fill="#152d46" font-weight="700" text-anchor="start">模拟退款</text>
<text x="1070" y="229" font-size="17" fill="#5d7188" font-weight="400" text-anchor="start">预留 · 执行 · 对账</text>
<text x="640" y="307" font-size="20" fill="#526e86" font-weight="400" text-anchor="middle">订单与政策有来源  /  申请材料有版本  /  退款执行有账本</text>
</g></svg>
