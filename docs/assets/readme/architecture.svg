<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc">
<title id="title">ResolveFlow 商城与售后并列架构</title>
<desc id="desc">Gateway按业务将购物交易请求直达Commerce，将账户、咨询与售后请求交给Case。账户模块暂部署在Case，Commerce通过受限协议实时复核当前身份和可信绑定。Case按需读取交易事实并调用Python Agent，退款命令与结果通过RocketMQ衔接。商品媒体文件暂保留Case。各自拥有业务数据库。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#638b7c"/></marker></defs>
<rect x="1" y="1" width="1278" height="1038" rx="24" fill="#f8faf6" stroke="#dce5da"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<text x="40" y="54" font-size="32" fill="#183b2d" font-weight="700" text-anchor="start">商城与售后，各自承接业务</text>
<text x="40" y="91" font-size="22" fill="#667d70" font-weight="400" text-anchor="start">Gateway 按业务分流 · Commerce 执行交易 · Case 管理咨询与授权</text>
<rect x="50" y="140" width="310" height="92" rx="18" fill="#edf4e9" stroke="#cbdcd0" stroke-width="1.5"/>
<text x="76" y="178" font-size="25" fill="#234b38" font-weight="700" text-anchor="start">Vue 3 · TypeScript</text>
<text x="76" y="212" font-size="21" fill="#344c41" font-weight="400" text-anchor="start">买家 / 商家 / 平台</text>
<rect x="470" y="140" width="340" height="92" rx="18" fill="#e2efdf" stroke="#cbdcd0" stroke-width="1.5"/>
<text x="496" y="178" font-size="28" fill="#234b38" font-weight="700" text-anchor="start">Gateway</text>
<text x="496" y="212" font-size="20" fill="#344c41" font-weight="400" text-anchor="start">路由 / 入口安全 / 请求追踪</text>
<path d="M 360 186 H 470" fill="none" stroke="#638b7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 570 232 V 280 H 320 V 330" fill="none" stroke="#638b7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="344" y="311" font-size="21" fill="#344c41" font-weight="400" text-anchor="start">购物 / 交易 / 评价</text>
<path d="M 710 232 V 280 H 960 V 330" fill="none" stroke="#638b7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="984" y="311" font-size="21" fill="#344c41" font-weight="400" text-anchor="start">账户 / 咨询 / 售后</text>
<rect x="50" y="330" width="540" height="275" rx="18" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5"/>
<text x="77" y="375" font-size="31" fill="#234b38" font-weight="700" text-anchor="start">Commerce</text>
<text x="77" y="416" font-size="23" fill="#344c41" font-weight="400" text-anchor="start">商品 / 购物车 / 结算 / 订单 / 评价</text>
<text x="77" y="457" font-size="22" fill="#344c41" font-weight="400" text-anchor="start">资金预留 / 退款执行 / 未知结果对账</text>
<path d="M 77 480 H 563" stroke="#deeadf"/>
<text x="77" y="519" font-size="22" fill="#344c41" font-weight="400" text-anchor="start">MySQL · commerce_db</text>
<text x="77" y="554" font-size="20" fill="#344c41" font-weight="400" text-anchor="start">Redis · 评价缓存 / 限流 / 热点协调</text>
<text x="77" y="587" font-size="19" fill="#667d70" font-weight="400" text-anchor="start">本地校验资源归属、金额、版本与幂等</text>
<rect x="690" y="330" width="540" height="275" rx="18" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5"/>
<text x="716" y="375" font-size="31" fill="#234b38" font-weight="700" text-anchor="start">Case</text>
<text x="716" y="416" font-size="23" fill="#344c41" font-weight="400" text-anchor="start">咨询 / 工单 / 材料 / 审批 / 授权</text>
<rect x="716" y="440" width="488" height="58" rx="18" fill="#eff5eb" stroke="#cbdcd0" stroke-width="1.5"/>
<text x="737" y="477" font-size="20" fill="#344c41" font-weight="400" text-anchor="start">账户模块 · 当前会话 / 主体绑定 / 地址</text>
<text x="716" y="534" font-size="22" fill="#344c41" font-weight="400" text-anchor="start">MySQL · case_db</text>
<text x="716" y="568" font-size="20" fill="#344c41" font-weight="400" text-anchor="start">Redis · 工作台缓存</text>
<text x="716" y="593" font-size="18" fill="#667d70" font-weight="400" text-anchor="start">商品媒体文件暂保留此进程</text>
<path d="M 590 470 H 690" fill="none" stroke="#638b7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="7 6"/>
<text x="640" y="424" font-size="18" fill="#344c41" font-weight="400" text-anchor="middle">身份</text>
<text x="640" y="447" font-size="18" fill="#344c41" font-weight="400" text-anchor="middle">复核</text>
<path d="M 850 605 V 650 H 400 V 605" fill="none" stroke="#638b7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="555" y="640" font-size="20" fill="#344c41" font-weight="400" text-anchor="middle">HTTP · 订单 / 物流事实</text>
<rect x="50" y="750" width="540" height="125" rx="18" fill="#e2efdf" stroke="#cbdcd0" stroke-width="1.5"/>
<text x="77" y="793" font-size="28" fill="#234b38" font-weight="700" text-anchor="start">RocketMQ</text>
<text x="77" y="832" font-size="22" fill="#344c41" font-weight="400" text-anchor="start">退款命令 / 结果 · Outbox / Inbox</text>
<text x="77" y="860" font-size="18" fill="#667d70" font-weight="400" text-anchor="start">至少一次投递 + 业务幂等</text>
<path d="M 210 605 V 750" fill="none" stroke="#638b7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="230" y="710" font-size="18" fill="#344c41" font-weight="400" text-anchor="start">退款执行 / 结果</text>
<path d="M 730 605 V 694 H 625 V 812 H 590" fill="none" stroke="#638b7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="640" y="721" font-size="18" fill="#344c41" font-weight="400" text-anchor="start">授权</text>
<rect x="690" y="750" width="540" height="175" rx="18" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5"/>
<text x="716" y="793" font-size="29" fill="#234b38" font-weight="700" text-anchor="start">Python Agent</text>
<text x="716" y="831" font-size="21" fill="#344c41" font-weight="400" text-anchor="start">AgentScope / Harness / 受限工具 / RAG</text>
<text x="716" y="868" font-size="22" fill="#344c41" font-weight="400" text-anchor="start">PostgreSQL / pgvector</text>
<text x="716" y="904" font-size="19" fill="#667d70" font-weight="400" text-anchor="start">run / checkpoint / 调用记录 / 政策索引</text>
<path d="M 1045 605 V 750" fill="none" stroke="#638b7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="1065" y="680" font-size="19" fill="#344c41" font-weight="400" text-anchor="start">调度 / 回调</text>
<text x="1065" y="713" font-size="19" fill="#344c41" font-weight="400" text-anchor="start">受限事实读取</text>
<text x="640" y="978" font-size="23" fill="#234b38" font-weight="700" text-anchor="middle">Java 掌握权限、授权与资金；Agent 提供调查与建议。</text>
<text x="640" y="1015" font-size="19" fill="#667d70" font-weight="400" text-anchor="middle">三个 Java 进程 + Python Agent · 账户暂部署在 Case · 支付、物流与退款为模拟</text>
</g></svg>