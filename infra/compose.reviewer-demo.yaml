# Reviewer demonstration stack: a disjoint copy of the local core infrastructure.
#
# Authority: tasks/dsh-reviewer/02-demo-chain.md section 3. The point of this file is
# not a new topology but an *isolated* one. It fixes its own compose project
# (`resolveflow-review-demo`), its own named volumes, its own host ports and its own
# RocketMQ broker, so nothing a demonstration does can read or write the data the
# shared `resolveflow` project holds (`infra/compose.yaml`).
#
# What is reused on purpose: the images, their digests (infra/versions.lock.yaml), the
# MySQL/PostgreSQL init scripts, the RocketMQ broker config and entrypoint, and Flyway
# inside the services. No business database snapshot is copied, no volume is shared.
#
# Every host port is bound to 127.0.0.1 and is deliberately one away from the shared
# stack's: running both at once must be possible. DEMO_* names keep this file from
# picking up infra/.env, which belongs to the shared project.
#
# The four application processes (gateway, case-service, commerce-service) and the
# Agent run from the host under `scripts/reviewer_demo.py`, bound to the demo ports
# below. That is a stated choice, not an omission: the shared project already runs the
# four application containers, this machine's Docker VM has ~7.9 GB, and a second copy
# of them would compete for memory with the stack this demonstration must not disturb.
# A host-run process reaches exactly these demo endpoints; the isolation that matters
# (own databases, own broker, own provider file, own policy index) is the same either
# way, and `scripts/reviewer_demo.py status` reports which ports each demo process owns.
#
# Verify the merged result before starting it:
#   docker compose -f infra/compose.reviewer-demo.yaml config
name: resolveflow-review-demo

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${DEMO_MYSQL_PORT:-3307}:3306"
    volumes:
      - demo-mysql-data:/var/lib/mysql
      # The same controlled bootstrap the shared stack uses: commerce_db/case_db and
      # their least-privilege accounts. Reused rather than copied so the two stacks
      # cannot drift about what a schema is allowed to see.
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DEMO_MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    # The Agent's own database: policy index and run records. Own volume, own port.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER:-agent}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-agent}
      POSTGRES_DB: ${PG_DB:-agent_db}
    ports:
      - "127.0.0.1:${DEMO_PG_PORT:-55433}:5432"
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-agent} -d ${PG_DB:-agent_db}"]
      interval: 5s
      timeout: 5s
      retries: 30

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.3
    command: ["nameserver"]
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "127.0.0.1:${DEMO_ROCKETMQ_NAMESRV_PORT:-9877}:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.3
    # The shared broker config and entrypoint, unchanged. The entrypoint appends
    # brokerIP1 and (when asked) the listen ports at start-up, because the image
    # cannot substitute environment variables inside a mounted config file.
    entrypoint: ["/bin/bash", "/home/rocketmq/broker-entrypoint.sh"]
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # Host-run demo processes are the clients, so 127.0.0.1 is the address they can
      # actually reach. The listen ports are moved off the shared stack's 10911/10909
      # so both brokers can run at the same time; the broker registers
      # 127.0.0.1:<listenPort> with the name server, which is the address a client uses.
      BROKER_IP1: ${DEMO_BROKER_IP1:-127.0.0.1}
      BROKER_LISTEN_PORT: ${DEMO_ROCKETMQ_BROKER_PORT:-10912}
      BROKER_HA_LISTEN_PORT: ${DEMO_ROCKETMQ_BROKER_HA_PORT:-10913}
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf.base:ro
      - ./rocketmq/broker-entrypoint.sh:/home/rocketmq/broker-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${DEMO_ROCKETMQ_BROKER_PORT:-10912}:${DEMO_ROCKETMQ_BROKER_PORT:-10912}"
      - "127.0.0.1:${DEMO_ROCKETMQ_BROKER_HA_PORT:-10913}:${DEMO_ROCKETMQ_BROKER_HA_PORT:-10913}"
    depends_on:
      - rocketmq-namesrv

volumes:
  # Named volumes of their own project: `resolveflow-review-demo_demo-mysql-data` and
  # `..._demo-postgres-data`. Distinct names are the isolation guarantee — a cleared
  # shared volume cannot be reached from here by accident, and `down -v` here cannot
  # touch the shared stack.
  demo-mysql-data:
  demo-postgres-data:
