    org.mybatis:mybatis: {version: "3.5.19", status: verified}
    org.mybatis:mybatis-spring: {version: "4.1.0", status: verified}
    org.flywaydb:flyway-core: {version: "11.14.1", status: verified}
    org.flywaydb:flyway-mysql: {version: "11.14.1", status: verified}
    com.mysql:mysql-connector-j: {version: "9.7.0", status: verified}
    org.springframework.boot:spring-boot-flyway:
      version: "4.0.8"
      status: verified
      note: >-
        Boot 4 moved autoconfiguration out of spring-boot-autoconfigure into
        per-technology modules. Without this artifact Flyway silently never runs
        (no error, no migration, no log line).

  registry_and_resilience:
    com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery: {version: "2025.1.0.0", status: verified}
