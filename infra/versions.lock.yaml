      version: "5.3.1"
      scope: "classic remoting client, SCA-managed"
      status: verified
      note: >-
        Chosen over rocketmq-client-java (gRPC), which requires deploying the
        gRPC proxy. There is no 'spring-cloud-starter-alibaba-rocketmq' artifact
        in any published version; the SCA RocketMQ starters are Stream binders.

  serialization:
    tools.jackson.core:jackson-databind: {version: "3.1.5", status: verified, note: "Boot 4 default"}
    com.fasterxml.jackson.core:jackson-databind: {version: "2.21.5", status: resolved, note: "pulled in by Flyway; coexists with Jackson 3"}

  test:
    org.testcontainers:testcontainers: {version: "2.0.5", status: verified}
    org.testcontainers:testcontainers-mysql: {version: "2.0.5", status: verified}
    org.testcontainers:testcontainers-junit-jupiter: {version: "2.0.5", status: verified}
    com.github.docker-java:docker-java-api: {version: "3.7.1", status: verified}
    note: >-
      Testcontainers 1.21.4 uses docker-java 3.4.2, which negotiates an API
      version Docker Engine 29 rejects (server MinAPI 1.40) with HTTP 400.
      Testcontainers 2.x is required on this Docker version.

