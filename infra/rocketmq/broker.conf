# RocketMQ broker configuration (T00 finding: brokerIP1 is mandatory, otherwise
# the broker advertises its container-internal IP and clients outside the compose
# network cannot reach it — see docs/compatibility-report.md 5.11).
#
# brokerIP1 must be the address clients use, and that differs by how the caller runs:
#   - Java services and tests run from the host  -> 127.0.0.1 (default)
#   - Java services run in the app profile       -> rocketmq-broker
# Override with the BROKER_IP1 environment variable when starting the stack.

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
namesrvAddr = rocketmq-namesrv:9876
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# Local development convenience: the first send creates the topic. Production
# topic creation is an operator action, not something a producer should trigger.
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
