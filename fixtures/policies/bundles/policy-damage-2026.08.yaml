# 2026.08 版破损退款政策（合成数据）· 第二个商家
#
# 这个 bundle 存在的理由不是"再放一份政策"，而是让 C07.1 的两条过滤可以被**证伪**：
#   * 同一时刻它和 M-1001 的政策同时生效 → 没有商家硬过滤时，按支付时间选版本会在两边挑，
#     检索也会把 M-1001 的段落排到 M-2002 的查询前面；
#   * 它和 2026.09 版是同一商家的两个历史版本 → 版本过滤必须由 manifest 钉住的 bundle 决定，
#     而不是由"哪一版分高"决定。
#
# 破损类（DAMAGED）政策的共同点：**图片证据是必要条件**，而物流类政策完全不看图片。这正是
# "近似文本"的来源——两套政策都写着"可退款"，但触发条件不同，跨商家召回会让答案看似合理却错。
bundle_id: policy-damage-2026.08
merchant_id: M-2002
version: "2026.08"
safety_epoch: 1
effective_from: "2026-08-01T00:00:00Z"
effective_to: "2026-09-01T00:00:00Z"
rules:
  - rule_id: R-DMG-001
    title: 到货破损
    text: 客户提交的到货破损图片经核验有效时，可按该订单行支付金额全额退款。
  - rule_id: R-DMG-IMG-001
    title: 破损图片要求
    text: 图片必须能看清破损部位与外包装，且拍摄时间不晚于签收后 48 小时，否则视为证据不足，转人工。
  - rule_id: R-DMG-EXC-001
    title: 破损规则的例外：易碎品
    text: 例外：标注为易碎品的订单行在运输中破损不予自动退款，须由人工核验包装方式后决定。
  - rule_id: R-DMG-SIGNED-001
    title: 破损与已签收
    text: 存在有效签收记录且签收时未提出破损异议时，不予自动退款；客户主张内部破损的须由人工核验。
  - rule_id: R-DMG-PARTIAL-001
    title: 破损部分退款
    text: 同一订单行仅有部分商品破损且可单独计价时，按破损部分金额退款，不得超过该行支付金额。
