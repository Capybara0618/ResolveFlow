# 2026.09 版破损退款政策（合成数据）· 第二个商家
#
# 2026.08 的延续：图片要求被写成可判定的窗口（签收后 48 小时改为以承运商签收时间戳为准），
# 易碎品例外从"不得自动退款"改成"必须人工核验并记录包装结论"，新增一条"重复破损"的判定。
bundle_id: policy-damage-2026.09
merchant_id: M-2002
version: "2026.09"
safety_epoch: 2
effective_from: "2026-09-01T00:00:00Z"
effective_to: null
rules:
  - rule_id: R-DMG-001
    title: 到货破损
    text: 客户提交的到货破损图片经核验有效时，可按该订单行支付金额全额退款。
  - rule_id: R-DMG-IMG-001
    title: 破损图片要求
    text: 图片必须能看清破损部位与外包装，拍摄时间以承运商签收时间戳起算 48 小时内为准，超出窗口视为证据不足，转人工。
  - rule_id: R-DMG-EXC-001
    title: 破损规则的例外：易碎品
    text: 例外：标注为易碎品的订单行在运输中破损不得自动退款，必须由人工核验并在结论中记录包装方式。
  - rule_id: R-DMG-SIGNED-001
    title: 破损与已签收
    text: 存在有效签收记录且签收时未提出破损异议时，不予自动退款；客户主张内部破损的须由人工核验。
  - rule_id: R-DMG-PARTIAL-001
    title: 破损部分退款
    text: 同一订单行仅有部分商品破损且可单独计价时，按破损部分金额退款，不得超过该行支付金额。
  - rule_id: R-DMG-REPEAT-001
    title: 重复破损
    text: 同一订单行在 30 天内出现第二次破损主张时，不再自动退款，必须由人工核验历史记录后决定。
