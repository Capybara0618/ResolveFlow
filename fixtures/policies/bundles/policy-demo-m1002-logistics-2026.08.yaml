# 独立M-1002合成物流政策；原M-1001/M-2002政策及已绑定工单保持不变。
# 2026.08 版物流退款政策（合成数据）
#
# 一个 bundle 是一份不可变规则集：改内容等于换版本。生效区间用于按"支付时间"选择版本。
# merchant_id 是 bundle 身份的一部分（C07.1），不是旁边的元数据：它进 manifest hash，也进
# `case_policy_manifest`，所以"这套政策属于谁"与"选中的是哪一版"是同一个固定下来的事实。
#
# 区间可以与**别的商家**重叠：同一时刻两个商家各有一套政策不是歧义，导入校验因而按商家比较
# （PolicyWriter.requireNoAmbiguity）。同一个商家在同一时刻有两套才是歧义。
bundle_id: policy-demo-m1002-logistics-2026.08
merchant_id: M-1002
version: "2026.08"
safety_epoch: 1
effective_from: "2026-08-01T00:00:00Z"
effective_to: "2026-09-01T00:00:00Z"
rules:
  - rule_id: R-LOST-001
    title: 承运商判定丢失
    text: 承运商结论为 LOST 且无有效签收记录时，可按该订单行支付金额全额退款。
  - rule_id: R-SIGNED-001
    title: 已签收
    text: 存在有效签收记录时不予退款；客户主张未收到时须由人工核验后再决定。
  - rule_id: R-DELAY-001
    title: 超时未达
    text: 承运商结论为 DELAYED 且超过承诺时效 7 天时，可由人工核验后按行支付金额退款。
  - rule_id: R-RETURN-001
    title: 退回在途
    text: 承运商结论为 RETURNED 且货物仍在退回途中时，须等待退回签收后再判断，不得先行退款。
  - rule_id: R-LOST-EXC-001
    title: 丢失规则的例外：高价值行
    text: 例外：本规则不适用于支付金额超过 500000 分的订单行，此类行即使结论为 LOST 也必须由人工核验后决定。
