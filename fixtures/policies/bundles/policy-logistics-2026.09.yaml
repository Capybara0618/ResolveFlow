# 2026.09 版物流退款政策（合成数据）
#
# 与 2026.08 的差别是真实业务里会发生的那一类：新增一条"无签收且超过 7 天无扫描"的判定，
# 把人工核验的门槛写清楚，并把丢失规则的例外从"由人工核验后决定"改成明确禁止自动退款。
# 历史订单仍按其支付时间走 2026.08，不会被这一版套用。
#
# 这一版与 2026.08 的 R-LOST-001 正文完全相同，且**同一个 rule_id 在两版里存在**：这是刻意的，
# 因为引用校验要能区分"同一句话说在两个版本里"（`content_hash` 把 bundle_id 也算进去，所以两个
# 引用不同），检索的版本过滤也必须证明它真的按版本过滤，而不是碰巧只召回了一版。
bundle_id: policy-logistics-2026.09
merchant_id: M-1001
version: "2026.09"
safety_epoch: 2
effective_from: "2026-09-01T00:00:00Z"
effective_to: null
rules:
  - rule_id: R-LOST-001
    title: 承运商判定丢失
    text: 承运商结论为 LOST 且无有效签收记录时，可按该订单行支付金额全额退款。
  - rule_id: R-SIGNED-001
    title: 已签收
    text: 存在有效签收记录时不予退款；客户主张未收到时须由人工核验后再决定。
  - rule_id: R-DELAY-001
    title: 超时未达
    text: 承运商结论为 DELAYED 且超过承诺时效 7 天时，可由人工核验后按行支付金额退款。
  - rule_id: R-RETURN-001
    title: 退回在途
    text: 承运商结论为 RETURNED 且货物仍在退回途中时，须等待退回签收后再判断，不得先行退款。
  - rule_id: R-NOSCAN-7D
    title: 七天无扫描
    text: 承运商无有效签收且连续 7 天无扫描记录时，视同丢失，可按该订单行支付金额全额退款。
  - rule_id: R-PARTIAL-001
    title: 部分退款
    text: 同一订单行已发生部分退款时，只可退未退部分，且不得超过该行支付金额。
  - rule_id: R-LOST-EXC-001
    title: 丢失规则的例外：高价值行
    text: 例外：本规则不适用于支付金额超过 500000 分的订单行，此类行即使结论为 LOST 也不得自动退款，必须转人工。
